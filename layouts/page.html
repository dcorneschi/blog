{{- /* Site override of the theme's page.html: adds comments (giscus) below the post footer. */ -}}
{{ define "title" }}
    {{ .Title }} &ndash; {{ .Site.Title }}
{{ end }}

{{ define "main" }}

    <div class="container mt-3 mb-3">
        {{- partial "content.html" . -}}
        {{- partial "post_footer.html" . -}}
        {{- partial "comments.html" . -}}
    </div>

{{ end }}
