name: Build and deploy Hugo site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *" # daily rebuild, keeps "Recently Watched" on the About page current

permissions:
  contents: read
  pages: write
  id-token: write

# PR builds cancel each other; production deploys are never cancelled mid-flight
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
      DART_SASS_VERSION: 1.107.0
      HUGO_ENVIRONMENT: production
      TZ: UTC
    steps:
      - name: Install Hugo (extended, needed for css.Sass)
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      # css.Sass uses the dartsass transpiler (layouts/_partials/head.html), LibSass is deprecated
      - name: Install Dart Sass
        run: |
          wget -q -O "${{ runner.temp }}/dart-sass.tar.gz" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${{ runner.temp }}" -xzf "${{ runner.temp }}/dart-sass.tar.gz"
          echo "${{ runner.temp }}/dart-sass" >> "${GITHUB_PATH}"
          "${{ runner.temp }}/dart-sass/sass" --version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # full history needed for enableGitInfo (lastmod dates)

      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
            resources/_gen
          key: hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('assets/**', 'themes/**/assets/**') }}
          restore-keys: hugo-${{ env.HUGO_VERSION }}-

      # baseURL comes from hugo.toml (the Pages base_url output is http:// until HTTPS is enforced)
      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          hugo build \
            --gc \
            --minify \
            --panicOnWarning

      # Static search index for /search/ (only elements with data-pagefind-body, see layouts/page.html)
      - name: Build search index (Pagefind)
        run: npx --yes pagefind@1.5.2 --site public

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
