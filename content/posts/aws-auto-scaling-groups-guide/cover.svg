<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Amazon EC2 Auto Scaling Groups</title>
  <desc id="d">Amazon EC2 Auto Scaling Groups: Capacity, scaling policies, lifecycle hooks and instance refresh. Small drawings: Pending:Wait, InService and Terminating:Wait lifecycle states; a terminal running aws autoscaling start-instance-refresh and describe-scaling-activities; a group of instances between min and max with scale-out and scale-in arrows; icons for target tracking, lifecycle hooks and instance refresh; small icons for launch templates, Availability Zones, scheduled scaling, warm pools, Spot, health checks and the CLI.</desc>
  <defs>
    <style>
      .bg  { fill: #f8f9fa; }
      .a   { fill: #f59f00; }
      .a2  { fill: #232f3e; }
      .al  { stroke: #f59f00; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ink { fill: #343a40; }
      .h   { font-weight: 700; fill: #212529; letter-spacing: -2px; }
      .s   { fill: #495057; }
      .n   { fill: #868e96; }
      .r   { stroke: #dee2e6; stroke-width: 2; }
      .pn  { fill: #ffffff; stroke: #adb5bd; stroke-width: 5; }
      .pv  { fill: #f3effc; stroke: #a98eda; stroke-width: 5; }
      .pg  { fill: #e8f5ee; stroke: #75b798; stroke-width: 5; }
      .frm { fill: none; stroke: #adb5bd; stroke-width: 6; stroke-dasharray: 18 12; }
      .term{ fill: #212529; }
      .tbar{ fill: #343a40; }
      .tx  { fill: #e9ecef; }
      .mono{ font-family: Menlo, Consolas, 'Liberation Mono', monospace; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #161b22; }
        .a2  { fill: #8b949e; }
        .ink { fill: #c9d1d9; }
        .h   { fill: #f0f6fc; }
        .s   { fill: #c9d1d9; }
        .n   { fill: #8b949e; }
        .r   { stroke: #30363d; }
        .pn  { fill: #0d1117; stroke: #484f58; }
        .pv  { fill: #1f1830; stroke: #7d63b0; }
        .pg  { fill: #0f2a1d; stroke: #3d8b63; }
        .frm { stroke: #484f58; }
        .term{ fill: #0d1117; stroke: #30363d; stroke-width: 4; }
        .tbar{ fill: #21262d; }
      }
    </style>
  </defs>
  <rect class="bg" width="2752" height="1536"/>

  <!-- top left: lifecycle states and terminal -->
  <g class="mono" font-size="28" font-weight="700" text-anchor="middle">
    <rect class="pv" x="131" y="198" width="250" height="66" rx="33"/><text class="ink" x="256" y="241">Pending:Wait</text>
    <path class="al" stroke-width="7" d="M389,231 H423 M409,217 L423,231 L409,245"/>
    <rect class="pg" x="431" y="198" width="200" height="66" rx="33"/><text class="ink" x="531" y="241">InService</text>
    <path class="al" stroke-width="7" d="M639,231 H673 M659,217 L673,231 L659,245"/>
    <rect class="pv" x="681" y="198" width="320" height="66" rx="33"/><text class="ink" x="841" y="241">Terminating:Wait</text>
  </g>
  <text class="n mono" x="566" y="318" text-anchor="middle" font-size="30">lifecycle hooks, default 3,600 s</text>
  <rect class="term" x="131" y="400" width="880" height="190" rx="20"/>
  <rect class="tbar" x="131" y="400" width="880" height="50" rx="20"/>
  <rect class="tbar" x="131" y="430" width="880" height="20"/>
  <circle cx="171" cy="425" r="11" fill="#ff5f57"/><circle cx="211" cy="425" r="11" fill="#febc2e"/><circle cx="251" cy="425" r="11" fill="#28c840"/>
  <text class="tx mono" x="163" y="505" font-size="28">$ aws autoscaling start-instance-refresh</text>
  <text class="tx mono" x="163" y="558" font-size="28">$ aws autoscaling describe-scaling-activities<tspan class="a">█</tspan></text>

  <!-- center: group of instances between min and max -->
  <g transform="translate(1376,0)">
    <rect class="frm" x="-250" y="250" width="500" height="290" rx="30"/>
    <rect class="a" x="-200" y="300" width="110" height="80" rx="12"/>
    <rect class="a" x="-55" y="300" width="110" height="80" rx="12"/>
    <rect class="a" x="90" y="300" width="110" height="80" rx="12" opacity=".45"/>
    <rect class="a" x="-200" y="410" width="110" height="80" rx="12"/>
    <rect class="a" x="-55" y="410" width="110" height="80" rx="12" opacity=".45"/>
    <rect class="a" x="90" y="410" width="110" height="80" rx="12" opacity=".45"/>
    <g fill="#fff"><rect x="-182" y="330" width="74" height="10" rx="5"/><rect x="-37" y="330" width="74" height="10" rx="5"/><rect x="-182" y="440" width="74" height="10" rx="5"/></g>
    <path class="al" stroke-width="16" d="M310,470 V320 M270,360 L310,320 L350,360"/>
    <path class="al" stroke-width="16" d="M-310,320 V470 M-350,430 L-310,470 L-270,430"/>
    <text class="n mono" x="0" y="590" text-anchor="middle" font-size="32">min 2 · desired 3 · max 6</text>
  </g>

  <!-- top right: three feature icons -->
  <g transform="translate(1795,190) scale(1.15)">
    <path class="al" stroke-width="18" d="M24,150 A76,76 0 0 1 176,150"/>
    <path class="al" stroke-width="14" d="M100,150 L140,96"/>
    <circle class="a" cx="100" cy="150" r="14"/>
  </g>
  <text class="n" x="1910" y="470" text-anchor="middle" font-size="32">target tracking</text>
  <g transform="translate(2065,190) scale(1.15)">
    <path class="al" stroke-width="18" d="M100,24 V120 A40,40 0 1 1 60,160"/>
    <circle class="a" cx="100" cy="24" r="16"/>
  </g>
  <text class="n" x="2180" y="470" text-anchor="middle" font-size="32">lifecycle hooks</text>
  <g transform="translate(2335,190) scale(1.15)">
    <path class="al" stroke-width="16" d="M166,88 A68,68 0 0 0 44,62 M34,112 A68,68 0 0 0 156,138"/>
    <path class="al" stroke-width="16" d="M30,30 L44,64 L78,52 M170,170 L156,136 L122,148"/>
  </g>
  <text class="n" x="2450" y="470" text-anchor="middle" font-size="32">instance refresh</text>

  <text class="h" x="1376" y="880" text-anchor="middle" font-size="140">Amazon EC2 Auto Scaling Groups</text>
  <text class="s" x="1376" y="1030" text-anchor="middle" font-size="88">Capacity, scaling, lifecycle hooks and instance refresh</text>
  <line class="r" x1="776" y1="1105" x2="1976" y2="1105"/>
  <text class="n" x="1376" y="1210" text-anchor="middle" font-size="47">target tracking · termination policies · warm pools · mixed Spot · rollback · CLI 2.39.3</text>

  <!-- bottom row: small icons -->
  <g transform="translate(546,1290) scale(0.5)"><path class="al" stroke-width="14" d="M44,14 H126 L162,50 V186 H44 Z"/><path class="al" stroke-width="10" d="M66,90 H140 M66,120 H140 M66,150 H118"/></g>
  <text class="n" x="596" y="1450" text-anchor="middle" font-size="34">launch template</text>
  <g transform="translate(806,1290) scale(0.5)"><rect class="al" x="16" y="40" width="76" height="120" rx="12" stroke-width="12"/><rect class="al" x="108" y="40" width="76" height="120" rx="12" stroke-width="12"/><rect class="a" x="34" y="70" width="40" height="30" rx="6"/><rect class="a" x="126" y="70" width="40" height="30" rx="6"/></g>
  <text class="n" x="856" y="1450" text-anchor="middle" font-size="34">AZ balance</text>
  <g transform="translate(1066,1290) scale(0.5)"><rect class="al" x="24" y="40" width="152" height="140" rx="16" stroke-width="14"/><path class="al" stroke-width="14" d="M24,84 H176 M64,20 V56 M136,20 V56"/><rect class="a" x="56" y="110" width="30" height="26" rx="4"/></g>
  <text class="n" x="1116" y="1450" text-anchor="middle" font-size="34">scheduled</text>
  <g transform="translate(1326,1290) scale(0.5)"><path class="a" d="M100,20 C140,70 160,100 160,130 A60,60 0 0 1 40,130 C40,100 70,80 80,50 C95,80 100,90 112,100 C112,70 106,45 100,20 Z"/></g>
  <text class="n" x="1376" y="1450" text-anchor="middle" font-size="34">warm pool</text>
  <g transform="translate(1586,1290) scale(0.5)"><path class="a" d="M20,40 H110 L180,110 L110,180 L20,180 Z"/><circle cx="60" cy="80" r="14" fill="#fff"/></g>
  <text class="n" x="1636" y="1450" text-anchor="middle" font-size="34">Spot</text>
  <g transform="translate(1846,1290) scale(0.5)"><path class="a" d="M100,180 C40,140 20,110 20,76 A40,40 0 0 1 100,60 A40,40 0 0 1 180,76 C180,110 160,140 100,180 Z"/><path d="M50,100 H80 L92,74 L110,126 L122,100 H150" stroke="#fff" stroke-width="10" fill="none" stroke-linejoin="round"/></g>
  <text class="n" x="1896" y="1450" text-anchor="middle" font-size="34">health checks</text>
  <g transform="translate(2106,1290) scale(0.5)"><path class="al" stroke-width="18" d="M40,60 L90,100 L40,140 M110,150 H170"/></g>
  <text class="n" x="2156" y="1450" text-anchor="middle" font-size="34">CLI</text>
</svg>
