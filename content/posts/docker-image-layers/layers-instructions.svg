<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 550" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Every instruction becomes a layer or a line in the config</title>
  <desc id="d">The demo Dockerfile: FROM gives the 8.82 MB Alpine layer; WORKDIR, two RUN and two COPY instructions add five more layers; LABEL, ENV, EXPOSE, USER and CMD only write fields of the image config. The image has 6 layers.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .th  { font-size: 12px; font-weight: 700; fill: #212529; }
      .ths { font-size: 10.5px; fill: #495057; }
      .m   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; }
      .mb  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11.5px; font-weight: 700; fill: #212529; }
      .d   { font-size: 11px; fill: #495057; }
      .c   { font-size: 11px; fill: #212529; }
      .num { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .lne { stroke: #495057; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .dash{ stroke: #868e96; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .tick{ stroke: #495057; stroke-width: 1.2; }
      .r   { fill: #e7f1ff; stroke: #6ea8fe; }
      .w   { fill: #ffe5cc; stroke: #fd9843; }
      .rw  { fill: #f3effc; stroke: #a98eda; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .x   { fill: #f8d7da; stroke: #e35d6a; }
      .n   { fill: #f8f9fa; stroke: #dee2e6; }
      .s   { fill: #ffffff; stroke: #adb5bd; }
    </style>
  </defs>
  <rect width="920" height="550" fill="#ffffff"/>
  <text class="h" x="20" y="28">Every instruction becomes a layer or a line in the config</text>
  <text class="sub" x="20" y="44">The demo Dockerfile, sizes from docker history on the classic overlay2 store</text>
  <rect class="s" x="20" y="76" width="380" height="30" rx="4"/>
  <text class="m" x="32" y="96">FROM alpine:3.20</text>
  <path class="lne" d="M400,91 H446"/>
  <rect class="r" x="450" y="76" width="250" height="30" rx="4"/>
  <text class="c" x="462" y="96">8.82 MB  Alpine rootfs</text>
  <rect class="s" x="20" y="112" width="380" height="30" rx="4"/>
  <text class="m" x="32" y="132">LABEL org.opencontainers.image.title=…</text>
  <path class="dash" d="M400,127 H740"/>
  <text class="d" x="748" y="132">Labels</text>
  <rect class="s" x="20" y="148" width="380" height="30" rx="4"/>
  <text class="m" x="32" y="168">ENV APP_HOME=/app</text>
  <path class="dash" d="M400,163 H740"/>
  <text class="d" x="748" y="168">Env</text>
  <rect class="s" x="20" y="184" width="380" height="30" rx="4"/>
  <text class="m" x="32" y="204">WORKDIR /app</text>
  <path class="lne" d="M400,199 H446"/>
  <rect class="r" x="450" y="184" width="250" height="30" rx="4"/>
  <text class="c" x="462" y="204">0 B  creates /app</text>
  <rect class="s" x="20" y="220" width="380" height="30" rx="4"/>
  <text class="m" x="32" y="240">RUN head -c 20971520 /dev/urandom &gt; …</text>
  <path class="lne" d="M400,235 H446"/>
  <rect class="r" x="450" y="220" width="250" height="30" rx="4"/>
  <text class="c" x="462" y="240">21 MB  random.bin</text>
  <rect class="s" x="20" y="256" width="380" height="30" rx="4"/>
  <text class="m" x="32" y="276">COPY data.bin /app/data.bin</text>
  <path class="lne" d="M400,271 H446"/>
  <rect class="r" x="450" y="256" width="250" height="30" rx="4"/>
  <text class="c" x="462" y="276">10.5 MB  data.bin</text>
  <rect class="s" x="20" y="292" width="380" height="30" rx="4"/>
  <text class="m" x="32" y="312">COPY app.sh /app/app.sh</text>
  <path class="lne" d="M400,307 H446"/>
  <rect class="r" x="450" y="292" width="250" height="30" rx="4"/>
  <text class="c" x="462" y="312">38 B  app.sh</text>
  <rect class="s" x="20" y="328" width="380" height="30" rx="4"/>
  <text class="m" x="32" y="348">RUN chmod +x /app/app.sh</text>
  <path class="lne" d="M400,343 H446"/>
  <rect class="r" x="450" y="328" width="250" height="30" rx="4"/>
  <text class="c" x="462" y="348">38 B  app.sh again</text>
  <rect class="s" x="20" y="364" width="380" height="30" rx="4"/>
  <text class="m" x="32" y="384">EXPOSE 8080</text>
  <path class="dash" d="M400,379 H740"/>
  <text class="d" x="748" y="384">ExposedPorts</text>
  <rect class="s" x="20" y="400" width="380" height="30" rx="4"/>
  <text class="m" x="32" y="420">USER nobody</text>
  <path class="dash" d="M400,415 H740"/>
  <text class="d" x="748" y="420">User</text>
  <rect class="s" x="20" y="436" width="380" height="30" rx="4"/>
  <text class="m" x="32" y="456">CMD ["/app/app.sh"]</text>
  <path class="dash" d="M400,451 H740"/>
  <text class="d" x="748" y="456">Cmd</text>
  <text class="tb" x="748" y="64">image config (JSON, 0 B)</text>
  <text class="tb" x="450" y="64">filesystem layers</text>
  <text class="tb" x="450" y="490">6 layers</text>
  <text class="d" x="520" y="490">= docker image inspect --format '{{len .RootFS.Layers}}'</text>
  <text class="d" x="20" y="516">RUN, COPY and ADD (and WORKDIR, which creates the directory) add a filesystem layer; everything else only changes the config.</text>
  <text class="d" x="20" y="532">The base image's own instructions (its ADD rootfs and CMD) are part of the history too.</text>
</svg>
