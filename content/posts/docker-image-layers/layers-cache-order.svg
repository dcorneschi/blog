<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 386" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One changed source file, two Dockerfiles</title>
  <desc id="d">After changing one source file, Dockerfile.bad, which copies everything before the slow dependency step, reruns COPY and the 3-second RUN. Dockerfile.good copies requirements.txt first, so COPY requirements.txt and the slow RUN stay cached and only the final COPY runs.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .th  { font-size: 12px; font-weight: 700; fill: #212529; }
      .ths { font-size: 10.5px; fill: #495057; }
      .m   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; }
      .mb  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11.5px; font-weight: 700; fill: #212529; }
      .d   { font-size: 11px; fill: #495057; }
      .c   { font-size: 11px; fill: #212529; }
      .num { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .lne { stroke: #495057; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .dash{ stroke: #868e96; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .tick{ stroke: #495057; stroke-width: 1.2; }
      .r   { fill: #e7f1ff; stroke: #6ea8fe; }
      .w   { fill: #ffe5cc; stroke: #fd9843; }
      .rw  { fill: #f3effc; stroke: #a98eda; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .x   { fill: #f8d7da; stroke: #e35d6a; }
      .n   { fill: #f8f9fa; stroke: #dee2e6; }
      .s   { fill: #ffffff; stroke: #adb5bd; }
    </style>
  </defs>
  <rect width="840" height="386" fill="#ffffff"/>
  <text class="h" x="20" y="28">One changed source file, two Dockerfiles</text>
  <text class="sub" x="20" y="48">Rebuild after editing src/main.txt: everything after the first changed step runs again</text>
  <text class="tb" x="20" y="80">Dockerfile.bad</text>
  <rect class="n" x="20" y="92" width="380" height="34" rx="4"/>
  <text class="m" x="32" y="114">FROM alpine:3.20</text>
  <rect class="g" x="20" y="132" width="380" height="34" rx="4"/>
  <text class="m" x="32" y="154">WORKDIR /src</text>
  <text class="d" x="388" y="154" text-anchor="end">CACHED</text>
  <rect class="w" x="20" y="172" width="380" height="34" rx="4"/>
  <text class="m" x="32" y="194">COPY . .</text>
  <text class="d" x="388" y="194" text-anchor="end">runs</text>
  <rect class="w" x="20" y="212" width="380" height="34" rx="4"/>
  <text class="m" x="32" y="234">RUN sleep 3 &amp;&amp; cp requirements…</text>
  <text class="d" x="388" y="234" text-anchor="end">runs</text>
  <text class="tb" x="20" y="272">3 s: the slow step runs again</text>
  <text class="tb" x="440" y="80">Dockerfile.good</text>
  <rect class="n" x="440" y="92" width="380" height="34" rx="4"/>
  <text class="m" x="452" y="114">FROM alpine:3.20</text>
  <rect class="g" x="440" y="132" width="380" height="34" rx="4"/>
  <text class="m" x="452" y="154">WORKDIR /src</text>
  <text class="d" x="808" y="154" text-anchor="end">CACHED</text>
  <rect class="g" x="440" y="172" width="380" height="34" rx="4"/>
  <text class="m" x="452" y="194">COPY requirements.txt .</text>
  <text class="d" x="808" y="194" text-anchor="end">CACHED</text>
  <rect class="g" x="440" y="212" width="380" height="34" rx="4"/>
  <text class="m" x="452" y="234">RUN sleep 3 &amp;&amp; cp requirements…</text>
  <text class="d" x="808" y="234" text-anchor="end">CACHED</text>
  <rect class="w" x="440" y="252" width="380" height="34" rx="4"/>
  <text class="m" x="452" y="274">COPY . .</text>
  <text class="d" x="808" y="274" text-anchor="end">runs</text>
  <text class="tb" x="440" y="312">0 s: only the last COPY</text>
  <rect class="g" x="20" y="330" width="14" height="14" rx="3"/>
  <text class="d" x="40" y="341">CACHED: reused from the build cache</text>
  <rect class="w" x="300" y="330" width="14" height="14" rx="3"/>
  <text class="d" x="320" y="341">runs again: its input changed, or a step before it did</text>
  <text class="d" x="20" y="368">COPY is cached by the checksum of the copied files. Copy what changes rarely (dependency lists) first, the source code last.</text>
</svg>
