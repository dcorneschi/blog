<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">m7i.large: effective price per hour</title>
  <desc id="d">Effective hourly price of an m7i.large Linux instance in eu-west-1 from the AWS price lists of 4 November 2026, upfront payments spread over the term. Dedicated Instance On-Demand 0.12359 dollars plus 2 dollars per hour per Region; On-Demand 0.11235; Compute Savings Plan 1 year No Upfront 0.08528, 24 percent off; EC2 Instance Savings Plan or Standard Reserved Instance 1 year No Upfront 0.07432, 34 percent off; Spot at 08:27 0.0674, 40 percent off; Compute Savings Plan 3 years All Upfront 0.05356, 52 percent off; EC2 Instance Savings Plan 3 years All Upfront 0.04436, 61 percent off.</desc>
