<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 530" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What each method compares</title>
  <desc id="d">helm diff upgrade compares the deployed release with a new chart version; helm template twice and diff compares two chart versions without a cluster; helm diff revision compares two revisions; helm diff rollback compares the deployed release with an older revision; helm show values twice and diff compares the default values. helm diff upgrade with --allow-unreleased and no release does not compare versions: every resource shows as added.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c6f64"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .m   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; }
      .d   { font-size: 11px; fill: #3c3836; }
      .c   { font-size: 12px; fill: #212529; }
      .cb  { font-size: 12px; font-weight: 700; fill: #212529; }
      .bad { font-size: 11px; font-weight: 700; fill: #9d0006; }
      .lne { stroke: #7c6f64; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .o   { fill: #da905e; stroke: #af3a03; }
      .ol  { fill: #c8b661; stroke: #79740e; }
      .cr  { fill: #fae9ba; stroke: #d5c4a1; }
      .r   { fill: #e7f1ff; stroke: #6ea8fe; }
      .rw  { fill: #f3effc; stroke: #a98eda; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .w   { fill: #ffe5cc; stroke: #fd9843; }
      .x   { fill: #f8d7da; stroke: #e35d6a; }
      .n   { fill: #f8f9fa; stroke: #d5c4a1; }
      .s   { fill: #ffffff; stroke: #bdae93; }
    </style>
  </defs>
  <rect width="920" height="530" fill="#ffffff"/>
  <text class="h" x="20" y="28">What each method compares</text>
  <text class="sub" x="20" y="44">Left side vs right side, the command, and whether it needs the cluster</text>

  <text class="tb" x="20" y="74">compares</text>
  <text class="tb" x="250" y="74">with</text>
  <text class="tb" x="480" y="74">command</text>
  <text class="tb" x="840" y="74">cluster</text>

  <!-- 1 diff upgrade -->
  <rect class="o" x="20" y="88" width="200" height="44" rx="4"/>
  <text class="cb" x="32" y="106">deployed release</text>
  <text class="d" x="32" y="122">what runs now (3.12.2)</text>
  <path class="lne" d="M220,110 H246"/>
  <rect class="ol" x="250" y="88" width="200" height="44" rx="4"/>
  <text class="cb" x="262" y="106">chart 3.13.0</text>
  <text class="d" x="262" y="122">rendered with your values</text>
  <rect class="s" x="480" y="88" width="340" height="44" rx="4"/>
  <text class="m" x="492" y="106">helm diff upgrade metrics-server \</text>
  <text class="m" x="492" y="122">  metrics-server/metrics-server --version 3.13.0</text>
  <rect class="ol" x="840" y="98" width="60" height="24" rx="12"/>
  <text class="c" x="870" y="114" text-anchor="middle">yes</text>

  <!-- 2 template + diff -->
  <rect class="o" x="20" y="144" width="200" height="44" rx="4"/>
  <text class="cb" x="32" y="162">chart 3.12.2</text>
  <text class="d" x="32" y="178">helm template &gt; ms-3.12.2.yaml</text>
  <path class="lne" d="M220,166 H246"/>
  <rect class="ol" x="250" y="144" width="200" height="44" rx="4"/>
  <text class="cb" x="262" y="162">chart 3.13.0</text>
  <text class="d" x="262" y="178">helm template &gt; ms-3.13.0.yaml</text>
  <rect class="s" x="480" y="144" width="340" height="44" rx="4"/>
  <text class="m" x="492" y="162">helm template … --version A / B</text>
  <text class="m" x="492" y="178">diff -u ms-3.12.2.yaml ms-3.13.0.yaml</text>
  <rect class="cr" x="840" y="154" width="60" height="24" rx="12"/>
  <text class="c" x="870" y="170" text-anchor="middle">no</text>

  <!-- 3 diff revision -->
  <rect class="o" x="20" y="200" width="200" height="44" rx="4"/>
  <text class="cb" x="32" y="218">revision 1</text>
  <text class="d" x="32" y="234">stored by Helm in the cluster</text>
  <path class="lne" d="M220,222 H246"/>
  <rect class="ol" x="250" y="200" width="200" height="44" rx="4"/>
  <text class="cb" x="262" y="218">revision 2</text>
  <text class="d" x="262" y="234">stored by Helm in the cluster</text>
  <rect class="s" x="480" y="200" width="340" height="44" rx="4"/>
  <text class="m" x="492" y="226">helm diff revision metrics-server 1 2</text>
  <rect class="ol" x="840" y="210" width="60" height="24" rx="12"/>
  <text class="c" x="870" y="226" text-anchor="middle">yes</text>

  <!-- 4 diff rollback -->
  <rect class="o" x="20" y="256" width="200" height="44" rx="4"/>
  <text class="cb" x="32" y="274">deployed release</text>
  <text class="d" x="32" y="290">what runs now</text>
  <path class="lne" d="M220,278 H246"/>
  <rect class="ol" x="250" y="256" width="200" height="44" rx="4"/>
  <text class="cb" x="262" y="274">revision 1</text>
  <text class="d" x="262" y="290">what a rollback would restore</text>
  <rect class="s" x="480" y="256" width="340" height="44" rx="4"/>
  <text class="m" x="492" y="282">helm diff rollback metrics-server 1</text>
  <rect class="ol" x="840" y="266" width="60" height="24" rx="12"/>
  <text class="c" x="870" y="282" text-anchor="middle">yes</text>

  <!-- 5 show values -->
  <rect class="o" x="20" y="312" width="200" height="44" rx="4"/>
  <text class="cb" x="32" y="330">default values 3.12.2</text>
  <text class="d" x="32" y="346">helm show values</text>
  <path class="lne" d="M220,334 H246"/>
  <rect class="ol" x="250" y="312" width="200" height="44" rx="4"/>
  <text class="cb" x="262" y="330">default values 3.13.0</text>
  <text class="d" x="262" y="346">helm show values</text>
  <rect class="s" x="480" y="312" width="340" height="44" rx="4"/>
  <text class="m" x="492" y="330">helm show values … --version A / B</text>
  <text class="m" x="492" y="346">diff -u values-3.12.2.yaml values-3.13.0.yaml</text>
  <rect class="cr" x="840" y="322" width="60" height="24" rx="12"/>
  <text class="c" x="870" y="338" text-anchor="middle">no</text>

  <!-- trap -->
  <line x1="20" y1="376" x2="900" y2="376" stroke="#d5c4a1" stroke-width="1"/>
  <text class="tb" x="20" y="398">Not a version comparison</text>
  <rect class="cr" x="20" y="410" width="200" height="44" rx="4" stroke-dasharray="4 3"/>
  <text class="cb" x="32" y="428">no release</text>
  <text class="d" x="32" y="444">wrong namespace or not installed</text>
  <path class="lne" d="M220,432 H246"/>
  <rect class="ol" x="250" y="410" width="200" height="44" rx="4"/>
  <text class="cb" x="262" y="428">chart 3.13.0</text>
  <text class="bad" x="262" y="444">every resource shows as added</text>
  <rect class="s" x="480" y="410" width="340" height="44" rx="4"/>
  <text class="m" x="492" y="428">helm diff upgrade … --allow-unreleased</text>
  <text class="m" x="492" y="444">helm diff upgrade … --dry-run</text>
  <rect class="cr" x="840" y="420" width="60" height="24" rx="12"/>
  <text class="c" x="870" y="436" text-anchor="middle">–</text>

  <text class="d" x="20" y="484">Pass the same -n and --values to both sides, or the diff shows differences you caused yourself.</text>
  <text class="d" x="20" y="500">helm diff needs the helm-diff plugin and cluster access; helm template and helm show values only need the chart repository.</text>
  <text class="d" x="20" y="516">--allow-unreleased still talks to the cluster; --dry-run renders offline. Both compare against nothing.</text>
</svg>
