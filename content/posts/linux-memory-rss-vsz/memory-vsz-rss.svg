<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 596" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What VSZ and RSS count</title>
  <desc id="d">The address space of one process, region by region, drawn as pages. Program code is file-backed and loaded page by page on first use. The heap is reserved by malloc and gets RAM only for pages that are written; some heap pages are swapped out. Shared libraries are mapped whole, with only the pages in use in RAM. A memory-mapped file is page cache shared with other readers. The stack is reserved up to its limit with only the top in use. VSZ counts every mapped page (108). RSS counts resident pages, 9 private and 17 shared, shared ones in full. PSS splits shared pages among the processes using them. USS counts the 9 private pages, what killing the process would free. Swapped and never-touched pages are in VSZ only.</desc>
