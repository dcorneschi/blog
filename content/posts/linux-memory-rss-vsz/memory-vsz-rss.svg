  <text class="d" x="250" y="396">reserved up to the limit (ulimit -s), only the top is used</text>
  <rect x="20" y="428" width="860" height="128" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
  <text class="tb" x="36" y="452">Counting the 108 pages above</text>
  <text class="m" x="36" y="476">VSZ</text><text class="d" x="90" y="476">every page that is mapped: 108 pages, whether or not it is in RAM</text>
  <text class="m" x="36" y="496">RSS</text><text class="d" x="90" y="496">resident pages: 9 private + 17 shared = 26, shared pages counted in full</text>
  <text class="m" x="36" y="516">PSS</text><text class="d" x="90" y="516">9 private + each shared page divided by the number of processes using it</text>
  <text class="m" x="36" y="536">USS</text><text class="d" x="90" y="536">9 private pages: what killing this process would free</text>
  <text class="d" x="20" y="578">A sketch, not to scale: a real heap or mmap region can be thousands of times larger than the code, and VSZ grows with it.</text>
