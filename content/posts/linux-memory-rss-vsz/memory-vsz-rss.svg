  <text class="tb" x="482" y="70" style="font-size:12px">swapped out</text>
  <text class="d" x="482" y="86">VSZ only</text>
  <rect fill="#ffffff" stroke="#ced4da" stroke-dasharray="2 2" stroke-width="1.2" x="680" y="58" width="16" height="16" rx="3"/>
  <text class="tb" x="702" y="70" style="font-size:12px">mapped, never touched</text>
  <text class="d" x="702" y="86">VSZ only</text>
  <text class="tb" x="20" y="126">Program code</text>
  <text class="d" x="20" y="143">/usr/bin/app, file-backed</text>
