  <text class="tb" x="42" y="70" style="font-size:12px">resident, private</text>
  <text class="d" x="42" y="86">in RSS, PSS and USS</text>
  <rect fill="#ffe5cc" stroke="#fd9843" stroke-width="1.2" x="240" y="58" width="16" height="16" rx="3"/>
  <text class="tb" x="262" y="70" style="font-size:12px">resident, shared</text>
  <text class="d" x="262" y="86">in RSS in full, in PSS split</text>
