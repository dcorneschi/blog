  <title id="t">Linux Memory</title>
  <desc id="d">Linux Memory: RSS, VSZ and why RSS alone is misleading. VSZ, RSS, PSS, USS, shared pages, fork &amp; COW, smaps, smem, pmap. Small drawings: VSZ, RSS, PSS; a terminal running ps -eo pid,rss,cmd --sort=-rss and smem -r -k; RAM, shared pages, per process; icons for RSS, VSZ, shared pages, fork &amp; COW, smaps, smem, pmap.</desc>
