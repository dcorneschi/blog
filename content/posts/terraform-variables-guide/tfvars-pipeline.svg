<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 474" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How Terraform processes an input variable value</title>
  <desc id="d">Step 1, pick the value: the highest-priority source that sets it, else the default; with no value and no default Terraform prompts, or with -input=false fails with No value for required variable. Step 2, convert to the declared type or fail with Unsuitable value: a set drops duplicates, map(number) turns &quot;2&quot; into 2, an object drops extra attributes, optional attributes get their defaults. Step 3, handle null: with nullable true a null replaces the default, with nullable false a null means use the default. Step 4, run the validation blocks; each failing rule prints its own message and a rule may refer to other variables since 1.9. Step 5, apply the marks: sensitive values show as (sensitive value) but are stored in state; ephemeral values are never stored and are refused by normal resource arguments.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .d   { font-size: 11px; fill: #495057; }
      .c   { font-size: 11px; fill: #212529; }
      .m   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; }
      .mb  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; font-weight: 700; fill: #212529; }
      .ms  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #495057; }
      .lne { stroke: #495057; stroke-width: 1.4; fill: none; marker-end: url(#a); }
      .r   { fill: #e7f1ff; stroke: #6ea8fe; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .w   { fill: #ffe5cc; stroke: #fd9843; }
      .rw  { fill: #f3effc; stroke: #a98eda; }
      .x   { fill: #f8d7da; stroke: #e35d6a; }
      .n   { fill: #f8f9fa; stroke: #dee2e6; }
      .s   { fill: #ffffff; stroke: #adb5bd; }
      .num { fill: #495057; }
      .numt{ font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>
  <rect width="840" height="474" fill="#ffffff"/>
  <text class="h" x="20" y="28">How Terraform processes an input variable value</text>
  <text class="sub" x="20" y="48">Before plan uses var.name; every behaviour below was observed with Terraform 1.17.1</text>
  <rect class="r" x="20" y="70" width="800" height="70" rx="6"/>
  <circle class="num" cx="40" cy="90" r="10"/><text class="numt" x="40" y="94">1</text>
  <text class="tb" x="60" y="94">Pick the value</text>
  <text class="d" x="60" y="112">the highest source that sets it, or the default</text>
  <text class="m" x="330" y="92">-var-file=prod.tfvars wins over TF_VAR_</text>
  <text class="m" x="330" y="108">nothing set and no default: prompt, or</text>
  <text class="m" x="330" y="124">with -input=false: No value for required variable</text>
  <path class="lne" d="M40,140 L40,152"/>
  <rect class="g" x="20" y="152" width="800" height="86" rx="6"/>
  <circle class="num" cx="40" cy="172" r="10"/><text class="numt" x="40" y="176">2</text>
  <text class="tb" x="60" y="176">Convert to the type</text>
  <text class="d" x="60" y="194">or fail with Unsuitable value</text>
  <text class="m" x="330" y="174">set(string): duplicates dropped, sorted</text>
  <text class="m" x="330" y="190">map(number): &quot;2&quot; becomes 2</text>
  <text class="m" x="330" y="206">object: extra attributes dropped</text>
  <text class="m" x="330" y="222">optional(..., default): defaults filled in</text>
  <path class="lne" d="M40,238 L40,250"/>
  <rect class="w" x="20" y="250" width="800" height="54" rx="6"/>
  <circle class="num" cx="40" cy="270" r="10"/><text class="numt" x="40" y="274">3</text>
  <text class="tb" x="60" y="274">Handle null</text>
  <text class="d" x="60" y="292">nullable decides</text>
  <text class="m" x="330" y="272">nullable = true (default): null replaces the default</text>
  <text class="m" x="330" y="288">nullable = false: null means use the default</text>
  <path class="lne" d="M40,304 L40,316"/>
  <rect class="x" x="20" y="316" width="800" height="70" rx="6"/>
  <circle class="num" cx="40" cy="336" r="10"/><text class="numt" x="40" y="340">4</text>
  <text class="tb" x="60" y="340">Run validation blocks</text>
  <text class="d" x="60" y="358">each failing rule prints its message</text>
  <text class="m" x="330" y="338">condition can use other variables (1.9+)</text>
  <text class="m" x="330" y="354">Invalid value for variable</text>
  <text class="m" x="330" y="370">│ var.instance_count is 0</text>
  <path class="lne" d="M40,386 L40,398"/>
  <rect class="rw" x="20" y="398" width="800" height="54" rx="6"/>
  <circle class="num" cx="40" cy="418" r="10"/><text class="numt" x="40" y="422">5</text>
  <text class="tb" x="60" y="422">Apply the marks</text>
  <text class="d" x="60" y="440">follow every derived value</text>
  <text class="m" x="330" y="420">sensitive: (sensitive value) in plans, still in state</text>
  <text class="m" x="330" y="436">ephemeral: never stored; resource arguments refuse it</text>
</svg>
