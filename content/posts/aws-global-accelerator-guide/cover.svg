<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AWS Global Accelerator</title>
  <desc id="d">AWS Global Accelerator: static anycast IPs and multi-Region failover. Small drawings: ANYCAST, TCP and UDP pills; a terminal with create-accelerator and update-endpoint-group; three clients reaching one edge and two Regions; icons for the static IPs, traffic dial and failover; small icons for the edge, backbone, dials, weights, health checks, client IP and cost.</desc>
  <defs>
    <style>
      .bg  { fill: #f8f9fa; }
      .a   { fill: #f08c00; }
      .al  { stroke: #f08c00; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ink { fill: #343a40; }
      .h   { font-weight: 700; fill: #212529; letter-spacing: -2px; }
      .s   { fill: #495057; }
      .n   { fill: #868e96; }
      .r   { stroke: #dee2e6; stroke-width: 2; }
      .gl  { stroke: #adb5bd; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .bb  { stroke: #f08c00; stroke-width: 10; fill: none; stroke-linecap: round; }
      .pb  { fill: #e7f1ff; stroke: #6ea8fe; stroke-width: 5; }
      .pp  { fill: #f3effc; stroke: #a98eda; stroke-width: 5; }
      .po  { fill: #fff3cd; stroke: #ffc107; stroke-width: 5; }
      .cl  { fill: #ffffff; stroke: #adb5bd; stroke-width: 6; }
      .edge{ fill: #fff3cd; stroke: #ffc107; stroke-width: 6; }
      .rg  { fill: #e7f1ff; stroke: #6ea8fe; stroke-width: 6; }
      .term{ fill: #212529; }
      .tbar{ fill: #343a40; }
      .tx  { fill: #e9ecef; }
      .mono{ font-family: Menlo, Consolas, 'Liberation Mono', monospace; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #161b22; }
        .a   { fill: #ffa94d; }
        .al  { stroke: #ffa94d; }
        .bb  { stroke: #ffa94d; }
        .ink { fill: #c9d1d9; }
        .h   { fill: #f0f6fc; }
        .s   { fill: #c9d1d9; }
        .n   { fill: #8b949e; }
        .r   { stroke: #30363d; }
        .gl  { stroke: #6e7681; }
        .pb, .rg { fill: #0c1d33; stroke: #4a78b8; }
        .pp  { fill: #1f1633; stroke: #8a6fc0; }
        .po, .edge { fill: #2b2210; stroke: #b08a2e; }
        .cl  { fill: #0d1117; stroke: #484f58; }
        .term{ fill: #0d1117; stroke: #30363d; stroke-width: 4; }
        .tbar{ fill: #21262d; }
      }
    </style>
  </defs>
  <rect class="bg" width="2752" height="1536"/>

  <!-- top left: pills and terminal -->
  <g class="mono" font-size="28" font-weight="700" text-anchor="middle">
    <rect class="po" x="131" y="198" width="170" height="66" rx="33"/><text class="ink" x="216" y="241">ANYCAST</text>
    <rect class="pb" x="321" y="198" width="100" height="66" rx="33"/><text class="ink" x="371" y="241">TCP</text>
    <rect class="pp" x="441" y="198" width="100" height="66" rx="33"/><text class="ink" x="491" y="241">UDP</text>
  </g>
  <text class="n mono" x="131" y="318" font-size="30">two static IPs · every edge</text>
  <rect class="term" x="131" y="400" width="820" height="190" rx="20"/>
  <rect class="tbar" x="131" y="400" width="820" height="50" rx="20"/>
  <rect class="tbar" x="131" y="430" width="820" height="20"/>
  <circle cx="171" cy="425" r="11" fill="#ff5f57"/><circle cx="211" cy="425" r="11" fill="#febc2e"/><circle cx="251" cy="425" r="11" fill="#28c840"/>
  <text class="tx mono" x="163" y="505" font-size="28">$ aws globalaccelerator create-accelerator</text>
  <text class="tx mono" x="163" y="558" font-size="28">$ aws ... --traffic-dial-percentage 0<tspan class="a">█</tspan></text>

  <!-- center: clients -> edge -> regions -->
  <g transform="translate(1020,0)">
    <circle class="cl" cx="40" cy="250" r="30"/><circle class="cl" cx="40" cy="330" r="30"/><circle class="cl" cx="40" cy="410" r="30"/>
    <path class="gl" d="M74,256 L170,316 M74,330 H170 M74,404 L170,344"/>
    <rect class="edge" x="176" y="286" width="150" height="88" rx="16"/>
    <text class="ink mono" x="251" y="340" text-anchor="middle" font-size="28" font-weight="700">edge</text>
    <path class="bb" d="M330,316 C400,316 400,262 470,262 M330,344 C400,344 400,398 470,398"/>
    <rect class="rg" x="476" y="222" width="190" height="80" rx="16"/><text class="ink mono" x="571" y="272" text-anchor="middle" font-size="26" font-weight="700">us-east-1</text>
    <rect class="rg" x="476" y="358" width="190" height="80" rx="16"/><text class="ink mono" x="571" y="408" text-anchor="middle" font-size="26" font-weight="700">eu-west-1</text>
    <text class="n mono" x="333" y="660" text-anchor="middle" font-size="32">nearest edge · backbone · Region</text>
  </g>

  <!-- top right: three feature icons -->
  <g transform="translate(1905,190) scale(1.15)">
    <circle class="al" stroke-width="12" cx="100" cy="100" r="70"/>
    <circle class="a" cx="100" cy="100" r="16"/>
    <path class="al" stroke-width="10" d="M100,30 V58 M100,142 V170 M30,100 H58 M142,100 H170"/>
  </g>
  <text class="n" x="2020" y="470" text-anchor="middle" font-size="32">static IPs</text>
  <g transform="translate(2135,190) scale(1.15)">
    <path class="al" stroke-width="14" d="M30,150 A80,80 0 0 1 170,150"/>
    <path class="al" stroke-width="14" d="M100,150 L136,92"/>
    <circle class="a" cx="100" cy="150" r="14"/>
  </g>
  <text class="n" x="2250" y="470" text-anchor="middle" font-size="32">traffic dial</text>
  <g transform="translate(2365,190) scale(1.15)">
    <path class="al" stroke-width="12" d="M40,70 H130 M110,48 L134,70 L110,92 M160,130 H70 M90,108 L66,130 L90,152"/>
  </g>
  <text class="n" x="2480" y="470" text-anchor="middle" font-size="32">failover</text>

  <text class="h" x="1376" y="880" text-anchor="middle" font-size="140">AWS Global Accelerator</text>
  <text class="s" x="1376" y="1030" text-anchor="middle" font-size="84">Static Anycast IPs and Multi-Region Failover</text>
  <line class="r" x1="776" y1="1105" x2="1976" y2="1105"/>
  <text class="n" x="1376" y="1210" text-anchor="middle" font-size="47">dials · weights · health checks · fail open · client IP · custom routing</text>

  <!-- bottom row: small icons -->
  <g transform="translate(546,1290) scale(0.5)"><circle class="al" stroke-width="14" cx="100" cy="100" r="70"/><path class="al" stroke-width="12" d="M30,100 H170 M100,30 C70,60 70,140 100,170 M100,30 C130,60 130,140 100,170"/></g>
  <text class="n" x="596" y="1450" text-anchor="middle" font-size="34">Edge</text>
  <g transform="translate(806,1290) scale(0.5)"><path class="al" stroke-width="16" d="M30,140 C70,40 130,160 170,60"/><circle class="a" cx="30" cy="140" r="16"/><circle class="a" cx="170" cy="60" r="16"/></g>
  <text class="n" x="856" y="1450" text-anchor="middle" font-size="34">Backbone</text>
  <g transform="translate(1066,1290) scale(0.5)"><path class="al" stroke-width="16" d="M30,150 A80,80 0 0 1 170,150"/><path class="al" stroke-width="16" d="M100,150 L136,92"/></g>
  <text class="n" x="1116" y="1450" text-anchor="middle" font-size="34">Dials</text>
  <g transform="translate(1326,1290) scale(0.5)"><path class="al" stroke-width="16" d="M40,160 V110 M100,160 V60 M160,160 V90"/></g>
  <text class="n" x="1376" y="1450" text-anchor="middle" font-size="34">Weights</text>
  <g transform="translate(1586,1290) scale(0.5)"><path class="al" stroke-width="14" d="M100,170 C40,130 20,90 40,60 C60,30 90,40 100,64 C110,40 140,30 160,60 C180,90 160,130 100,170 Z"/><path class="al" stroke-width="12" d="M50,104 H80 L92,82 L108,126 L120,104 H150"/></g>
  <text class="n" x="1636" y="1450" text-anchor="middle" font-size="34">Health</text>
  <g transform="translate(1846,1290) scale(0.5)"><circle class="al" stroke-width="14" cx="100" cy="66" r="36"/><path class="al" stroke-width="14" d="M36,172 C36,128 64,108 100,108 C136,108 164,128 164,172"/></g>
  <text class="n" x="1896" y="1450" text-anchor="middle" font-size="34">Client IP</text>
  <g transform="translate(2106,1290) scale(0.5)"><circle class="al" stroke-width="14" cx="100" cy="100" r="70"/><path class="al" stroke-width="12" d="M124,70 C114,58 80,56 78,78 C76,98 124,98 122,122 C120,144 86,144 76,130 M100,46 V60 M100,140 V154"/></g>
  <text class="n" x="2156" y="1450" text-anchor="middle" font-size="34">Cost</text>
</svg>
