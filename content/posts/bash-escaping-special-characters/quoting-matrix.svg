  <text class="cs" x="622.0" y="301.0">no escape</text>
  <rect class="x" x="690" y="274" width="124" height="32" rx="5"/>
  <text class="c" x="752.0" y="288.0">ends string</text>
  <text class="cs" x="752.0" y="301.0">\&#x27; gives a &#x27;</text>
