<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 604" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Which characters stay special in each quoting context</title>
  <desc id="d">Unquoted, every listed character is special. Inside double quotes only $, backtick, backslash (before $, backtick, double quote, backslash and newline only), the closing double quote and, in an interactive shell, ! stay special. Inside single quotes everything is literal and the next single quote ends the string. Inside ANSI-C $&#x27;...&#x27; quotes only the backslash escapes and the closing single quote are special.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#adb5bd"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .d   { font-size: 11px; fill: #495057; }
      .mb  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; font-weight: 700; fill: #212529; }
      .ms  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #495057; }
      .c   { font-size: 11px; fill: #212529; text-anchor: middle; }
      .cs  { font-size: 9.5px; fill: #495057; text-anchor: middle; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .x   { fill: #f8d7da; stroke: #e35d6a; }
      .w   { fill: #ffe5cc; stroke: #fd9843; }
      .n   { fill: #f8f9fa; stroke: #dee2e6; }
      .num { fill: #495057; }
      .numt{ font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .lne { stroke: #adb5bd; stroke-width: 1.4; fill: none; marker-end: url(#a); }
      .tick{ stroke: #dee2e6; stroke-width: 1; }
    </style>
  </defs>
  <rect width="840" height="604" fill="#ffffff"/>
  <text class="h" x="20" y="28">Which characters stay special in each quoting context</text>
  <text class="sub" x="20" y="48">Every cell checked in bash 5.2.21 (Ubuntu 24.04); bash 3.2.57 behaves the same apart from \u in $'...'</text>
  <text class="lb" x="20" y="98">CHARACTER</text>
  <text class="lb" x="362" y="98" text-anchor="middle">UNQUOTED</text>
  <text class="lb" x="492" y="98" text-anchor="middle">&quot;...&quot;</text>
  <text class="lb" x="622" y="98" text-anchor="middle">&#x27;...&#x27;</text>
  <text class="lb" x="752" y="98" text-anchor="middle">$&#x27;...&#x27;</text>
  <text class="mb" x="20" y="133">$</text>
  <text class="d" x="150" y="133">expansion</text>
  <rect class="x" x="300" y="114" width="124" height="32" rx="5"/>
