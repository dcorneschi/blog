  <rect class="g" x="690" y="234" width="124" height="32" rx="5"/>
  <text class="c" x="752.0" y="254.0">literal</text>
  <text class="mb" x="20" y="293">&#x27;</text>
  <text class="d" x="150" y="293">single quote</text>
  <rect class="x" x="300" y="274" width="124" height="32" rx="5"/>
  <text class="c" x="362.0" y="294.0">opens</text>
  <rect class="g" x="430" y="274" width="124" height="32" rx="5"/>
  <text class="c" x="492.0" y="294.0">literal</text>
  <rect class="x" x="560" y="274" width="124" height="32" rx="5"/>
