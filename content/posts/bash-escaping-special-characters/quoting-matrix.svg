  <rect class="g" x="560" y="154" width="124" height="32" rx="5"/>
  <text class="c" x="622.0" y="174.0">literal</text>
  <rect class="g" x="690" y="154" width="124" height="32" rx="5"/>
  <text class="c" x="752.0" y="174.0">literal</text>
