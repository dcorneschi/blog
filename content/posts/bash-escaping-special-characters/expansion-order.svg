<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 564" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The order of bash expansions</title>
  <desc id="d">Bash processes a command line in this order: history expansion (interactive only), splitting into words and operators, brace expansion, tilde expansion, parameter, command and arithmetic expansion, word splitting, pathname expansion and quote removal. Unquoted text goes through every step. Double quotes keep only parameter, command and arithmetic expansion, plus history expansion in an interactive shell except for a ! right before the closing quote. Single quotes turn every step off. Quote removal always runs last, so the quotes never reach the command.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#adb5bd"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .d   { font-size: 11px; fill: #495057; }
      .mb  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; font-weight: 700; fill: #212529; }
      .ms  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #495057; }
      .c   { font-size: 11px; fill: #212529; text-anchor: middle; }
      .cs  { font-size: 9.5px; fill: #495057; text-anchor: middle; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .x   { fill: #f8d7da; stroke: #e35d6a; }
      .w   { fill: #ffe5cc; stroke: #fd9843; }
      .n   { fill: #f8f9fa; stroke: #dee2e6; }
      .num { fill: #495057; }
      .numt{ font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .lne { stroke: #adb5bd; stroke-width: 1.4; fill: none; marker-end: url(#a); }
      .tick{ stroke: #dee2e6; stroke-width: 1; }
    </style>
  </defs>
  <rect width="840" height="564" fill="#ffffff"/>
  <text class="h" x="20" y="28">The order of bash expansions, and which steps each quoting style turns off</text>
  <text class="sub" x="20" y="48">Checked in bash 5.2.21 on Ubuntu 24.04 and bash 3.2.57 on macOS</text>
  <text class="lb" x="600" y="98" text-anchor="middle">UNQUOTED</text>
  <text class="lb" x="692" y="98" text-anchor="middle">&quot;DOUBLE&quot;</text>
  <text class="lb" x="784" y="98" text-anchor="middle">&#x27;SINGLE&#x27;</text>
  <text class="lb" x="20" y="98">STEP</text>
  <circle class="num" cx="32" cy="131" r="11"/>
  <text class="numt" x="32" y="135">1</text>
  <text class="tb" x="52" y="129">History expansion</text>
  <text class="ms" x="52" y="146">!!  !-2  !word</text>
  <text class="d" x="300" y="136">interactive shells only, before anything else</text>
  <rect class="x" x="560" y="116" width="80" height="32" rx="5"/>
  <text class="c" x="600.0" y="136.0">runs</text>
  <rect class="w" x="652" y="116" width="80" height="32" rx="5"/>
  <text class="c" x="692.0" y="130.0">runs</text>
  <text class="cs" x="692.0" y="143.0">not ! before &quot; (5.2)</text>
  <rect class="g" x="744" y="116" width="80" height="32" rx="5"/>
  <text class="c" x="784.0" y="136.0">off</text>
  <line class="tick" x1="20" y1="158" x2="824" y2="158"/>
  <circle class="num" cx="32" cy="181" r="11"/>
  <text class="numt" x="32" y="185">2</text>
  <text class="tb" x="52" y="179">Split into words and operators</text>
  <text class="ms" x="52" y="196">| &amp; ; &lt; &gt; ( )  #</text>
  <text class="d" x="300" y="186">blanks end words, operators end commands</text>
  <rect class="x" x="560" y="166" width="80" height="32" rx="5"/>
  <text class="c" x="600.0" y="186.0">runs</text>
  <rect class="g" x="652" y="166" width="80" height="32" rx="5"/>
  <text class="c" x="692.0" y="186.0">off</text>
  <rect class="g" x="744" y="166" width="80" height="32" rx="5"/>
  <text class="c" x="784.0" y="186.0">off</text>
  <line class="tick" x1="20" y1="208" x2="824" y2="208"/>
  <circle class="num" cx="32" cy="231" r="11"/>
  <text class="numt" x="32" y="235">3</text>
  <text class="tb" x="52" y="229">Brace expansion</text>
  <text class="ms" x="52" y="246">{a,b}  {1..5}</text>
  <text class="d" x="300" y="236">needs a comma or a .. range</text>
  <rect class="x" x="560" y="216" width="80" height="32" rx="5"/>
  <text class="c" x="600.0" y="236.0">runs</text>
  <rect class="g" x="652" y="216" width="80" height="32" rx="5"/>
  <text class="c" x="692.0" y="236.0">off</text>
  <rect class="g" x="744" y="216" width="80" height="32" rx="5"/>
  <text class="c" x="784.0" y="236.0">off</text>
  <line class="tick" x1="20" y1="258" x2="824" y2="258"/>
  <circle class="num" cx="32" cy="281" r="11"/>
  <text class="numt" x="32" y="285">4</text>
  <text class="tb" x="52" y="279">Tilde expansion</text>
  <text class="ms" x="52" y="296">~  ~user</text>
  <text class="d" x="300" y="286">only at the start of a word</text>
  <rect class="x" x="560" y="266" width="80" height="32" rx="5"/>
  <text class="c" x="600.0" y="286.0">runs</text>
  <rect class="g" x="652" y="266" width="80" height="32" rx="5"/>
  <text class="c" x="692.0" y="286.0">off</text>
  <rect class="g" x="744" y="266" width="80" height="32" rx="5"/>
  <text class="c" x="784.0" y="286.0">off</text>
  <line class="tick" x1="20" y1="308" x2="824" y2="308"/>
  <circle class="num" cx="32" cy="331" r="11"/>
  <text class="numt" x="32" y="335">5</text>
  <text class="tb" x="52" y="329">Parameter, command, arithmetic</text>
  <text class="ms" x="52" y="346">$var  $(cmd)  `cmd`  $((1+2))</text>
  <text class="d" x="300" y="336">the step double quotes keep</text>
  <rect class="x" x="560" y="316" width="80" height="32" rx="5"/>
  <text class="c" x="600.0" y="336.0">runs</text>
  <rect class="x" x="652" y="316" width="80" height="32" rx="5"/>
  <text class="c" x="692.0" y="336.0">runs</text>
  <rect class="g" x="744" y="316" width="80" height="32" rx="5"/>
  <text class="c" x="784.0" y="336.0">off</text>
  <line class="tick" x1="20" y1="358" x2="824" y2="358"/>
  <circle class="num" cx="32" cy="381" r="11"/>
  <text class="numt" x="32" y="385">6</text>
  <text class="tb" x="52" y="379">Word splitting</text>
  <text class="ms" x="52" y="396">on spaces, tabs, newlines ($IFS)</text>
  <text class="d" x="300" y="386">only on the results of the step above</text>
  <rect class="x" x="560" y="366" width="80" height="32" rx="5"/>
  <text class="c" x="600.0" y="386.0">runs</text>
  <rect class="g" x="652" y="366" width="80" height="32" rx="5"/>
  <text class="c" x="692.0" y="386.0">off</text>
  <rect class="g" x="744" y="366" width="80" height="32" rx="5"/>
  <text class="c" x="784.0" y="386.0">off</text>
  <line class="tick" x1="20" y1="408" x2="824" y2="408"/>
  <circle class="num" cx="32" cy="431" r="11"/>
  <text class="numt" x="32" y="435">7</text>
  <text class="tb" x="52" y="429">Pathname expansion (globbing)</text>
  <text class="ms" x="52" y="446">*  ?  [abc]</text>
  <text class="d" x="300" y="436">no match: the word stays as it is</text>
  <rect class="x" x="560" y="416" width="80" height="32" rx="5"/>
  <text class="c" x="600.0" y="436.0">runs</text>
  <rect class="g" x="652" y="416" width="80" height="32" rx="5"/>
  <text class="c" x="692.0" y="436.0">off</text>
  <rect class="g" x="744" y="416" width="80" height="32" rx="5"/>
  <text class="c" x="784.0" y="436.0">off</text>
  <line class="tick" x1="20" y1="458" x2="824" y2="458"/>
  <circle class="num" cx="32" cy="481" r="11"/>
  <text class="numt" x="32" y="485">8</text>
  <text class="tb" x="52" y="479">Quote removal</text>
  <text class="ms" x="52" y="496">\  &#x27;  &quot;</text>
  <text class="d" x="300" y="486">the quotes never reach the command</text>
  <rect class="n" x="560" y="466" width="80" height="32" rx="5"/>
  <text class="c" x="600.0" y="486.0">always</text>
  <rect class="n" x="652" y="466" width="80" height="32" rx="5"/>
  <text class="c" x="692.0" y="486.0">always</text>
  <rect class="n" x="744" y="466" width="80" height="32" rx="5"/>
  <text class="c" x="784.0" y="486.0">always</text>
  <rect class="x" x="20" y="530" width="16" height="14" rx="5"/>
  <text class="c" x="28.0" y="541.0"></text>
  <text class="d" x="42" y="541">step runs on this text</text>
  <rect class="g" x="220" y="530" width="16" height="14" rx="5"/>
  <text class="c" x="228.0" y="541.0"></text>
  <text class="d" x="242" y="541">turned off: literal</text>
  <rect class="w" x="399" y="530" width="16" height="14" rx="5"/>
  <text class="c" x="407.0" y="541.0"></text>
  <text class="d" x="421" y="541">runs, with an exception</text>
  <rect class="n" x="606" y="530" width="16" height="14" rx="5"/>
  <text class="c" x="614.0" y="541.0"></text>
  <text class="d" x="628" y="541">removes the quotes themselves</text>
</svg>
