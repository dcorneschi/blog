  <title id="t">Ansible Inventory Guide</title>
  <desc id="d">Ansible Inventory Guide: Hosts, groups, variables and dynamic inventories. INI, YAML, group_vars, host_vars, vault, ProxyJump, aws_ec2, azure_rm, gcp_compute, Terraform. Small drawings: inventory, groups, hosts; a terminal running ansible-inventory -i inventory.ini --graph and ansible all -i inventory.ini -m ping; groups, group_vars, dynamic; icons for INI, YAML, group_vars, vault, ProxyJump, aws_ec2, Terraform.</desc>
