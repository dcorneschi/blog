<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ProxMenux Monitor</title>
  <desc id="d">ProxMenux Monitor: A web dashboard for Proxmox VE. Health Monitor, notifications, REST API, Prometheus, reverse proxy, 2FA. Small drawings: :8008, login, 2FA; a terminal running systemctl status proxmenux-monitor and curl :8008/api/system-info; Proxmox VE, auth.json, health; icons for health, logs, settings, API, storage, updates, healthy.</desc>
  <defs>
    <style>
      .bg  { fill: #f8f9fa; }
      .a   { fill: #e57000; }
      .a2  { fill: #ff9f43; }
      .ink { fill: #343a40; }
      .pap { fill: #ffffff; stroke: #ced4da; stroke-width: 6; }
      .ln  { stroke: #adb5bd; stroke-width: 10; stroke-linecap: round; fill: none; }
      .al  { stroke: #e57000; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wt  { fill: #ffffff; }
      .h   { font-weight: 700; fill: #212529; letter-spacing: -2px; }
      .s   { fill: #495057; }
      .n   { fill: #868e96; }
      .r   { stroke: #dee2e6; stroke-width: 2; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #161b22; }
        .ink { fill: #c9d1d9; }
        .pap { fill: #0d1117; stroke: #30363d; }
        .ln  { stroke: #484f58; }
        .h   { fill: #f0f6fc; }
        .s   { fill: #c9d1d9; }
        .n   { fill: #8b949e; }
        .r   { stroke: #30363d; }
      }
    </style>
  </defs>
