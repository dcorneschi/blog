<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 432" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A re-pulled tag leaves dangling images behind</title>
  <desc id="d">app:latest moved from v1 to v2 to v3. v2 is dangling, v1 is dangling but still used by container c1. Each version has its own 3-byte layer on top of a shared 20 MB layer and the shared Alpine base, so pruning v2 and v1 frees 3 bytes each and only prune -a after the last image frees 29.79 MB.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .th  { font-size: 12px; font-weight: 700; fill: #212529; }
      .ths { font-size: 10.5px; fill: #495057; }
      .m   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; }
      .mb  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11.5px; font-weight: 700; fill: #212529; }
      .d   { font-size: 11px; fill: #495057; }
      .c   { font-size: 11px; fill: #212529; }
      .num { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .lne { stroke: #495057; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .dash{ stroke: #868e96; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .tick{ stroke: #495057; stroke-width: 1.2; }
      .r   { fill: #e7f1ff; stroke: #6ea8fe; }
      .w   { fill: #ffe5cc; stroke: #fd9843; }
      .rw  { fill: #f3effc; stroke: #a98eda; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .x   { fill: #f8d7da; stroke: #e35d6a; }
      .n   { fill: #f8f9fa; stroke: #dee2e6; }
      .s   { fill: #ffffff; stroke: #adb5bd; }
    </style>
  </defs>
  <rect width="890" height="432" fill="#ffffff"/>
  <text class="h" x="20" y="28">A re-pulled tag leaves dangling images behind</text>
  <text class="sub" x="20" y="48">app:latest pulled three times as v1, v2, v3; container c1 started from v1 (classic store IDs)</text>
  <rect class="w" x="60" y="130" width="230" height="54" rx="6"/>
  <text class="tb" x="175" y="154" text-anchor="middle">v1  7e573aaa47e5</text>
  <text class="d" x="175" y="172" text-anchor="middle">&lt;none&gt; · used by c1</text>
  <rect class="s" x="80" y="196" width="190" height="30" rx="4"/>
  <text class="m" x="175" y="216" text-anchor="middle">/version (3 B)</text>
  <path class="lne" d="M175,226 V262"/>
  <rect class="n" x="330" y="130" width="230" height="54" rx="6"/>
  <text class="tb" x="445" y="154" text-anchor="middle">v2  231579119d50</text>
  <text class="d" x="445" y="172" text-anchor="middle">&lt;none&gt; · dangling</text>
  <rect class="s" x="350" y="196" width="190" height="30" rx="4"/>
  <text class="m" x="445" y="216" text-anchor="middle">/version (3 B)</text>
  <path class="lne" d="M445,226 V262"/>
  <rect class="g" x="600" y="130" width="230" height="54" rx="6"/>
  <text class="tb" x="715" y="154" text-anchor="middle">v3  1a2e94e4e49f</text>
  <text class="d" x="715" y="172" text-anchor="middle">app:latest</text>
  <rect class="s" x="620" y="196" width="190" height="30" rx="4"/>
  <text class="m" x="715" y="216" text-anchor="middle">/version (3 B)</text>
  <path class="lne" d="M715,226 V262"/>
  <rect class="r" x="60" y="266" width="770" height="38" rx="6"/>
  <text class="c" x="445" y="290" text-anchor="middle">20 MB random-data layer (shared by all three)</text>
  <rect class="r" x="60" y="312" width="770" height="38" rx="6"/>
  <text class="c" x="445" y="336" text-anchor="middle">Alpine 3.20 base layer (shared by all three)</text>
  <rect class="x" x="660" y="74" width="110" height="30" rx="15"/>
  <text class="mb" x="715" y="94" text-anchor="middle">app:latest</text>
  <path class="lne" d="M715,104 V126"/>
  <rect class="w" x="90" y="74" width="110" height="30" rx="15"/>
  <text class="mb" x="145" y="94" text-anchor="middle">c1</text>
  <path class="lne" d="M145,104 V126"/>
  <text class="d" x="20" y="380">docker image prune: removes v2 (3 B reclaimed); v1 stays while c1 exists, then goes too (3 B). The shared layers stay</text>
  <text class="d" x="20" y="396">until the last image using them is removed: docker image prune -a reclaimed 29.79 MB. docker rmi -f of v1 while c1 runs:</text>
  <text class="m" x="20" y="414">conflict: unable to delete 7e573aaa47e5 (cannot be forced) - image is being used by running container</text>
</svg>
