<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 586" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Six layers, two image stores</title>
  <desc id="d">On the classic overlay2 store three layers download at once and layers 4 to 6 wait for a free slot; each layer is unpacked after its parent, in layer order. On the containerd image store all six layers start downloading at once and unpacking does not follow layer order.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .th  { font-size: 12px; font-weight: 700; fill: #212529; }
      .ths { font-size: 10.5px; fill: #495057; }
      .m   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; }
      .mb  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11.5px; font-weight: 700; fill: #212529; }
      .d   { font-size: 11px; fill: #495057; }
      .c   { font-size: 11px; fill: #212529; }
      .num { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .lne { stroke: #495057; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .dash{ stroke: #868e96; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .tick{ stroke: #495057; stroke-width: 1.2; }
      .r   { fill: #e7f1ff; stroke: #6ea8fe; }
      .w   { fill: #ffe5cc; stroke: #fd9843; }
      .rw  { fill: #f3effc; stroke: #a98eda; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .x   { fill: #f8d7da; stroke: #e35d6a; }
      .n   { fill: #f8f9fa; stroke: #dee2e6; }
      .s   { fill: #ffffff; stroke: #adb5bd; }
    </style>
  </defs>
  <rect width="620" height="586" fill="#ffffff"/>
  <text class="h" x="20" y="28">Six layers, two image stores</text>
  <text class="sub" x="20" y="48">Schematic, not to scale: download slots and unpacking as seen in the pull output</text>
  <text class="tb" x="20" y="78">Classic overlay2 store: 3 download slots, layers unpacked in order</text>
  <text class="m" x="20" y="105">layer 1</text>
  <rect class="r" x="150" y="90" width="138" height="20" rx="3"/>
  <rect class="g" x="288" y="90" width="27.6" height="20" rx="3"/>
  <text class="m" x="20" y="135">layer 2</text>
  <rect class="r" x="150" y="120" width="184" height="20" rx="3"/>
  <rect class="g" x="334" y="120" width="27.6" height="20" rx="3"/>
  <text class="m" x="20" y="165">layer 3</text>
  <rect class="r" x="150" y="150" width="207" height="20" rx="3"/>
  <rect class="g" x="361.6" y="150" width="27.6" height="20" rx="3"/>
  <text class="m" x="20" y="195">layer 4</text>
  <rect class="n" x="150" y="180" width="138" height="20" rx="3"/>
  <text class="d" x="156" y="194">Waiting</text>
  <rect class="r" x="288" y="180" width="138" height="20" rx="3"/>
  <rect class="g" x="426" y="180" width="27.6" height="20" rx="3"/>
  <text class="m" x="20" y="225">layer 5</text>
  <rect class="n" x="150" y="210" width="184" height="20" rx="3"/>
  <text class="d" x="156" y="224">Waiting</text>
  <rect class="r" x="334" y="210" width="138" height="20" rx="3"/>
  <rect class="g" x="472" y="210" width="27.6" height="20" rx="3"/>
  <text class="m" x="20" y="255">layer 6</text>
  <rect class="n" x="150" y="240" width="207" height="20" rx="3"/>
  <text class="d" x="156" y="254">Waiting</text>
  <rect class="r" x="357" y="240" width="138" height="20" rx="3"/>
  <rect class="g" x="499.6" y="240" width="27.6" height="20" rx="3"/>
  <text class="tb" x="20" y="308">containerd image store: all 6 at once, unpacking not in layer order</text>
  <text class="m" x="20" y="335">layer 1</text>
  <rect class="r" x="150" y="320" width="202.4" height="20" rx="3"/>
  <rect class="g" x="352.4" y="320" width="27.6" height="20" rx="3"/>
  <text class="m" x="20" y="365">layer 2</text>
  <rect class="r" x="150" y="350" width="285.2" height="20" rx="3"/>
  <rect class="g" x="435.2" y="350" width="27.6" height="20" rx="3"/>
  <text class="m" x="20" y="395">layer 3</text>
  <rect class="r" x="150" y="380" width="299" height="20" rx="3"/>
  <rect class="g" x="462.8" y="380" width="27.6" height="20" rx="3"/>
  <text class="m" x="20" y="425">layer 4</text>
  <rect class="r" x="150" y="410" width="266.8" height="20" rx="3"/>
  <rect class="g" x="421.4" y="410" width="27.6" height="20" rx="3"/>
  <text class="m" x="20" y="455">layer 5</text>
  <rect class="r" x="150" y="440" width="276" height="20" rx="3"/>
  <rect class="g" x="449" y="440" width="27.6" height="20" rx="3"/>
  <text class="m" x="20" y="485">layer 6</text>
  <rect class="r" x="150" y="470" width="257.6" height="20" rx="3"/>
  <rect class="g" x="407.6" y="470" width="27.6" height="20" rx="3"/>
  <rect class="n" x="20" y="516" width="14" height="14" rx="3"/>
  <text class="d" x="40" y="527">Waiting</text>
  <rect class="r" x="110" y="516" width="14" height="14" rx="3"/>
  <text class="d" x="130" y="527">downloading</text>
  <rect class="g" x="230" y="516" width="14" height="14" rx="3"/>
  <text class="d" x="250" y="527">unpacking (Download complete → Pull complete)</text>
  <text class="d" x="20" y="552">Classic: max-concurrent-downloads (default 3) sets the slots; with 1, five layers print Waiting.</text>
  <text class="d" x="20" y="568">Two pulls running at once share the same slots.</text>
</svg>
