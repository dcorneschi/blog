<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Docker Restart Policies</title>
  <desc id="d">Docker Restart Policies: no, on-failure, always and unless-stopped. crash, exit code, docker stop, docker kill, daemon restart, docker update, events. Small drawings: exited, restarting and running pills, a terminal with docker stop and docker update, and icons for the four policies.</desc>
