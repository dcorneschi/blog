  <text class="th" x="622" y="84" text-anchor="middle">26.04</text>
  <text class="th" x="776" y="84" text-anchor="middle">apt-get / apt-cache</text>
  <text class="th" x="505" y="66" text-anchor="middle">apt</text>
  <line x1="350" y1="72" x2="656" y2="72" stroke="#adb5bd"/>
  <text class="m" x="20" y="114">install remove purge autoremove update</text>
