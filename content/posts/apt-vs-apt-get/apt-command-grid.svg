<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 544" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Which commands exist where</title>
  <desc id="d">apt on Ubuntu 20.04, 22.04, 24.04 and 26.04 against apt-get and apt-cache. All have install, remove, purge, autoremove, update, upgrade, search, show, policy, depends, rdepends, showsrc, download, source, build-dep, changelog, satisfy, clean and autoclean. distclean exists from 24.04. Only apt has list and edit-sources; only apt on 26.04 has why, why-not, history-list, history-undo and modernize-sources. Only apt-get has check and dselect-upgrade; only apt-cache has showpkg, unmet, stats, pkgnames and dump.</desc>
