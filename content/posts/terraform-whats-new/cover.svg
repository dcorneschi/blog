  <title id="t">What's New in Terraform</title>
  <desc id="d">What's New in Terraform: Every release from 1.0 to 1.17. moved, import, terraform test, ephemeral values, actions, query, policy. Small drawings: 1.0, 1.10 and 1.17 pills, a terminal with terraform version and terraform modules -json, and icons for the headline features.</desc>
