<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">From load spike to running pod</title>
  <desc id="d">Without spare capacity: load rises at 0; the HPA reacts in about a minute and creates pods; they are Pending; Cluster Autoscaler raises the node group within seconds; the new node boots, joins and becomes ready over a few minutes; the pods run after about 5 minutes in total. With overprovisioning: the HPA still takes about a minute, but its new pods preempt low-priority placeholder pods and run within seconds; the evicted placeholders go Pending and trigger the node scale-up in the background, which restores the headroom a few minutes later.</desc>
  <defs>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .ms  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #495057; }
      .d   { font-size: 11px; fill: #495057; }
      .hpa { fill: #f3effc; stroke: #a98eda; }
      .pen { fill: #fff3e0; stroke: #fd9843; }
      .ca  { fill: #e7f1ff; stroke: #6ea8fe; }
      .boot{ fill: #dee2e6; stroke: #adb5bd; }
      .run { fill: #e8f5ee; stroke: #75b798; }
      .tick{ stroke: #adb5bd; stroke-width: 1; stroke-dasharray: 3 3; }
    </style>
  </defs>
  <rect width="840" height="330" fill="#ffffff"/>
  <text class="h" x="20" y="28">From load spike to running pod</text>
  <text class="sub" x="20" y="48">Typical times on a cloud provider (1 minute = 110 px); node boot dominates</text>

  <g class="ms" text-anchor="middle">
    <text x="160" y="76">0</text><text x="270" y="76">1 min</text><text x="380" y="76">2 min</text><text x="490" y="76">3 min</text><text x="600" y="76">4 min</text><text x="710" y="76">5 min</text>
  </g>
  <path class="tick" d="M160,82 V270 M270,82 V270 M380,82 V270 M490,82 V270 M600,82 V270 M710,82 V270"/>

  <text class="lb" x="20" y="112">WITHOUT</text>
  <text class="lb" x="20" y="126">HEADROOM</text>
  <rect class="hpa" x="160" y="94" width="110" height="40" rx="4"/><text class="d" x="168" y="118">HPA reacts</text>
  <rect class="pen" x="270" y="94" width="18" height="40" rx="2"/>
  <rect class="ca" x="288" y="94" width="18" height="40" rx="2"/>
  <rect class="boot" x="306" y="94" width="370" height="40" rx="4"/><text class="d" x="316" y="118">node launches, boots, joins, gets ready</text>
  <rect class="run" x="676" y="94" width="144" height="40" rx="4"/><text class="tb" x="686" y="119">pods run</text>
  <text class="d" x="270" y="152">Pending → CA scales up within seconds</text>

  <text class="lb" x="20" y="200">WITH</text>
  <text class="lb" x="20" y="214">OVERPROVI-</text>
  <text class="lb" x="20" y="228">SIONING</text>
  <rect class="hpa" x="160" y="182" width="110" height="40" rx="4"/><text class="d" x="168" y="206">HPA reacts</text>
  <rect class="run" x="270" y="182" width="550" height="40" rx="4"/><text class="tb" x="280" y="207">pods run: they preempt the placeholder pods</text>
  <rect class="pen" x="270" y="232" width="18" height="30" rx="2"/>
  <rect class="ca" x="288" y="232" width="18" height="30" rx="2"/>
  <rect class="boot" x="306" y="232" width="370" height="30" rx="4"/><text class="d" x="316" y="251">placeholders pending → new node in the background</text>
  <rect class="run" x="676" y="232" width="144" height="30" rx="4"/><text class="d" x="686" y="251">headroom back</text>

  <text class="d" x="20" y="294">Spike-to-running is about 5 minutes without headroom (the Cluster Autoscaler FAQ's estimate), seconds after the HPA with it.</text>
  <text class="d" x="20" y="312">Scale-down is the reverse: HPA removes pods after its 5-minute window, CA removes nodes 10 minutes after they become unneeded.</text>
</svg>
