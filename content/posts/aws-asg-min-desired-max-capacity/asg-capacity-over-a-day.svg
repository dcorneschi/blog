<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One day of an Auto Scaling group</title>
  <desc id="d">A day of a group with max 8, target tracking on CPU and two scheduled actions. Night: target tracking would go to 1 but desired stays at min 2. 08:00: a scheduled action sets min 4 and desired rises to 4. Lunch: target tracking wants 10 but desired stops at max 8. Afternoon: target tracking wants 3 but desired stays at min 4. 20:00: a scheduled action sets min 2 and desired goes down to 2.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .ms  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #495057; }
      .mb  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11.5px; font-weight: 700; fill: #212529; }
      .d   { font-size: 11px; fill: #495057; }
      .lne { stroke: #495057; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .dsh { stroke: #495057; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; marker-end: url(#a); }
      .ax  { stroke: #ced4da; stroke-width: 1; }
      .q   { fill: #f8f9fa; stroke: #adb5bd; }
      .k   { fill: #e7f1ff; stroke: #6ea8fe; }
      .hm  { fill: #f3effc; stroke: #a98eda; }
      .ok  { fill: #e8f5ee; stroke: #75b798; }
      .wrn { fill: #fff3e0; stroke: #fd9843; }
      .bad { fill: #fdecec; stroke: #e35d6a; }
      .band{ fill: #b8e0c9; stroke: #479f76; }
      .bandx{ fill: #f5c2c7; stroke: #dc3545; stroke-dasharray: 3 2; }
      .dot { fill: #0d6efd; stroke: #ffffff; stroke-width: 1.5; }
      .dotx{ fill: #dc3545; stroke: #ffffff; stroke-width: 1.5; }
      .box { fill: none; stroke: #adb5bd; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="430" fill="#ffffff"/>
  <text class="h" x="20" y="28">One day of an Auto Scaling group</text>
  <text class="sub" x="20" y="48">max 8, target tracking on CPU, scheduled actions at 08:00 (min 4) and 20:00 (min 2)</text>
  <line class="ax" x1="70" y1="340" x2="790" y2="340"/>
  <text class="ms" x="60" y="344" text-anchor="end">0</text>
  <line class="ax" x1="70" y1="296" x2="790" y2="296"/>
  <text class="ms" x="60" y="300" text-anchor="end">2</text>
  <line class="ax" x1="70" y1="252" x2="790" y2="252"/>
  <text class="ms" x="60" y="256" text-anchor="end">4</text>
  <line class="ax" x1="70" y1="208" x2="790" y2="208"/>
  <text class="ms" x="60" y="212" text-anchor="end">6</text>
  <line class="ax" x1="70" y1="164" x2="790" y2="164"/>
  <text class="ms" x="60" y="168" text-anchor="end">8</text>
  <line class="ax" x1="70" y1="120" x2="790" y2="120"/>
  <text class="ms" x="60" y="124" text-anchor="end">10</text>
  <text class="ms" x="70.0" y="358" text-anchor="middle">00:00</text>
  <text class="ms" x="190.0" y="358" text-anchor="middle">04:00</text>
  <text class="ms" x="310.0" y="358" text-anchor="middle">08:00</text>
  <text class="ms" x="430.0" y="358" text-anchor="middle">12:00</text>
  <text class="ms" x="550.0" y="358" text-anchor="middle">16:00</text>
  <text class="ms" x="670.0" y="358" text-anchor="middle">20:00</text>
  <text class="ms" x="790.0" y="358" text-anchor="middle">24:00</text>
  <text class="d" x="60" y="102" text-anchor="end">instances</text>
  <line x1="310.0" y1="106.80000000000001" x2="310.0" y2="340" stroke="#a98eda" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="ms" x="314.0" y="110.80000000000001">min → 4</text>
  <line x1="670.0" y1="106.80000000000001" x2="670.0" y2="340" stroke="#a98eda" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="ms" x="674.0" y="110.80000000000001">min → 2</text>
  <path d="M70.0,164 H790.0" stroke="#fd7e14" stroke-width="2.2" stroke-dasharray="8 4" fill="none"/>
  <path d="M70.0,318.0 L280.0,318.0 L310.0,285.0 L340.0,263.0 L370.0,230.0 L400.0,186.0 L430.0,120.0 L490.0,120.0 L520.0,208.0 L550.0,274.0 L655.0,274.0 L685.0,318.0 L790.0,318.0" stroke="#868e96" stroke-width="1.6" stroke-dasharray="2 3" fill="none"/>
  <path d="M70.0,296.0 H310.0 V252.0 H670.0 V296.0 H790.0" stroke="#479f76" stroke-width="2.2" fill="none"/>
  <path d="M70.0,296.0 H85.0 H100.0 H115.0 H130.0 H145.0 H160.0 H175.0 H190.0 H205.0 H220.0 H235.0 H250.0 H265.0 H280.0 H295.0 H310.0 V252.0 H325.0 H340.0 H355.0 V230.0 H370.0 H385.0 V208.0 H400.0 V186.0 H415.0 V164.0 H430.0 H445.0 H460.0 H475.0 H490.0 H505.0 H520.0 V208.0 H535.0 V230.0 H550.0 V252.0 H565.0 H580.0 H595.0 H610.0 H625.0 H640.0 H655.0 H670.0 V296.0 H685.0 H700.0 H715.0 H730.0 H745.0 H760.0 H775.0 H790.0" stroke="#0d6efd" stroke-width="3" fill="none" stroke-linejoin="round"/>
  <circle cx="175.0" cy="274.0" r="9" fill="#212529"/><text x="175.0" y="278.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="340.0" cy="230.0" r="9" fill="#212529"/><text x="340.0" y="234.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="460.0" cy="130.0" r="9" fill="#212529"/><text x="460.0" y="134.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="595.0" cy="230.0" r="9" fill="#212529"/><text x="595.0" y="234.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <circle cx="730.0" cy="274.0" r="9" fill="#212529"/><text x="730.0" y="278.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <path d="M70,380 h26" stroke="#0d6efd" stroke-width="3"/><text class="d" x="102" y="384">desired</text>
  <path d="M160,380 h26" stroke="#479f76" stroke-width="2.2"/><text class="d" x="192" y="384">min</text>
  <path d="M232,380 h26" stroke="#fd7e14" stroke-width="2.2" stroke-dasharray="8 4"/><text class="d" x="264" y="384">max</text>
  <path d="M306,380 h26" stroke="#868e96" stroke-width="1.6" stroke-dasharray="2 3"/><text class="d" x="338" y="384">what target tracking wants</text>
  <text class="d" x="20" y="410">1 night: held at min 2 · 2 08:00: min 4 raises desired · 3 lunch: wants 10, held at max 8 · 4 afternoon: held at min 4 · 5 20:00: min 2, scales in</text>
</svg>
