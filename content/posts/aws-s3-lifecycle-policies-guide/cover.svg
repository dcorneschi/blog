<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">S3 Lifecycle Policies</title>
  <desc id="d">S3 Lifecycle Policies: transitions, expiration, versions and the rules that surprise you. Small drawings: day 30, 90 and 365 pills; a terminal running aws s3api put-bucket-lifecycle-configuration and get-bucket-lifecycle-configuration; a staircase of storage classes from Standard down to Deep Archive; icons for transitions, expiration and noncurrent versions; small icons for the 128 KB rule, minimum duration, delete markers, multipart cleanup, Object Lock, CloudTrail and the CLI.</desc>
  <defs>
    <style>
      .bg  { fill: #f8f9fa; }
      .a   { fill: #f59f00; }
      .al  { stroke: #f59f00; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ink { fill: #343a40; }
      .h   { font-weight: 700; fill: #212529; letter-spacing: -2px; }
      .s   { fill: #495057; }
      .n   { fill: #868e96; }
      .r   { stroke: #dee2e6; stroke-width: 2; }
      .pb  { fill: #e7f1ff; stroke: #6ea8fe; stroke-width: 5; }
      .pv  { fill: #f3effc; stroke: #a98eda; stroke-width: 5; }
      .pg  { fill: #e8f5ee; stroke: #75b798; stroke-width: 5; }
      .term{ fill: #212529; }
      .tbar{ fill: #343a40; }
      .tx  { fill: #e9ecef; }
      .mono{ font-family: Menlo, Consolas, 'Liberation Mono', monospace; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #161b22; }
        .ink { fill: #c9d1d9; }
        .h   { fill: #f0f6fc; }
        .s   { fill: #c9d1d9; }
        .n   { fill: #8b949e; }
        .r   { stroke: #30363d; }
        .pb  { fill: #0c2140; stroke: #3d6fb8; }
        .pv  { fill: #1f1830; stroke: #7d63b0; }
        .pg  { fill: #0f2a1d; stroke: #3d8b63; }
        .term{ fill: #0d1117; stroke: #30363d; stroke-width: 4; }
        .tbar{ fill: #21262d; }
      }
    </style>
  </defs>
  <rect class="bg" width="2752" height="1536"/>

  <!-- top left: ages and terminal -->
  <g class="mono" font-size="28" font-weight="700" text-anchor="middle">
    <rect class="pb" x="131" y="198" width="180" height="66" rx="33"/><text class="ink" x="221" y="241">day 30</text>
    <rect class="pv" x="331" y="198" width="180" height="66" rx="33"/><text class="ink" x="421" y="241">day 90</text>
    <rect class="pg" x="531" y="198" width="200" height="66" rx="33"/><text class="ink" x="631" y="241">day 365</text>
  </g>
  <text class="n mono" x="431" y="318" text-anchor="middle" font-size="30">evaluated once a day</text>
  <rect class="term" x="131" y="400" width="860" height="190" rx="20"/>
  <rect class="tbar" x="131" y="400" width="860" height="50" rx="20"/>
  <rect class="tbar" x="131" y="430" width="860" height="20"/>
  <circle cx="171" cy="425" r="11" fill="#ff5f57"/><circle cx="211" cy="425" r="11" fill="#febc2e"/><circle cx="251" cy="425" r="11" fill="#28c840"/>
  <text class="tx mono" x="163" y="505" font-size="28">$ aws s3api put-bucket-lifecycle-configuration</text>
  <text class="tx mono" x="163" y="558" font-size="28">$ aws s3api get-bucket-lifecycle-configuration<tspan class="a">█</tspan></text>

  <!-- center: storage class staircase -->
  <g transform="translate(1250,0)">
    <rect class="a" x="0" y="250" width="70" height="40" rx="8"/>
    <rect class="a" x="80" y="290" width="70" height="40" rx="8" opacity=".85"/>
    <rect class="a" x="160" y="330" width="70" height="40" rx="8" opacity=".7"/>
    <rect class="a" x="240" y="370" width="70" height="40" rx="8" opacity=".55"/>
    <rect class="a" x="320" y="410" width="70" height="40" rx="8" opacity=".4"/>
    <path class="al" stroke-width="14" d="M20,320 C30,420 140,470 330,490 M300,462 L334,490 L298,514"/>
    <text class="n mono" x="195" y="590" text-anchor="middle" font-size="32">STANDARD → DEEP_ARCHIVE</text>
  </g>

  <!-- top right: three feature icons -->
  <g transform="translate(1855,190) scale(1.15)">
    <path class="al" stroke-width="16" d="M30,50 H110 M110,50 V100 H170 M170,100 V160"/>
    <path class="al" stroke-width="16" d="M150,140 L170,162 L190,140"/>
  </g>
  <text class="n" x="1970" y="470" text-anchor="middle" font-size="32">transitions</text>
  <g transform="translate(2105,190) scale(1.15)">
    <path class="al" stroke-width="16" d="M50,60 H150 M70,60 L80,170 H120 L130,60 M85,60 V40 H115 V60"/>
    <path class="al" stroke-width="10" d="M92,90 V140 M108,90 V140"/>
  </g>
  <text class="n" x="2220" y="470" text-anchor="middle" font-size="32">expiration</text>
  <g transform="translate(2355,190) scale(1.15)">
    <rect class="al" stroke-width="12" x="70" y="30" width="90" height="110" rx="10"/>
    <rect class="al" stroke-width="12" x="50" y="50" width="90" height="110" rx="10"/>
    <rect class="a" x="30" y="70" width="90" height="110" rx="10"/>
  </g>
  <text class="n" x="2470" y="470" text-anchor="middle" font-size="32">versions</text>

  <text class="h" x="1376" y="880" text-anchor="middle" font-size="140">S3 Lifecycle Policies</text>
  <text class="s" x="1376" y="1030" text-anchor="middle" font-size="88">Transitions, expiration, versions and the surprises</text>
  <line class="r" x1="776" y1="1105" x2="1976" y2="1105"/>
  <text class="n" x="1376" y="1210" text-anchor="middle" font-size="47">waterfall · 128 KB rule · minimum durations · delete markers · CLI 2.39.3</text>

  <!-- bottom row: small icons -->
  <g transform="translate(546,1290) scale(0.5)"><rect class="al" x="30" y="50" width="140" height="110" rx="14" stroke-width="14"/><text x="100" y="124" text-anchor="middle" font-size="44" font-weight="700" fill="#f59f00">128</text></g>
  <text class="n" x="596" y="1450" text-anchor="middle" font-size="34">128 KB rule</text>
  <g transform="translate(806,1290) scale(0.5)"><rect class="al" x="24" y="40" width="152" height="140" rx="16" stroke-width="14"/><path class="al" stroke-width="14" d="M24,84 H176 M64,20 V56 M136,20 V56"/><rect class="a" x="56" y="110" width="88" height="26" rx="4"/></g>
  <text class="n" x="856" y="1450" text-anchor="middle" font-size="34">min duration</text>
  <g transform="translate(1066,1290) scale(0.5)"><path class="a" d="M60,30 H140 V120 L100,160 L60,120 Z"/><path d="M80,70 L120,110 M120,70 L80,110" stroke="#fff" stroke-width="12" stroke-linecap="round"/></g>
  <text class="n" x="1116" y="1450" text-anchor="middle" font-size="34">delete markers</text>
  <g transform="translate(1326,1290) scale(0.5)"><rect class="al" x="20" y="60" width="44" height="80" rx="8" stroke-width="12"/><rect class="al" x="78" y="60" width="44" height="80" rx="8" stroke-width="12"/><path class="al" stroke-width="14" d="M140,70 L180,130 M180,70 L140,130"/></g>
  <text class="n" x="1376" y="1450" text-anchor="middle" font-size="34">multipart</text>
  <g transform="translate(1586,1290) scale(0.5)"><rect class="a" x="40" y="90" width="120" height="96" rx="14"/><path class="al" stroke-width="16" d="M64,90 V64 A36,36 0 0 1 136,64 V90"/><circle cx="100" cy="134" r="12" fill="#fff"/></g>
  <text class="n" x="1636" y="1450" text-anchor="middle" font-size="34">Object Lock</text>
  <g transform="translate(1846,1290) scale(0.5)"><path class="al" stroke-width="14" d="M50,30 H150 V170 H50 Z M76,70 H124 M76,100 H124 M76,130 H108"/></g>
  <text class="n" x="1896" y="1450" text-anchor="middle" font-size="34">CloudTrail</text>
  <g transform="translate(2106,1290) scale(0.5)"><path class="al" stroke-width="18" d="M40,60 L90,100 L40,140 M110,150 H170"/></g>
  <text class="n" x="2156" y="1450" text-anchor="middle" font-size="34">CLI</text>
</svg>
