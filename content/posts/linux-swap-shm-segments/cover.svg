  <title id="t">Linux Swap Usage</title>
  <desc id="d">Linux Swap Usage: When processes aren't the culprit. swap, VmSwap, tmpfs, /dev/shm, shared memory segments, ipcs, ipcrm, smaps. Small drawings: RAM, swap; a terminal running free -m and ipcs -m; /dev/shm, segments, smaps; icons for swap, VmSwap, tmpfs, /dev/shm, segments, ipcs, ipcrm.</desc>
