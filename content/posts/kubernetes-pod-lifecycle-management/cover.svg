  <title id="t">Kubernetes Pod Lifecycle</title>
  <desc id="d">Kubernetes Pod Lifecycle: From creation to deletion. phases, conditions, init containers, probes, hooks, graceful shutdown, restart policies. Small drawings: Pending, Running, Succeeded; a terminal running kubectl apply -f pod.yaml and kubectl get pods; pod, init containers, shutdown; icons for phases, conditions, init containers, probes, hooks, shutdown, restarts.</desc>
