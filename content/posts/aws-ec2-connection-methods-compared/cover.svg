<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Connecting to EC2</title>
  <desc id="d">Connecting to EC2: SSH, Instance Connect, Session Manager and the Serial Console compared. Small drawings: SSH, EIC and SSM pills; a terminal running aws ec2-instance-connect ssh and aws ssm start-session; an EC2 instance with a shell prompt and a key; icons for 60-second keys, endpoint tunnels and closed port 22; small icons for key pairs, IAM, endpoints, agents, audit logs, the serial port and the CLI.</desc>
  <defs>
    <style>
      .bg  { fill: #f8f9fa; }
      .a   { fill: #ed7100; }
      .al  { stroke: #ed7100; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ink { fill: #343a40; }
      .h   { font-weight: 700; fill: #212529; letter-spacing: -2px; }
      .s   { fill: #495057; }
      .n   { fill: #868e96; }
      .r   { stroke: #dee2e6; stroke-width: 2; }
      .doc { fill: #ffffff; stroke: #ed7100; stroke-width: 12; }
      .scr { fill: #212529; }
      .pw  { fill: #fff3e0; stroke: #fd9843; stroke-width: 5; }
      .pb  { fill: #e7f1ff; stroke: #6ea8fe; stroke-width: 5; }
      .pg  { fill: #e8f5ee; stroke: #75b798; stroke-width: 5; }
      .term{ fill: #212529; }
      .tbar{ fill: #343a40; }
      .tx  { fill: #e9ecef; }
      .mono{ font-family: Menlo, Consolas, 'Liberation Mono', monospace; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #161b22; }
        .ink { fill: #c9d1d9; }
        .h   { fill: #f0f6fc; }
        .s   { fill: #c9d1d9; }
        .n   { fill: #8b949e; }
        .r   { stroke: #30363d; }
        .doc { fill: #0d1117; }
        .scr { fill: #010409; }
        .pw  { fill: #2a1e0c; stroke: #b9701f; }
        .pb  { fill: #0c1d33; stroke: #4a78b8; }
        .pg  { fill: #10241a; stroke: #4f8f6f; }
        .term{ fill: #0d1117; stroke: #30363d; stroke-width: 4; }
        .tbar{ fill: #21262d; }
      }
    </style>
  </defs>
  <rect class="bg" width="2752" height="1536"/>

  <!-- top left: methods and terminal -->
  <g class="mono" font-size="28" font-weight="700" text-anchor="middle">
    <rect class="pw" x="131" y="198" width="160" height="66" rx="33"/><text class="ink" x="211" y="241">SSH</text>
    <rect class="pb" x="311" y="198" width="160" height="66" rx="33"/><text class="ink" x="391" y="241">EIC</text>
    <rect class="pg" x="491" y="198" width="160" height="66" rx="33"/><text class="ink" x="571" y="241">SSM</text>
  </g>
  <text class="n mono" x="391" y="318" text-anchor="middle" font-size="30">key · IAM · agent</text>
  <rect class="term" x="131" y="400" width="570" height="190" rx="20"/>
  <rect class="tbar" x="131" y="400" width="570" height="50" rx="20"/>
  <rect class="tbar" x="131" y="430" width="570" height="20"/>
  <circle cx="171" cy="425" r="11" fill="#ff5f57"/><circle cx="211" cy="425" r="11" fill="#febc2e"/><circle cx="251" cy="425" r="11" fill="#28c840"/>
  <text class="tx mono" x="163" y="505" font-size="28">$ aws ec2-instance-connect ssh</text>
  <text class="tx mono" x="163" y="558" font-size="28">$ aws ssm start-session<tspan class="a">█</tspan></text>

  <!-- center: instance with a shell and a key -->
  <g transform="translate(1150,0)">
    <rect class="doc" x="20" y="200" width="420" height="320" rx="20"/>
    <rect class="scr" x="60" y="240" width="340" height="170" rx="10"/>
    <path stroke="#ed7100" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M100,290 L140,325 L100,360"/>
    <line x1="165" y1="360" x2="235" y2="360" stroke="#e9ecef" stroke-width="12" stroke-linecap="round"/>
    <circle class="a" cx="90" cy="460" r="14"/><circle class="a" cx="135" cy="460" r="14"/>
    <line x1="190" y1="460" x2="400" y2="460" stroke="#ced4da" stroke-width="12" stroke-linecap="round"/>
    <circle class="al" stroke-width="16" cx="390" cy="560" r="44"/>
    <path class="al" stroke-width="16" d="M434,560 H540 M500,560 V600 M530,560 V590"/>
    <text class="n mono" x="230" y="660" text-anchor="middle" font-size="32">i-0abc123def4567890</text>
  </g>

  <!-- top right: three feature icons -->
  <g transform="translate(1855,190) scale(1.15)">
    <circle class="al" stroke-width="14" cx="100" cy="100" r="70"/>
    <path class="al" stroke-width="12" d="M100,100 V52 M100,100 L130,118"/>
  </g>
  <text class="n" x="1970" y="470" text-anchor="middle" font-size="32">60-second keys</text>
  <g transform="translate(2105,190) scale(1.15)">
    <rect class="al" stroke-width="14" x="20" y="60" width="50" height="80" rx="10"/>
    <rect class="a" x="130" y="60" width="50" height="80" rx="10"/>
    <path class="al" stroke-width="12" d="M70,100 H128" stroke-dasharray="14 10"/>
    <path class="al" stroke-width="10" d="M60,40 C80,10 120,10 140,40"/>
  </g>
  <text class="n" x="2220" y="470" text-anchor="middle" font-size="32">endpoint tunnels</text>
  <g transform="translate(2355,190) scale(1.15)">
    <circle class="al" stroke-width="14" cx="100" cy="100" r="72"/>
    <text class="a mono" x="100" y="122" text-anchor="middle" font-size="62" font-weight="700">22</text>
    <path class="al" stroke-width="14" d="M50,50 L150,150"/>
  </g>
  <text class="n" x="2470" y="470" text-anchor="middle" font-size="32">no open port</text>

  <text class="h" x="1376" y="880" text-anchor="middle" font-size="140">Connecting to EC2</text>
  <text class="s" x="1376" y="1030" text-anchor="middle" font-size="80">SSH, Instance Connect, Session Manager, Serial Console</text>
  <line class="r" x1="776" y1="1105" x2="1976" y2="1105"/>
  <text class="n" x="1376" y="1210" text-anchor="middle" font-size="47">public IP · port 22 · IAM · audit · decision guide · CLI 2.39.3</text>

  <!-- bottom row: small icons -->
  <g transform="translate(546,1290) scale(0.5)"><circle class="al" stroke-width="16" cx="70" cy="100" r="40"/><path class="al" stroke-width="16" d="M110,100 H180 M150,100 V136 M176,100 V128"/></g>
  <text class="n" x="596" y="1450" text-anchor="middle" font-size="34">key pairs</text>
  <g transform="translate(806,1290) scale(0.5)"><circle class="al" stroke-width="14" cx="100" cy="64" r="34"/><path class="al" stroke-width="14" d="M40,170 C40,120 160,120 160,170"/></g>
  <text class="n" x="856" y="1450" text-anchor="middle" font-size="34">IAM</text>
  <g transform="translate(1066,1290) scale(0.5)"><rect class="al" stroke-width="14" x="30" y="40" width="140" height="120" rx="14"/><circle class="a" cx="100" cy="100" r="24"/></g>
  <text class="n" x="1116" y="1450" text-anchor="middle" font-size="34">endpoints</text>
  <g transform="translate(1326,1290) scale(0.5)"><rect class="al" stroke-width="14" x="40" y="40" width="120" height="120" rx="20"/><path class="al" stroke-width="12" d="M70,40 V20 M130,40 V20 M70,160 V180 M130,160 V180 M40,80 H20 M40,120 H20 M160,80 H180 M160,120 H180"/></g>
  <text class="n" x="1376" y="1450" text-anchor="middle" font-size="34">SSM Agent</text>
  <g transform="translate(1586,1290) scale(0.5)"><path class="al" stroke-width="14" d="M50,30 H150 V170 H50 Z"/><path class="al" stroke-width="12" d="M76,74 H124 M76,104 H124 M76,134 H108"/></g>
  <text class="n" x="1636" y="1450" text-anchor="middle" font-size="34">audit logs</text>
  <g transform="translate(1846,1290) scale(0.5)"><path class="al" stroke-width="14" d="M30,60 H170 L150,140 H50 Z"/><circle class="a" cx="70" cy="90" r="9"/><circle class="a" cx="100" cy="90" r="9"/><circle class="a" cx="130" cy="90" r="9"/><circle class="a" cx="85" cy="115" r="9"/><circle class="a" cx="115" cy="115" r="9"/></g>
  <text class="n" x="1896" y="1450" text-anchor="middle" font-size="34">serial port</text>
  <g transform="translate(2106,1290) scale(0.5)"><path class="al" stroke-width="18" d="M40,60 L90,100 L40,140 M110,150 H170"/></g>
  <text class="n" x="2156" y="1450" text-anchor="middle" font-size="34">CLI</text>
</svg>
