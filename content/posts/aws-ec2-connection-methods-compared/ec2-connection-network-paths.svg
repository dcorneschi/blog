<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What each method needs on the network path</title>
  <desc id="d">Five lanes from your computer to the instance. Classic SSH: a key file, a public IP with an internet gateway, and inbound port 22 from your IP. EC2 Instance Connect: IAM pushes a 60-second key, a public IP with an internet gateway, and inbound 22 from you or the service prefix list. EC2 Instance Connect Endpoint: IAM OpenTunnel, an endpoint in the subnet with no internet gateway, and inbound 22 only from the endpoint security group. Session Manager: IAM StartSession, the agent goes out on 443 through NAT or VPC endpoints, and no inbound port. Serial Console: IAM plus an OS password, through the Nitro host outside the VPC, with no port, security group or network ACL involved.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .d   { font-size: 11px; fill: #495057; }
      .lne { stroke: #495057; stroke-width: 1.4; fill: none; marker-end: url(#a); }
      .m   { fill: #f8f9fa; stroke: #adb5bd; }
      .idn { fill: #f3effc; stroke: #a98eda; }
      .net { fill: #e7f1ff; stroke: #6ea8fe; }
      .opn { fill: #fff3e0; stroke: #fd9843; }
      .cls { fill: #e8f5ee; stroke: #75b798; }
      .ins { fill: #ffffff; stroke: #495057; }
    </style>
  </defs>
  <rect width="840" height="420" fill="#ffffff"/>
  <text class="h" x="20" y="28">What each method needs on the network path</text>
  <text class="sub" x="20" y="48">Left to right: who you are, how traffic gets into the VPC, what must be open on the instance</text>

  <g class="lb">
    <text x="185" y="74">WHO</text><text x="340" y="74">HOW IT GETS IN</text><text x="515" y="74">INBOUND ON THE INSTANCE</text><text x="720" y="74">TARGET</text>
  </g>

  <!-- SSH -->
  <rect class="m" x="20" y="84" width="150" height="44" rx="5"/><text class="tb" x="32" y="110">Classic SSH</text>
  <rect class="idn" x="185" y="84" width="140" height="44" rx="5"/><text class="d" x="195" y="102">key file</text><text class="d" x="195" y="118">you keep it</text>
  <rect class="net" x="340" y="84" width="160" height="44" rx="5"/><text class="d" x="350" y="102">public IP +</text><text class="d" x="350" y="118">internet gateway</text>
  <rect class="opn" x="515" y="84" width="190" height="44" rx="5"/><text class="d" x="525" y="102">inbound 22</text><text class="d" x="525" y="118">from your IP</text>
  <rect class="ins" x="720" y="84" width="100" height="44" rx="5"/><text class="tb" x="732" y="110">instance</text>

  <!-- EIC -->
  <rect class="m" x="20" y="142" width="150" height="44" rx="5"/><text class="tb" x="32" y="168">Instance Connect</text>
  <rect class="idn" x="185" y="142" width="140" height="44" rx="5"/><text class="d" x="195" y="160">IAM pushes a</text><text class="d" x="195" y="176">60-second key</text>
  <rect class="net" x="340" y="142" width="160" height="44" rx="5"/><text class="d" x="350" y="160">public IP +</text><text class="d" x="350" y="176">internet gateway</text>
  <rect class="opn" x="515" y="142" width="190" height="44" rx="5"/><text class="d" x="525" y="160">inbound 22 from you</text><text class="d" x="525" y="176">or the prefix list</text>
  <rect class="ins" x="720" y="142" width="100" height="44" rx="5"/><text class="tb" x="732" y="168">instance</text>

  <!-- EICE -->
  <rect class="m" x="20" y="200" width="150" height="44" rx="5"/><text class="tb" x="32" y="226">EIC Endpoint</text>
  <rect class="idn" x="185" y="200" width="140" height="44" rx="5"/><text class="d" x="195" y="218">IAM:</text><text class="d" x="195" y="234">OpenTunnel</text>
  <rect class="net" x="340" y="200" width="160" height="44" rx="5"/><text class="d" x="350" y="218">endpoint in the</text><text class="d" x="350" y="234">subnet, no IGW</text>
  <rect class="opn" x="515" y="200" width="190" height="44" rx="5"/><text class="d" x="525" y="218">inbound 22 only</text><text class="d" x="525" y="234">from the endpoint SG</text>
  <rect class="ins" x="720" y="200" width="100" height="44" rx="5"/><text class="tb" x="732" y="226">instance</text>

  <!-- SSM -->
  <rect class="m" x="20" y="258" width="150" height="44" rx="5"/><text class="tb" x="32" y="284">Session Manager</text>
  <rect class="idn" x="185" y="258" width="140" height="44" rx="5"/><text class="d" x="195" y="276">IAM:</text><text class="d" x="195" y="292">StartSession</text>
  <rect class="net" x="340" y="258" width="160" height="44" rx="5"/><text class="d" x="350" y="276">agent goes out on 443</text><text class="d" x="350" y="292">via NAT or VPC endpoints</text>
  <rect class="cls" x="515" y="258" width="190" height="44" rx="5"/><text class="d" x="525" y="276">no inbound port</text><text class="d" x="525" y="292">(outbound only)</text>
  <rect class="ins" x="720" y="258" width="100" height="44" rx="5"/><text class="tb" x="732" y="284">instance</text>

  <!-- Serial -->
  <rect class="m" x="20" y="316" width="150" height="44" rx="5"/><text class="tb" x="32" y="342">Serial Console</text>
  <rect class="idn" x="185" y="316" width="140" height="44" rx="5"/><text class="d" x="195" y="334">IAM, then an</text><text class="d" x="195" y="350">OS password</text>
  <rect class="net" x="340" y="316" width="160" height="44" rx="5"/><text class="d" x="350" y="334">Nitro host,</text><text class="d" x="350" y="350">outside the VPC</text>
  <rect class="cls" x="515" y="316" width="190" height="44" rx="5"/><text class="d" x="525" y="334">no port, security group</text><text class="d" x="525" y="350">or network ACL</text>
  <rect class="ins" x="720" y="316" width="100" height="44" rx="5"/><text class="tb" x="732" y="342">serial port</text>

  <g class="lne">
    <path d="M170,106 H183 M325,106 H338 M500,106 H513 M705,106 H718"/>
    <path d="M170,164 H183 M325,164 H338 M500,164 H513 M705,164 H718"/>
    <path d="M170,222 H183 M325,222 H338 M500,222 H513 M705,222 H718"/>
    <path d="M170,280 H183 M325,280 H338 M500,280 H513 M705,280 H718"/>
    <path d="M170,338 H183 M325,338 H338 M500,338 H513 M705,338 H718"/>
  </g>

  <text class="d" x="20" y="390">Orange: a port you open and must restrict. Green: nothing to open, so a private subnet with no internet gateway works.</text>
  <text class="d" x="20" y="406">Instance Connect and the endpoint also need the package or your own key; Session Manager needs SSM Agent and an instance profile.</text>
</svg>
