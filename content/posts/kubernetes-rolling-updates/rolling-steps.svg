<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 412" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Rolling update step by step</title>
  <desc id="d">Deployment with 4 replicas, maxSurge 1 and maxUnavailable 0. Step 0: old ReplicaSet 4 pods. Step 1: new ReplicaSet creates 1 pod, 5 pods total. Step 2: the new pod becomes Ready and available, the old ReplicaSet scales to 3. Steps repeat until the new ReplicaSet has 4 and the old has 0. A new pod must pass its readiness probe and stay ready for minReadySeconds before the next step. The old ReplicaSet is kept with 0 replicas for rollback.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .d   { font-size: 11px; fill: #495057; }
      .c   { font-size: 11px; fill: #212529; }
      .m   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; }
      .mb  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; font-weight: 700; fill: #212529; }
      .ms  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #495057; }
      .lne { stroke: #495057; stroke-width: 1.4; fill: none; marker-end: url(#a); }
      .lnb { stroke: #1c7ed6; stroke-width: 1.4; fill: none; marker-end: url(#ab); }
      .dash{ stroke: #868e96; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
      .area{ fill: #f8f9fa; stroke: #ced4da; stroke-dasharray: 5 4; }
      .r   { fill: #e7f1ff; stroke: #6ea8fe; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .w   { fill: #ffe5cc; stroke: #fd9843; }
      .rw  { fill: #f3effc; stroke: #a98eda; }
      .x   { fill: #f8d7da; stroke: #e35d6a; }
      .n   { fill: #f8f9fa; stroke: #dee2e6; }
      .s   { fill: #ffffff; stroke: #adb5bd; }
      .num { fill: #495057; }
      .numt{ font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .ok  { font-size: 11px; font-weight: 700; fill: #2b8a3e; }
      .bad { font-size: 11px; font-weight: 700; fill: #c92a2a; }
    </style>
  </defs>
  <rect width="840" height="412" fill="#ffffff"/>
  <text class="h" x="20" y="28">One rollout, step by step</text>
  <text class="sub" x="20" y="48">4 replicas, maxSurge 1, maxUnavailable 0: never fewer than 4 ready, never more than 5 pods</text>
  <text class="lb" x="20" y="92">STEP 0</text>
  <rect class="r" x="90" y="76" width="44" height="26" rx="5"/><text class="m" x="102" y="94">v1</text>
  <rect class="r" x="140" y="76" width="44" height="26" rx="5"/><text class="m" x="152" y="94">v1</text>
  <rect class="r" x="190" y="76" width="44" height="26" rx="5"/><text class="m" x="202" y="94">v1</text>
  <rect class="r" x="240" y="76" width="44" height="26" rx="5"/><text class="m" x="252" y="94">v1</text>
  <text class="ms" x="350" y="94">old RS 4  new RS 0</text><text class="d" x="500" y="94">start</text>
  <text class="lb" x="20" y="136">STEP 1</text>
  <rect class="r" x="90" y="120" width="44" height="26" rx="5"/><text class="m" x="102" y="138">v1</text>
  <rect class="r" x="140" y="120" width="44" height="26" rx="5"/><text class="m" x="152" y="138">v1</text>
  <rect class="r" x="190" y="120" width="44" height="26" rx="5"/><text class="m" x="202" y="138">v1</text>
  <rect class="r" x="240" y="120" width="44" height="26" rx="5"/><text class="m" x="252" y="138">v1</text>
  <rect class="g" x="290" y="120" width="44" height="26" rx="5"/><text class="m" x="302" y="138">v2</text>
  <text class="ms" x="350" y="138">old RS 4  new RS 1</text><text class="d" x="500" y="138">surge: new pod created</text>
  <text class="lb" x="20" y="180">STEP 2</text>
  <rect class="r" x="90" y="164" width="44" height="26" rx="5"/><text class="m" x="102" y="182">v1</text>
  <rect class="r" x="140" y="164" width="44" height="26" rx="5"/><text class="m" x="152" y="182">v1</text>
  <rect class="r" x="190" y="164" width="44" height="26" rx="5"/><text class="m" x="202" y="182">v1</text>
  <rect class="g" x="240" y="164" width="44" height="26" rx="5"/><text class="m" x="252" y="182">v2</text>
  <text class="ms" x="350" y="182">old RS 3  new RS 1</text><text class="d" x="500" y="182">new pod Ready: one old removed</text>
  <text class="lb" x="20" y="224">STEP 3</text>
  <rect class="r" x="90" y="208" width="44" height="26" rx="5"/><text class="m" x="102" y="226">v1</text>
  <rect class="r" x="140" y="208" width="44" height="26" rx="5"/><text class="m" x="152" y="226">v1</text>
  <rect class="r" x="190" y="208" width="44" height="26" rx="5"/><text class="m" x="202" y="226">v1</text>
  <rect class="g" x="240" y="208" width="44" height="26" rx="5"/><text class="m" x="252" y="226">v2</text>
  <rect class="g" x="290" y="208" width="44" height="26" rx="5"/><text class="m" x="302" y="226">v2</text>
  <text class="ms" x="350" y="226">old RS 3  new RS 2</text><text class="d" x="500" y="226">next new pod</text>
  <text class="lb" x="20" y="268">STEP 4</text>
  <rect class="r" x="90" y="252" width="44" height="26" rx="5"/><text class="m" x="102" y="270">v1</text>
  <rect class="r" x="140" y="252" width="44" height="26" rx="5"/><text class="m" x="152" y="270">v1</text>
  <rect class="g" x="190" y="252" width="44" height="26" rx="5"/><text class="m" x="202" y="270">v2</text>
  <rect class="g" x="240" y="252" width="44" height="26" rx="5"/><text class="m" x="252" y="270">v2</text>
  <text class="ms" x="350" y="270">old RS 2  new RS 2</text><text class="d" x="500" y="270"></text>
  <text class="lb" x="20" y="312">STEP 5</text>
  <rect class="r" x="90" y="296" width="44" height="26" rx="5"/><text class="m" x="102" y="314">v1</text>
  <rect class="g" x="140" y="296" width="44" height="26" rx="5"/><text class="m" x="152" y="314">v2</text>
  <rect class="g" x="190" y="296" width="44" height="26" rx="5"/><text class="m" x="202" y="314">v2</text>
  <rect class="g" x="240" y="296" width="44" height="26" rx="5"/><text class="m" x="252" y="314">v2</text>
  <text class="ms" x="350" y="314">old RS 1  new RS 3</text><text class="d" x="500" y="314"></text>
  <text class="lb" x="20" y="356">STEP 6</text>
  <rect class="g" x="90" y="340" width="44" height="26" rx="5"/><text class="m" x="102" y="358">v2</text>
  <rect class="g" x="140" y="340" width="44" height="26" rx="5"/><text class="m" x="152" y="358">v2</text>
  <rect class="g" x="190" y="340" width="44" height="26" rx="5"/><text class="m" x="202" y="358">v2</text>
  <rect class="g" x="240" y="340" width="44" height="26" rx="5"/><text class="m" x="252" y="358">v2</text>
  <text class="ms" x="350" y="358">old RS 0  new RS 4</text><text class="d" x="500" y="358">old ReplicaSet kept at 0 for undo</text>
  <text class="d" x="20" y="394">Each step waits until the new pod is Ready (readiness probe) and has stayed Ready for minReadySeconds.</text>
</svg>
