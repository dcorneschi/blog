<path class="chev" d="M647,159.0 L654,165.0 L647,171.0"/>
<path class="chev" d="M676,159.0 L683,165.0 L676,171.0"/>
<text class="pt" x="560.0" y="143.0">ENCRYPTED SSH TUNNEL</text>
<line class="conn" x1="450" y1="195.0" x2="670" y2="195.0"/>
<text class="ct" x="560.0" y="213.0">connection opened by the ssh client, on the left</text>
</g>
