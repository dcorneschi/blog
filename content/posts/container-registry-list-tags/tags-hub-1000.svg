<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The Hub API's 1000-result limit</title>
  <desc id="d">With page_size 100, anonymous requests get pages 1 to 10 of library/nginx and page 11 answers 403 pagination offset too large, so 381 of the 1381 tags are never returned. Reading both name orders works around it: ordering=-name pages 1 to 10 give the first 1000 tags from A, ordering=name pages 1 to 10 give the last 1000 from Z, they overlap by 619 tags, and sort -u leaves all 1381. This covers up to 2000 tags.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .ths { font-size: 10.5px; font-weight: 700; fill: #495057; letter-spacing: .03em; }
      .m   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; }
      .pn  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; text-anchor: middle; }
      .d   { font-size: 11px; fill: #495057; }
      .ok  { fill: #e8f5ee; stroke: #75b798; }
      .no  { fill: #f8d7da; stroke: #e35d6a; }
      .az  { fill: #e7f1ff; stroke: #6ea8fe; }
      .za  { fill: #f3effc; stroke: #a98eda; }
      .all { fill: #e8f5ee; stroke: #75b798; }
      .ov  { fill: none; stroke: #495057; stroke-width: 1.2; stroke-dasharray: 3 3; }
      .lne { stroke: #495057; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>
  <text class="h" x="20" y="28">The Hub API's 1000-result limit</text>
  <text class="sub" x="20" y="48">library/nginx, 1381 tags, page_size=100, no login</text>

  <text class="ths" x="20" y="80">DEFAULT ORDER: PAGES OF 100</text>
  <!-- pages 1-10 ok, 11-14 403: x = 20 + (i-1)*66, width 60 -->
  <rect class="ok" x="20"  y="92" width="60" height="30" rx="4"/><text class="pn" x="50"  y="111">1</text>
  <rect class="ok" x="86"  y="92" width="60" height="30" rx="4"/><text class="pn" x="116" y="111">2</text>
  <rect class="ok" x="152" y="92" width="60" height="30" rx="4"/><text class="pn" x="182" y="111">3</text>
  <rect class="ok" x="218" y="92" width="60" height="30" rx="4"/><text class="pn" x="248" y="111">4</text>
  <rect class="ok" x="284" y="92" width="60" height="30" rx="4"/><text class="pn" x="314" y="111">5</text>
  <rect class="ok" x="350" y="92" width="60" height="30" rx="4"/><text class="pn" x="380" y="111">6</text>
  <rect class="ok" x="416" y="92" width="60" height="30" rx="4"/><text class="pn" x="446" y="111">7</text>
  <rect class="ok" x="482" y="92" width="60" height="30" rx="4"/><text class="pn" x="512" y="111">8</text>
  <rect class="ok" x="548" y="92" width="60" height="30" rx="4"/><text class="pn" x="578" y="111">9</text>
  <rect class="ok" x="614" y="92" width="60" height="30" rx="4"/><text class="pn" x="644" y="111">10</text>
  <rect class="no" x="690" y="92" width="60" height="30" rx="4"/><text class="pn" x="720" y="111">11 · 403</text>
  <rect class="no" x="756" y="92" width="60" height="30" rx="4"/><text class="pn" x="786" y="111">12</text>
  <rect class="no" x="822" y="92" width="60" height="30" rx="4"/><text class="pn" x="852" y="111">13</text>
  <rect class="no" x="888" y="92" width="52" height="30" rx="4"/><text class="pn" x="914" y="111">14</text>
  <text class="d" x="20" y="142">1000 tags, then curl: (56) … error: 403</text>
  <text class="m" x="690" y="142">"pagination offset too large</text>
  <text class="m" x="690" y="157"> for anonymous requests"</text>
  <text class="d" x="20" y="158">381 tags never come back</text>

  <text class="ths" x="20" y="196">BOTH ENDS: ALL 1381 TAGS IN NAME ORDER, A → Z</text>
  <!-- scale: 920 px for 1381 tags -> 0.6662 px per tag; 1000 tags = 666 px; 381 = 254 -->
  <rect class="az" x="20"  y="208" width="666" height="30" rx="4"/>
  <text class="m" x="32" y="227">ordering=-name, pages 1–10: "1" … first 1000</text>
  <rect class="za" x="274" y="246" width="666" height="30" rx="4"/>
  <text class="m" x="928" y="265" text-anchor="end">last 1000 … "trixie-perl" ordering=name, pages 1–10</text>
  <rect class="ov" x="274" y="203" width="412" height="78" rx="4"/>
  <text class="d" x="480" y="296" text-anchor="middle">619 tags in both</text>

  <path class="lne" d="M480,302 V314"/>
  <rect class="all" x="20" y="318" width="920" height="30" rx="4"/>
  <text class="m" x="32" y="337">sort -u → 1381 tags, every one</text>
  <text class="d" x="928" y="337" text-anchor="end">works up to 2000 tags</text>
</svg>
