<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Five ways to list tags</title>
  <desc id="d">The Hub API on hub.docker.com needs no token, returns 10 tags per page by default and at most 100, follows .next and stops at 1000 results for anonymous users; the names are in .results[].name. The Registry v2 API at /v2/image/tags/list needs an anonymous bearer token on Docker Hub and GHCR, returns everything on Docker Hub, 100 on GHCR and 50 on Gitea, pages with n, last and the Link header; the names are in .tags[]. The Quay API needs no token, pages of 100 with page and has_additional; names in .tags[].name. skopeo list-tags and crane ls get tokens and follow pages themselves; skopeo prints .Tags[] and crane plain lines.</desc>
  <defs>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .ths { font-size: 10.5px; font-weight: 700; fill: #495057; letter-spacing: .03em; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .m   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; }
      .mb  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; font-weight: 700; fill: #212529; }
      .d   { font-size: 11px; fill: #495057; }
      .hub { fill: #e7f1ff; stroke: #6ea8fe; }
      .v2  { fill: #f3effc; stroke: #a98eda; }
      .qu  { fill: #fff3cd; stroke: #ffc107; }
      .tl  { fill: #e8f5ee; stroke: #75b798; }
      .jq  { fill: #ffffff; stroke: #adb5bd; }
      .ln  { stroke: #dee2e6; stroke-width: 1; }
    </style>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text class="h" x="20" y="28">Five ways to list tags</text>
  <text class="sub" x="20" y="48">What each one needs, how it pages, and where jq finds the names (counts from 6 November 2026)</text>

  <text class="ths" x="20" y="78">METHOD</text>
  <text class="ths" x="190" y="78">REQUEST</text>
  <text class="ths" x="470" y="78">AUTH (PUBLIC IMAGES)</text>
  <text class="ths" x="630" y="78">PAGING</text>
  <text class="ths" x="820" y="78">TAG NAMES IN</text>
  <line class="ln" x1="20" y1="88" x2="940" y2="88"/>

  <!-- Hub API -->
  <rect class="hub" x="20" y="100" width="156" height="50" rx="6"/>
  <text class="tb" x="32" y="121">Hub API</text>
  <text class="d" x="32" y="139">Docker Hub only</text>
  <text class="m" x="190" y="121">hub.docker.com/v2/repositories/</text>
  <text class="m" x="190" y="139">  &lt;ns&gt;/&lt;image&gt;/tags/</text>
  <text class="d" x="470" y="121">none</text>
  <text class="d" x="630" y="121">10 per page, max 100, follow .next</text>
  <text class="d" x="630" y="139">anonymous: 403 after 1000</text>
  <rect class="jq" x="820" y="108" width="120" height="34" rx="4"/>
  <text class="mb" x="880" y="130" text-anchor="middle">.results[].name</text>
  <line class="ln" x1="20" y1="160" x2="940" y2="160"/>

  <!-- Registry v2 -->
  <rect class="v2" x="20" y="170" width="156" height="66" rx="6"/>
  <text class="tb" x="32" y="191">Registry v2 API</text>
  <text class="d" x="32" y="209">Docker Hub, GHCR,</text>
  <text class="d" x="32" y="225">Gitea, registry:3</text>
  <text class="m" x="190" y="191">&lt;host&gt;/v2/&lt;image&gt;/tags/list</text>
  <text class="m" x="190" y="209">  ?n=1000&amp;last=&lt;tag&gt;</text>
  <text class="d" x="470" y="191">bearer token from the</text>
  <text class="d" x="470" y="207">www-authenticate realm</text>
  <text class="d" x="470" y="223">(Gitea, registry:3: none)</text>
  <text class="d" x="630" y="191">Docker Hub: all 1381 at once</text>
  <text class="d" x="630" y="207">GHCR 100, Gitea 50 without n</text>
  <text class="d" x="630" y="223">follow the Link header</text>
  <rect class="jq" x="820" y="186" width="120" height="34" rx="4"/>
  <text class="mb" x="880" y="208" text-anchor="middle">.tags[]</text>
  <line class="ln" x1="20" y1="246" x2="940" y2="246"/>

  <!-- Quay -->
  <rect class="qu" x="20" y="256" width="156" height="50" rx="6"/>
  <text class="tb" x="32" y="277">Quay API</text>
  <text class="d" x="32" y="295">quay.io</text>
  <text class="m" x="190" y="277">quay.io/api/v1/repository/</text>
  <text class="m" x="190" y="295">  &lt;ns&gt;/&lt;image&gt;/tag/?page=1</text>
  <text class="d" x="470" y="277">none</text>
  <text class="d" x="630" y="277">limit max 100, page=2, 3, …</text>
  <text class="d" x="630" y="295">while has_additional is true</text>
  <rect class="jq" x="820" y="264" width="120" height="34" rx="4"/>
  <text class="mb" x="880" y="286" text-anchor="middle">.tags[].name</text>
  <line class="ln" x1="20" y1="316" x2="940" y2="316"/>

  <!-- tools -->
  <rect class="tl" x="20" y="326" width="156" height="58" rx="6"/>
  <text class="tb" x="32" y="347">skopeo · crane</text>
  <text class="d" x="32" y="365">any registry</text>
  <text class="m" x="190" y="347">skopeo list-tags docker://&lt;ref&gt;</text>
  <text class="m" x="190" y="365">crane ls &lt;ref&gt;</text>
  <text class="d" x="470" y="347">anonymous token itself,</text>
  <text class="d" x="470" y="363">or your docker login</text>
  <text class="d" x="630" y="347">every page, no limit</text>
  <text class="d" x="630" y="363">(nginx 1381, GHCR 1136)</text>
  <rect class="jq" x="820" y="328" width="120" height="24" rx="4"/>
  <text class="mb" x="880" y="345" text-anchor="middle">.Tags[]</text>
  <rect class="jq" x="820" y="356" width="120" height="24" rx="4"/>
  <text class="d" x="880" y="372" text-anchor="middle">one per line</text>
</svg>
