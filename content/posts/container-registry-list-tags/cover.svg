<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Listing Image Tags</title>
  <desc id="d">The Docker whale above the title Listing Image Tags and the subtitle Docker Hub, Registry v2, skopeo and crane, with three steps: ask the registry API for tags/list, follow every page past the 1000-result limit, and sort by version with sort -V.</desc>
  <defs>
    <style>
      .bg   { fill: #f8f9fa; }
      .wh   { fill: #2496ed; }
      .box  { fill: #2496ed; stroke: #f8f9fa; stroke-width: 6; }
      .h    { font-size: 190px; font-weight: 700; fill: #212529; letter-spacing: -2px; }
      .s    { font-size: 84px; fill: #495057; }
      .card { fill: #ffffff; stroke: #dee2e6; stroke-width: 4; }
      .ct   { font-size: 64px; font-weight: 700; fill: #212529; }
      .cs   { font-size: 44px; fill: #868e96; }
      .num  { font-size: 52px; font-weight: 700; fill: #ffffff; }
      .dot  { fill: #2496ed; }
      .on   { fill: #2496ed; }
      .off  { fill: #f1aeb5; }
      .reg  { fill: #8250df; }
      .arr  { stroke: #adb5bd; stroke-width: 12; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .mono { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 40px; fill: #495057; }
      .monob{ font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 40px; font-weight: 700; fill: #2496ed; }
      @media (prefers-color-scheme: dark) {
        .bg   { fill: #161b22; }
        .box  { stroke: #161b22; }
        .h    { fill: #f0f6fc; }
        .s    { fill: #c9d1d9; }
        .card { fill: #0d1117; stroke: #30363d; }
        .ct   { fill: #f0f6fc; }
        .cs   { fill: #8b949e; }
        .off  { fill: #6e3a40; }
        .arr  { stroke: #484f58; }
        .mono { fill: #c9d1d9; }
      }
    </style>
  </defs>

  <rect class="bg" width="2752" height="1536"/>

  <!-- mark: the Docker whale with its containers -->
  <g>
    <rect class="box" x="1164" y="290" width="64" height="64" rx="6"/>
    <rect class="box" x="1234" y="290" width="64" height="64" rx="6"/>
    <rect class="box" x="1304" y="290" width="64" height="64" rx="6"/>
    <rect class="box" x="1374" y="290" width="64" height="64" rx="6"/>
    <rect class="box" x="1444" y="290" width="64" height="64" rx="6"/>
    <rect class="box" x="1234" y="220" width="64" height="64" rx="6"/>
    <rect class="box" x="1304" y="220" width="64" height="64" rx="6"/>
    <rect class="box" x="1374" y="220" width="64" height="64" rx="6"/>
    <rect class="box" x="1304" y="150" width="64" height="64" rx="6"/>
    <path class="wh" d="M1126,354 H1566 C1590,326 1628,316 1668,324 C1658,354 1638,366 1614,372 C1590,452 1500,510 1354,510 C1206,510 1124,444 1126,354 Z"/>
    <circle cx="1226" cy="404" r="12" fill="#ffffff"/>
  </g>

  <text class="h" x="1376" y="690" text-anchor="middle">Listing Image Tags</text>
  <text class="s" x="1376" y="800" text-anchor="middle">Docker Hub, Registry v2, skopeo and crane</text>

  <!-- card 1: ask the API -->
  <rect class="card" x="136" y="900" width="720" height="440" rx="28"/>
  <circle class="dot" cx="206" cy="970" r="40"/>
  <text class="num" x="206" y="988" text-anchor="middle">1</text>
  <g>
    <ellipse class="reg" cx="316" cy="1010" rx="62" ry="20"/>
    <rect class="reg" x="254" y="1010" width="124" height="100"/>
    <ellipse class="reg" cx="316" cy="1110" rx="62" ry="20"/>
    <path class="arr" d="M398,1060 H438 M418,1040 L438,1060 L418,1080"/>
    <text class="mono" x="458" y="1030">1.31.8</text>
    <text class="mono" x="458" y="1080">1.31.7</text>
    <text class="mono" x="458" y="1130">stable</text>
  </g>
  <text class="ct" x="496" y="1230" text-anchor="middle">Ask for tags/list</text>
  <text class="cs" x="496" y="1290" text-anchor="middle">an anonymous token is enough</text>
  <path class="arr" d="M886,1120 H986 M956,1090 L986,1120 L956,1150"/>

  <!-- card 2: every page -->
  <rect class="card" x="1016" y="900" width="720" height="440" rx="28"/>
  <circle class="dot" cx="1086" cy="970" r="40"/>
  <text class="num" x="1086" y="988" text-anchor="middle">2</text>
  <rect class="on" x="1106" y="1040" width="44" height="56" rx="8"/>
  <rect class="on" x="1158" y="1040" width="44" height="56" rx="8"/>
  <rect class="on" x="1210" y="1040" width="44" height="56" rx="8"/>
  <rect class="on" x="1262" y="1040" width="44" height="56" rx="8"/>
  <rect class="on" x="1314" y="1040" width="44" height="56" rx="8"/>
  <rect class="on" x="1366" y="1040" width="44" height="56" rx="8"/>
  <rect class="on" x="1418" y="1040" width="44" height="56" rx="8"/>
  <rect class="on" x="1470" y="1040" width="44" height="56" rx="8"/>
  <rect class="on" x="1522" y="1040" width="44" height="56" rx="8"/>
  <rect class="on" x="1574" y="1040" width="44" height="56" rx="8"/>
  <rect class="off" x="1626" y="1040" width="44" height="56" rx="8"/>
  <text class="cs" x="1376" y="1150" text-anchor="middle" style="font-size:38px">10 pages, then 403</text>
  <text class="ct" x="1376" y="1230" text-anchor="middle">Follow every page</text>
  <text class="cs" x="1376" y="1290" text-anchor="middle">.next, Link, or skopeo / crane</text>
  <path class="arr" d="M1766,1120 H1866 M1836,1090 L1866,1120 L1836,1150"/>

  <!-- card 3: sort -V -->
  <rect class="card" x="1896" y="900" width="720" height="440" rx="28"/>
  <circle class="dot" cx="1966" cy="970" r="40"/>
  <text class="num" x="1966" y="988" text-anchor="middle">3</text>
  <text class="mono" x="2066" y="1050">1.2</text>
  <text class="mono" x="2066" y="1100">1.9</text>
  <text class="monob" x="2066" y="1150">1.10</text>
  <path class="arr" d="M2216,1090 H2286 M2266,1070 L2286,1090 L2266,1110"/>
  <text class="monob" x="2316" y="1104">sort -V</text>
  <text class="ct" x="2256" y="1230" text-anchor="middle">Sort by version</text>
  <text class="cs" x="2256" y="1290" text-anchor="middle">filter first, then pin the digest</text>
</svg>
