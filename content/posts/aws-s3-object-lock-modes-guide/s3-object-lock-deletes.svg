<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What happens to a DELETE on a locked object</title>
  <desc id="d">A DELETE without a version ID returns 200 OK and adds a delete marker as the current version; the locked version stays below and the marker itself is not WORM-protected. A DELETE with a version ID is checked in order: if a legal hold is on, 403 Access Denied; if a compliance retention is in force, 403; if a governance retention is in force, 403 unless the caller has s3:BypassGovernanceRetention and sends the bypass header, in which case the version is deleted; with no lock in force the version is deleted.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .ms  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #495057; }
      .mb  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; font-weight: 700; fill: #212529; }
      .d   { font-size: 11px; fill: #495057; }
      .lne { stroke: #495057; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .s   { fill: #ffffff; stroke: #adb5bd; }
      .q   { fill: #f8f9fa; stroke: #adb5bd; }
      .x   { fill: #f8d7da; stroke: #e35d6a; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .r   { fill: #e7f1ff; stroke: #6ea8fe; }
    </style>
  </defs>
  <rect width="840" height="400" fill="#ffffff"/>
  <text class="h" x="20" y="28">What happens to a DELETE on a locked object</text>
  <text class="sub" x="20" y="48">The version ID decides whether S3 even looks at the lock</text>

  <!-- simple delete -->
  <rect class="s" x="20" y="66" width="250" height="52" rx="6"/>
  <text class="mb" x="32" y="88">DELETE key</text>
  <text class="d" x="32" y="106">no version ID</text>
  <path class="lne" d="M145,118 L145,146"/>
  <rect class="r" x="20" y="148" width="250" height="88" rx="6"/>
  <text class="tb" x="32" y="170">200 OK, delete marker added</text>
  <text class="d" x="32" y="190">marker becomes the current version;</text>
  <text class="d" x="32" y="206">locked version stays underneath;</text>
  <text class="d" x="32" y="222">the marker is not WORM-protected</text>

  <!-- version delete -->
  <rect class="s" x="310" y="66" width="250" height="52" rx="6"/>
  <text class="mb" x="322" y="88">DELETE key?versionId=...</text>
  <text class="d" x="322" y="106">permanent delete of one version</text>
  <path class="lne" d="M435,118 L435,136"/>

  <rect class="q" x="310" y="138" width="250" height="40" rx="6"/>
  <text class="tb" x="322" y="163">Legal hold ON?</text>
  <path class="lne" d="M560,158 L628,158"/><text class="d" x="572" y="152">yes</text>
  <path class="lne" d="M435,178 L435,196"/><text class="d" x="442" y="192">no</text>

  <rect class="q" x="310" y="198" width="250" height="40" rx="6"/>
  <text class="tb" x="322" y="223">Compliance retention in force?</text>
  <path class="lne" d="M560,218 L628,218"/><text class="d" x="572" y="212">yes</text>
  <path class="lne" d="M435,238 L435,256"/><text class="d" x="442" y="252">no</text>

  <rect class="q" x="310" y="258" width="250" height="40" rx="6"/>
  <text class="tb" x="322" y="283">Governance retention in force?</text>
  <path class="lne" d="M560,278 L628,278"/><text class="d" x="572" y="272">yes</text>
  <path class="lne" d="M435,298 L435,330"/><text class="d" x="442" y="318">no</text>

  <rect class="x" x="630" y="138" width="190" height="100" rx="6"/>
  <text class="tb" x="642" y="160">403 Access Denied</text>
  <text class="d" x="642" y="180">nobody can delete it:</text>
  <text class="d" x="642" y="196">bypass flag ignored</text>
  <text class="d" x="642" y="212">for these two</text>

  <rect class="q" x="630" y="258" width="190" height="56" rx="6"/>
  <text class="d" x="642" y="278">s3:BypassGovernanceRetention</text>
  <text class="d" x="642" y="294">and the bypass header?</text>
  <path class="lne" d="M725,314 L725,330"/>
  <text class="d" x="732" y="326">yes</text>

  <rect class="g" x="310" y="332" width="510" height="52" rx="6"/>
  <text class="tb" x="322" y="354">Version deleted for good</text>
  <text class="d" x="322" y="372">no lock in force, or governance bypassed (the console sends the header automatically)</text>
  <text class="d" x="20" y="300">Without the permission or header,</text>
  <text class="d" x="20" y="316">a governance-locked version also</text>
  <text class="d" x="20" y="332">returns 403 Access Denied.</text>
</svg>
