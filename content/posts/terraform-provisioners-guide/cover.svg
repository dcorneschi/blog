<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Terraform Provisioners Guide</title>
  <desc id="d">Terraform Provisioners Guide: local-exec, remote-exec and file provisioners. connection, bastion, null_resource, terraform_data, triggers, on_failure, destroy-time. Small drawings: create, provision and ready pills, a terminal with terraform apply and terraform apply -replace, and icons for local-exec, remote-exec and file.</desc>
