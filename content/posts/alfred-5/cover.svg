    <path class="as" stroke-width="10" d="M70,58 C100,58 100,100 130,100 M70,144 C100,144 100,100 130,100"/>
  </g>
  <text class="n" x="2450" y="470" text-anchor="middle" font-size="36">workflows</text>

  <!-- center: launcher window -->
  <g transform="translate(0,-60)">
  <rect class="win" x="1046" y="200" width="660" height="560" rx="28"/>
  <rect class="fld" x="1076" y="230" width="600" height="96" rx="16"/>
  <circle class="as" cx="1126" cy="274" r="20" stroke-width="8"/>
  <path class="as" stroke-width="8" d="M1140,288 L1156,304"/>
  <text class="ink mono" x="1180" y="294" font-size="48" font-weight="700">term<tspan class="a"> |</tspan></text>
  <rect class="sel" x="1076" y="452" width="600" height="110" rx="14"/>
  <g class="mono">
    <rect class="a" x="1100" y="364" width="56" height="56" rx="12" opacity=".35"/>
    <text class="ink" x="1180" y="392" font-size="36" font-weight="700">Terminal</text>
    <text class="n" x="1180" y="428" font-size="26">Application</text>
    <rect class="a" x="1100" y="479" width="56" height="56" rx="12"/>
    <text class="ink" x="1180" y="507" font-size="36" font-weight="700">Ghostty</text>
    <text class="n" x="1180" y="543" font-size="26">Application</text>
    <text class="n" x="1650" y="520" text-anchor="end" font-size="30">↩</text>
    <rect class="a" x="1100" y="594" width="56" height="56" rx="12" opacity=".7"/>
    <text class="ink" x="1180" y="622" font-size="36" font-weight="700">Google 'term'</text>
    <text class="n" x="1180" y="658" font-size="26">Web search</text>
  </g>
  <text class="n" x="1376" y="728" text-anchor="middle" font-size="28">⌥ Space</text>

    </g>
<text class="h" x="1376" y="880" text-anchor="middle" font-size="150">Alfred 5 for DevOps</text>
  <text class="s" x="1376" y="1030" text-anchor="middle" font-size="94">Launcher, Powerpack and Workflows</text>
  <line class="r" x1="776" y1="1105" x2="1976" y2="1105"/>
  <text class="n" x="1376" y="1210" text-anchor="middle" font-size="47">Clipboard · Snippets · Workflows · File Navigation · AppleScript · Alfred 5.8.1</text>

  <!-- bottom row: small icons -->
  <g transform="translate(546,1290) scale(0.5)"><rect class="a" x="20" y="50" width="160" height="100" rx="16"/><text x="100" y="122" text-anchor="middle" font-size="64" fill="#fff" font-weight="700">⌥</text></g>
  <text class="n" x="596" y="1450" text-anchor="middle" font-size="34">hotkey</text>
  <g transform="translate(806,1290) scale(0.5)"><path class="as" stroke-width="16" d="M44,14 H126 L162,50 V186 H44 Z"/><circle class="as" cx="96" cy="104" r="28" stroke-width="12"/><path class="as" stroke-width="12" d="M116,124 L140,148"/></g>
  <text class="n" x="856" y="1450" text-anchor="middle" font-size="34">file search</text>
  <g transform="translate(1066,1290) scale(0.5)"><rect class="a" x="36" y="14" width="128" height="172" rx="18"/><rect x="58" y="36" width="84" height="40" rx="6" fill="#fff"/><g fill="#fff"><circle cx="74" cy="110" r="10"/><circle cx="100" cy="110" r="10"/><circle cx="126" cy="110" r="10"/><circle cx="74" cy="150" r="10"/><circle cx="100" cy="150" r="10"/><circle cx="126" cy="150" r="10"/></g></g>
  <text class="n" x="1116" y="1450" text-anchor="middle" font-size="34">calculator</text>
  <g transform="translate(1326,1290) scale(0.5)"><circle class="as" cx="100" cy="100" r="80" stroke-width="14"/><path class="as" stroke-width="12" d="M20,100 H180 M100,20 C60,60 60,140 100,180 M100,20 C140,60 140,140 100,180"/></g>
  <text class="n" x="1376" y="1450" text-anchor="middle" font-size="34">web search</text>
  <g transform="translate(1586,1290) scale(0.5)"><path class="a" d="M20,50 Q20,36 34,36 H80 L96,54 H166 Q180,54 180,68 V160 Q180,174 166,174 H34 Q20,174 20,160 Z"/></g>
  <text class="n" x="1636" y="1450" text-anchor="middle" font-size="34">prefs folder</text>
  <g transform="translate(1846,1290) scale(0.5)"><path class="as" stroke-width="18" d="M40,60 L90,100 L40,140 M110,150 H170"/></g>
  <text class="n" x="1896" y="1450" text-anchor="middle" font-size="34">shell</text>
  <g transform="translate(2106,1290) scale(0.5)"><path class="as" stroke-width="16" d="M44,14 H126 L162,50 V186 H44 Z"/><path class="as" stroke-width="12" d="M70,90 L54,108 L70,126 M130,90 L146,108 L130,126 M110,80 L90,136"/></g>
  <text class="n" x="2156" y="1450" text-anchor="middle" font-size="34">AppleScript</text>
