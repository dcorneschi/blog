<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Alfred 5 for DevOps</title>
  <desc id="d">Alfred 5 for DevOps: Launcher, Powerpack and Workflows. A launcher window with the query term and app and web search results; a terminal running brew install and osascript search; a 5.8.1 pill; icons for clipboard history, snippets, workflows, hotkey, file search, calculator, web search and AppleScript.</desc>
  <defs>
    <style>
      .bg  { fill: #f8f9fa; }
      .a   { fill: #5b2d8e; }
      .as  { stroke: #5b2d8e; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .win { fill: #ffffff; stroke: #ced4da; stroke-width: 4; }
      .fld { fill: #f1f3f5; }
      .sel { fill: #5b2d8e; fill-opacity: .12; }
      .ink { fill: #343a40; }
      .h   { font-weight: 700; fill: #212529; letter-spacing: -2px; }
      .s   { fill: #495057; }
      .n   { fill: #868e96; }
      .r   { stroke: #dee2e6; stroke-width: 2; }
      .pn  { fill: #ffffff; stroke: #adb5bd; stroke-width: 5; }
      .pg  { fill: #f1eafa; stroke: #9b72cf; stroke-width: 5; }
      .term{ fill: #212529; }
      .tbar{ fill: #343a40; }
      .tx  { fill: #e9ecef; }
      .cur { fill: #b48cff; }
      .mono{ font-family: Menlo, Consolas, 'Liberation Mono', monospace; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #161b22; }
        .a   { fill: #b48cff; }
        .as  { stroke: #b48cff; }
        .win { fill: #0d1117; stroke: #30363d; }
        .fld { fill: #21262d; }
        .sel { fill: #b48cff; fill-opacity: .16; }
        .ink { fill: #c9d1d9; }
        .h   { fill: #f0f6fc; }
        .s   { fill: #c9d1d9; }
        .n   { fill: #8b949e; }
        .r   { stroke: #30363d; }
        .pn  { fill: #0d1117; stroke: #484f58; }
        .pg  { fill: #241a33; stroke: #8a63c4; }
        .term{ fill: #0d1117; stroke: #30363d; stroke-width: 4; }
        .tbar{ fill: #21262d; }
      }
    </style>
  </defs>
  <rect class="bg" width="2752" height="1536"/>

  <!-- top left: version pill and terminal -->
  <rect class="pn" x="131" y="171" width="250" height="84" rx="42"/>
  <text class="ink mono" x="256" y="226" text-anchor="middle" font-size="38" font-weight="700">free</text>
  <path class="as" stroke-width="7" d="M389,213 H435 M415,197 L435,213 L415,229"/>
  <rect class="pg" x="445" y="171" width="250" height="84" rx="42"/>
  <text class="ink mono" x="570" y="226" text-anchor="middle" font-size="38" font-weight="700">5.8.1</text>
  <text class="n mono" x="413" y="320" text-anchor="middle" font-size="32">+ Powerpack, one-time</text>
  <rect class="term" x="131" y="400" width="890" height="210" rx="20"/>
  <rect class="tbar" x="131" y="400" width="890" height="50" rx="20"/>
  <rect class="tbar" x="131" y="430" width="890" height="20"/>
  <circle cx="171" cy="425" r="11" fill="#ff5f57"/><circle cx="211" cy="425" r="11" fill="#febc2e"/><circle cx="251" cy="425" r="11" fill="#28c840"/>
  <text class="tx mono" x="166" y="510" font-size="34">$ brew install --cask alfred</text>
  <text class="tx mono" x="166" y="570" font-size="34">$ osascript … search "kubectl "'<tspan class="cur"> █</tspan></text>

  <!-- top right: three feature icons -->
  <g transform="translate(1795,190) scale(1.15)">
    <rect class="as" x="44" y="34" width="112" height="146" rx="14" stroke-width="14"/>
    <rect class="a" x="72" y="20" width="56" height="30" rx="8"/>
