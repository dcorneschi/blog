  </g>
  <text class="n" x="1910" y="470" text-anchor="middle" font-size="36">clipboard</text>
  <g transform="translate(2065,190) scale(1.15)">
    <rect class="a" x="22" y="40" width="156" height="120" rx="16"/>
    <text x="100" y="122" text-anchor="middle" font-size="64" font-weight="700" fill="#fff" class="mono">;;</text>
  </g>
  <text class="n" x="2180" y="470" text-anchor="middle" font-size="36">snippets</text>
  <g transform="translate(2335,190) scale(1.15)">
    <rect class="a" x="14" y="30" width="56" height="56" rx="12"/>
    <rect class="a" x="130" y="72" width="56" height="56" rx="12"/>
