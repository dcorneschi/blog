<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 344" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">QoS classes come from the requests and limits</title>
  <desc id="d">BestEffort: no requests or limits; cpu.shares 2, no CPU quota, no memory limit, oom_score_adj 1000, cgroup /kubepods/besteffort. Burstable: some requests or limits but not Guaranteed; with a 1 CPU and 100Mi request, cpu.shares 1024, no quota, no memory limit, oom_score_adj 994, cgroup /kubepods/burstable. Guaranteed: requests equal limits for CPU and memory in every container; cpu.shares 1024, quota 100000 per 100000, memory limit 104857600, oom_score_adj -997, cgroup /kubepods/pod-uid.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc3545"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .m   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; }
      .mb  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; font-weight: 700; fill: #212529; }
      .ms  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #495057; }
      .d   { font-size: 11px; fill: #495057; }
      .c   { font-size: 11px; fill: #212529; }
      .ax  { font-size: 10.5px; fill: #495057; text-anchor: middle; }
      .lne { stroke: #495057; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .lnx { stroke: #dc3545; stroke-width: 1.6; fill: none; stroke-dasharray: 5 3; marker-end: url(#ax); }
      .dash{ stroke: #868e96; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .tick{ stroke: #dee2e6; stroke-width: 1; }
      .r   { fill: #e7f1ff; stroke: #6ea8fe; }
      .w   { fill: #ffe5cc; stroke: #fd9843; }
      .rw  { fill: #f3effc; stroke: #a98eda; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .x   { fill: #f8d7da; stroke: #e35d6a; }
      .n   { fill: #f8f9fa; stroke: #dee2e6; }
      .s   { fill: #ffffff; stroke: #adb5bd; }
      .sd  { fill: #ffffff; stroke: #adb5bd; stroke-dasharray: 4 3; }
      .bar { fill: #cfe2ff; }
      .kil { fill: #dc3545; }
      .sig { fill: #495057; }
    </style>
  </defs>
  <rect width="840" height="344" fill="#ffffff"/>
  <text class="h" x="20" y="28">QoS classes come from the requests and limits</text>
  <text class="sub" x="20" y="48">Three pods, identical except for resources: none, requests cpu 1 / memory 100Mi, and the same as limits</text>
  <text class="lb" x="20" y="80">CLASS</text>
  <text class="lb" x="150" y="80">RULE</text>
  <text class="lb" x="370" y="80">CPU (cgroup v1)</text>
  <text class="lb" x="510" y="80">MEMORY LIMIT</text>
  <text class="lb" x="610" y="80">OOM_SCORE_ADJ</text>
  <text class="lb" x="720" y="80">CGROUP</text>
  <rect class="x" x="20" y="92" width="120" height="56" rx="6"/>
  <text class="tb" x="32" y="125">BestEffort</text>
  <rect class="s" x="150" y="92" width="670" height="56" rx="6"/>
  <text class="c" x="162" y="116">no requests and no limits</text>
  <text class="c" x="162" y="132">in any container</text>
  <text class="ms" x="370" y="116">shares 2</text>
  <text class="ms" x="370" y="132">no quota</text>
  <text class="ms" x="510" y="124">none</text>
  <text class="mb" x="610" y="124">1000</text>
  <text class="ms" x="720" y="116">/kubepods/</text>
  <text class="ms" x="720" y="132">besteffort</text>
  <rect class="w" x="20" y="158" width="120" height="56" rx="6"/>
  <text class="tb" x="32" y="191">Burstable</text>
  <rect class="s" x="150" y="158" width="670" height="56" rx="6"/>
  <text class="c" x="162" y="182">some requests or limits,</text>
  <text class="c" x="162" y="198">but not Guaranteed</text>
  <text class="ms" x="370" y="182">shares 1024</text>
  <text class="ms" x="370" y="198">no quota</text>
  <text class="ms" x="510" y="190">none</text>
  <text class="mb" x="610" y="190">994</text>
  <text class="ms" x="720" y="182">/kubepods/</text>
  <text class="ms" x="720" y="198">burstable</text>
  <rect class="g" x="20" y="224" width="120" height="56" rx="6"/>
  <text class="tb" x="32" y="257">Guaranteed</text>
  <rect class="s" x="150" y="224" width="670" height="56" rx="6"/>
  <text class="c" x="162" y="248">every container: requests</text>
  <text class="c" x="162" y="264">equal limits for CPU and memory</text>
  <text class="ms" x="370" y="248">shares 1024</text>
  <text class="ms" x="370" y="264">quota 100000/100000</text>
  <text class="ms" x="510" y="256">104857600</text>
  <text class="mb" x="610" y="256">-997</text>
  <text class="ms" x="720" y="248">/kubepods/</text>
  <text class="ms" x="720" y="264">pod&lt;uid&gt;</text>
  <text class="d" x="20" y="298">Read in each container on k3s v1.34.1 (4 CPUs, 15.7 GiB). Burstable: 1000 − 1000 × request / node memory, kept between 3 and 999.</text>
  <text class="d" x="20" y="314">Guaranteed is −997 in the kubelet code; this test node raised negative scores to 0, so it showed 0.</text>
  <text class="d" x="20" y="330">On cgroup v2 the same pods get cpu.weight 1, 100 and 100, cpu.max "max 100000" or "100000 100000", and memory.max.</text>
</svg>
