  <title id="t">Kubernetes Requests and Limits</title>
  <desc id="d">Kubernetes Requests and Limits: What CPU and memory settings really do. scheduling, cpu.shares, cpu.max, throttling, memory.max, OOMKilled, QoS, LimitRange. Small drawings: request, usage, limit; a terminal running kubectl top pod and cat /sys/fs/cgroup/cpu.max; cgroups, memory.max, cpu.max; a CPU bar and a memory bar with request and limit; icons for scheduler, allocatable, restarts, memory, throttling, OOMKilled, QoS classes.</desc>
