<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 376" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A 200m CPU limit turns a 25 ms burst into about 300 ms</title>
  <desc id="d">A burst on 4 cores that needs about 100 ms of CPU. Without a limit it finishes after 25 ms. With limits.cpu 200m the cgroup may use 20 ms of CPU per 100 ms period: on 4 cores the quota is used up after 5 ms, the cgroup is throttled until the next period, and the burst finishes after about 300 ms (measured 200 to 306 ms) while the pod averages only about 100m.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc3545"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .m   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; }
      .mb  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; font-weight: 700; fill: #212529; }
      .ms  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #495057; }
      .d   { font-size: 11px; fill: #495057; }
      .c   { font-size: 11px; fill: #212529; }
      .ax  { font-size: 10.5px; fill: #495057; text-anchor: middle; }
      .lne { stroke: #495057; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .lnx { stroke: #dc3545; stroke-width: 1.6; fill: none; stroke-dasharray: 5 3; marker-end: url(#ax); }
      .dash{ stroke: #868e96; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .tick{ stroke: #dee2e6; stroke-width: 1; }
      .r   { fill: #e7f1ff; stroke: #6ea8fe; }
      .w   { fill: #ffe5cc; stroke: #fd9843; }
      .rw  { fill: #f3effc; stroke: #a98eda; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .x   { fill: #f8d7da; stroke: #e35d6a; }
      .n   { fill: #f8f9fa; stroke: #dee2e6; }
      .s   { fill: #ffffff; stroke: #adb5bd; }
      .sd  { fill: #ffffff; stroke: #adb5bd; stroke-dasharray: 4 3; }
      .bar { fill: #cfe2ff; }
      .kil { fill: #dc3545; }
      .sig { fill: #495057; }
      .busy{ fill: #6ea8fe; }
      .thr { fill: #f8d7da; }
    </style>
  </defs>
  <rect width="840" height="376" fill="#ffffff"/>
  <text class="h" x="20" y="28">A 200m CPU limit turns a 25 ms burst into about 300 ms</text>
  <text class="sub" x="20" y="48">The same burst on 4 cores (about 100 ms of CPU in total), with no limit and with limits.cpu: 200m</text>
  <line class="tick" x1="150.0" y1="70" x2="150.0" y2="276"/>
  <text class="ax" x="150.0" y="290">0 ms</text>
  <line class="tick" x1="310.0" y1="70" x2="310.0" y2="276"/>
  <text class="ax" x="310.0" y="290">100 ms</text>
  <line class="tick" x1="470.0" y1="70" x2="470.0" y2="276"/>
  <text class="ax" x="470.0" y="290">200 ms</text>
  <line class="tick" x1="630.0" y1="70" x2="630.0" y2="276"/>
  <text class="ax" x="630.0" y="290">300 ms</text>
  <line class="tick" x1="790.0" y1="70" x2="790.0" y2="276"/>
  <text class="ax" x="790.0" y="290">400 ms</text>
  <text class="ax" x="710.0" y="66">quota periods of 100 ms</text>
  <text class="tb" x="20" y="96">No limit</text>
  <text class="d" x="20" y="112">4 cores, 25 ms each</text>
  <rect class="busy" x="150.0" y="86" width="40.0" height="10" rx="2"/>
  <rect class="busy" x="150.0" y="100" width="40.0" height="10" rx="2"/>
  <rect class="busy" x="150.0" y="114" width="40.0" height="10" rx="2"/>
  <rect class="busy" x="150.0" y="128" width="40.0" height="10" rx="2"/>
  <text class="c" x="200" y="117">done after 25 ms</text>
  <text class="tb" x="20" y="196">limits.cpu: 200m</text>
  <text class="d" x="20" y="212">20 ms of CPU</text>
  <text class="d" x="20" y="226">per 100 ms period</text>
  <rect class="busy" x="150.0" y="186" width="8.0" height="10" rx="2"/>
  <rect class="busy" x="310.0" y="186" width="8.0" height="10" rx="2"/>
  <rect class="busy" x="470.0" y="186" width="8.0" height="10" rx="2"/>
  <rect class="busy" x="630.0" y="186" width="4.8" height="10" rx="2"/>
  <rect class="busy" x="150.0" y="200" width="8.0" height="10" rx="2"/>
  <rect class="busy" x="310.0" y="200" width="8.0" height="10" rx="2"/>
  <rect class="busy" x="470.0" y="200" width="8.0" height="10" rx="2"/>
  <rect class="busy" x="630.0" y="200" width="4.8" height="10" rx="2"/>
  <rect class="busy" x="150.0" y="214" width="8.0" height="10" rx="2"/>
  <rect class="busy" x="310.0" y="214" width="8.0" height="10" rx="2"/>
  <rect class="busy" x="470.0" y="214" width="8.0" height="10" rx="2"/>
  <rect class="busy" x="630.0" y="214" width="4.8" height="10" rx="2"/>
  <rect class="busy" x="150.0" y="228" width="8.0" height="10" rx="2"/>
  <rect class="busy" x="310.0" y="228" width="8.0" height="10" rx="2"/>
  <rect class="busy" x="470.0" y="228" width="8.0" height="10" rx="2"/>
  <rect class="busy" x="630.0" y="228" width="4.8" height="10" rx="2"/>
  <rect class="thr" x="158.0" y="186" width="152.0" height="10" rx="2"/>
  <rect class="thr" x="318.0" y="186" width="152.0" height="10" rx="2"/>
  <rect class="thr" x="478.0" y="186" width="152.0" height="10" rx="2"/>
  <rect class="thr" x="158.0" y="200" width="152.0" height="10" rx="2"/>
  <rect class="thr" x="318.0" y="200" width="152.0" height="10" rx="2"/>
  <rect class="thr" x="478.0" y="200" width="152.0" height="10" rx="2"/>
  <rect class="thr" x="158.0" y="214" width="152.0" height="10" rx="2"/>
  <rect class="thr" x="318.0" y="214" width="152.0" height="10" rx="2"/>
  <rect class="thr" x="478.0" y="214" width="152.0" height="10" rx="2"/>
  <rect class="thr" x="158.0" y="228" width="152.0" height="10" rx="2"/>
  <rect class="thr" x="318.0" y="228" width="152.0" height="10" rx="2"/>
  <rect class="thr" x="478.0" y="228" width="152.0" height="10" rx="2"/>
  <text class="c" x="645" y="217">done ≈ 300 ms</text>
  <text class="d" x="645" y="233">(measured 200–306 ms)</text>
  <path class="dash" d="M158.0,180 L158.0,170 L233.2,170"/>
  <text class="d" x="236" y="174">quota used up after 5 ms on 4 cores: the cgroup waits for the next period</text>
  <rect class="busy" x="20" y="312" width="16" height="10" rx="2"/>
  <text class="d" x="42" y="321">running</text>
  <rect class="thr" x="110" y="312" width="16" height="10" rx="2"/>
  <text class="d" x="132" y="321">throttled</text>
  <text class="d" x="20" y="346">Measured on k3s v1.34.1: one burst per second, so the pod averages about 100m, half its limit. The delay only shows</text>
  <text class="d" x="20" y="362">in the latency and in the nr_throttled counter of cpu.stat, not in an average CPU graph.</text>
</svg>
