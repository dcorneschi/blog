  <title id="t">Docker Compose 2.x vs 5.x</title>
  <desc id="d">Docker Compose 2.x vs 5.x: Why there is no 3 or 4, and what changed. v2.40.3, v5.2.0, v5.6.1, Bake, COMPOSE_BAKE, start --wait, --dry-run, reconciliation. Small drawings: v2.40.3, v5.0.0 and v5.6.1 pills, a terminal with docker compose version --short and docker compose start --wait, and icons for Bake, --wait and reconciliation.</desc>
