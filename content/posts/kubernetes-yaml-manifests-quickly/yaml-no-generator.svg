<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Starting points for kinds without a generator</title>
  <desc id="d">Three ways to start a StatefulSet, DaemonSet, PVC or NetworkPolicy: convert a generated Deployment by changing kind and removing replicas and strategy, adding serviceName for a StatefulSet; copy an existing object and strip uid, resourceVersion, status and the last-applied annotation with jq; or start from a short template for PVC and NetworkPolicy. Validate each with a server-side dry run.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .d   { font-size: 11px; fill: #495057; }
      .c   { font-size: 11px; fill: #212529; }
      .m   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; }
      .mb  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; font-weight: 700; fill: #212529; }
      .ms  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #495057; }
      .lne { stroke: #495057; stroke-width: 1.4; fill: none; marker-end: url(#a); }
      .lnb { stroke: #1c7ed6; stroke-width: 1.4; fill: none; marker-end: url(#ab); }
      .dash{ stroke: #868e96; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
      .area{ fill: #f8f9fa; stroke: #ced4da; stroke-dasharray: 5 4; }
      .r   { fill: #e7f1ff; stroke: #6ea8fe; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .w   { fill: #ffe5cc; stroke: #fd9843; }
      .rw  { fill: #f3effc; stroke: #a98eda; }
      .x   { fill: #f8d7da; stroke: #e35d6a; }
      .n   { fill: #f8f9fa; stroke: #dee2e6; }
      .s   { fill: #ffffff; stroke: #adb5bd; }
      .num { fill: #495057; }
      .numt{ font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .ok  { font-size: 11px; font-weight: 700; fill: #2b8a3e; }
      .bad { font-size: 11px; font-weight: 700; fill: #c92a2a; }
    </style>
  </defs>
  <rect width="840" height="290" fill="#ffffff"/>
  <text class="h" x="20" y="28">Kinds without a generator</text>
  <text class="sub" x="20" y="48">StatefulSet, DaemonSet, PVC, NetworkPolicy, StorageClass: three ways to start, one way to check</text>
  <rect class="r" x="20" y="70" width="252" height="40" rx="6"/>
  <text class="tb" x="32" y="90">Convert a Deployment</text>
  <rect class="s" x="20" y="118" width="252" height="92" rx="6"/>
  <text class="c" x="32" y="138">kind: DaemonSet or StatefulSet</text>
  <text class="c" x="32" y="154">delete replicas (DS), strategy</text>
  <text class="c" x="32" y="170">add serviceName (STS)</text>
  <text class="c" x="32" y="186">otherwise: unknown field</text>
  <path class="lne" d="M146,210 L146,234"/>
  <rect class="g" x="294" y="70" width="252" height="40" rx="6"/>
  <text class="tb" x="306" y="90">Copy an existing object</text>
  <rect class="s" x="294" y="118" width="252" height="92" rx="6"/>
  <text class="c" x="306" y="138">kubectl get -o json | jq del(...)</text>
  <text class="c" x="306" y="154">uid, resourceVersion, status,</text>
  <text class="c" x="306" y="170">last-applied annotation</text>
  <text class="c" x="306" y="186">72 -&gt; 45 lines, defaults stay</text>
  <path class="lne" d="M420,210 L420,234"/>
  <rect class="rw" x="568" y="70" width="252" height="40" rx="6"/>
  <text class="tb" x="580" y="90">Short template</text>
  <rect class="s" x="568" y="118" width="252" height="92" rx="6"/>
  <text class="c" x="580" y="138">PVC: accessModes + storage</text>
  <text class="c" x="580" y="154">NetworkPolicy: podSelector,</text>
  <text class="c" x="580" y="170">policyTypes, ingress.from</text>
  <text class="c" x="580" y="186">from the docs or this post</text>
  <path class="lne" d="M694,210 L694,234"/>
  <rect class="w" x="20" y="236" width="800" height="40" rx="6"/>
  <text class="mb" x="32" y="256">kubectl apply -f &lt;file&gt; --dry-run=server   (all five starters passed)</text>
</svg>
