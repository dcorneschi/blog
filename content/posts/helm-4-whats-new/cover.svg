<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What's New in Helm 4</title>
  <desc id="d">What's New in Helm 4: Server-side apply, Wasm plugins and renamed flags. --rollback-on-failure, --force-replace, --server-side, OCI digest, registry login, Helm 4.3.1. Small drawings: 3.22.1 to 4.3.1; a terminal running helm version --short and helm upgrade --rollback-on-failure; a Helm wheel with a 4 badge; icons for server-side apply, plugins, digest, kstatus, registry login, post-renderer and rollback.</desc>
