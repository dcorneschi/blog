  <text class="d" x="32" y="284">one AZ, one network segment</text><text class="d" x="32" y="300">fastest between instances</text>
  <text class="d" x="237" y="284">partitions never share racks</text><text class="d" x="237" y="300">up to 7 per AZ</text>
  <text class="d" x="442" y="284">one instance per rack</text><text class="d" x="442" y="300">up to 7 running per AZ</text>
  <text class="d" x="647" y="284">hardware with precise clocks</text><text class="d" x="647" y="300">PHC, hardware timestamps</text>
  <text class="d" x="20" y="336">Blue dashed: the high-bisection network segment. P1 to P3: partitions (a partition can own several racks, like P1 here).</text>
  <text class="d" x="20" y="354">Cluster trades fault isolation for speed; partition and spread trade capacity for isolation. No group gives both.</text>
  <text class="d" x="20" y="372">A precision time group can be the parent of a cluster group, so a cluster also lands on precision-time hardware.</text>
</svg>
