<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">EC2 placement group strategies</title>
  <desc id="d">Four Availability Zones side by side, each with four racks. Cluster: all instances packed into two neighbouring racks inside one network segment, for the lowest latency and the highest throughput, in one Availability Zone only. Partition: three partitions, each on its own racks, so partitions never share a rack; up to seven partitions per Availability Zone. Spread: one instance per rack, at most seven running instances per Availability Zone. Precision time: instances on hardware with a high-precision time source, for microsecond-accurate clocks.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .ms  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #495057; }
      .d   { font-size: 11px; fill: #495057; }
      .lne { stroke: #495057; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .az  { fill: #f8f9fa; stroke: #dee2e6; }
      .rk  { fill: #ffffff; stroke: #adb5bd; }
      .seg { fill: none; stroke: #6ea8fe; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .i1  { fill: #6ea8fe; }
      .i2  { fill: #75b798; }
      .i3  { fill: #fd9843; }
      .i4  { fill: #a98eda; }
      .bad { fill: #fdecee; stroke: #dc3545; }
      .ok  { fill: #e8f5ee; stroke: #75b798; }
      .blu { fill: #e7f1ff; stroke: #6ea8fe; }
      .q   { fill: #f8f9fa; stroke: #adb5bd; }
      .x   { stroke: #dc3545; stroke-width: 2.4; }
    </style>
  </defs>
  <rect width="840" height="400" fill="#ffffff"/>

  <text class="h" x="20" y="28">EC2 placement group strategies</text>
  <text class="sub" x="20" y="48">Same Availability Zone, four racks each: where EC2 puts the instances</text>

