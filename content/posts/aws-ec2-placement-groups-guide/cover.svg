<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">EC2 Placement Groups</title>
  <desc id="d">EC2 placement groups: cluster, partition, spread and precision time. Small drawings: CLUSTER, PARTITION and SPREAD pills; a terminal running aws ec2 create-placement-group and aws ec2 run-instances; four server racks with instances packed in two of them; icons for low latency, rack isolation and the seven-per-AZ limit; small icons for cluster, partition, spread, precision time, capacity, EFA and the CLI.</desc>
  <defs>
    <style>
      .bg  { fill: #f8f9fa; }
      .a   { fill: #7048e8; }
      .al  { stroke: #7048e8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ink { fill: #343a40; }
      .h   { font-weight: 700; fill: #212529; letter-spacing: -2px; }
      .s   { fill: #495057; }
      .n   { fill: #868e96; }
      .r   { stroke: #dee2e6; stroke-width: 2; }
      .rk  { fill: #ffffff; stroke: #7048e8; stroke-width: 10; }
      .slot{ fill: #dee2e6; }
      .pb  { fill: #e7f1ff; stroke: #6ea8fe; stroke-width: 5; }
      .pg  { fill: #e8f5ee; stroke: #75b798; stroke-width: 5; }
      .pw  { fill: #fff3e0; stroke: #fd9843; stroke-width: 5; }
      .term{ fill: #212529; }
      .tbar{ fill: #343a40; }
      .tx  { fill: #e9ecef; }
      .mono{ font-family: Menlo, Consolas, 'Liberation Mono', monospace; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #161b22; }
        .ink { fill: #c9d1d9; }
        .h   { fill: #f0f6fc; }
        .s   { fill: #c9d1d9; }
        .n   { fill: #8b949e; }
        .r   { stroke: #30363d; }
        .rk  { fill: #0d1117; }
        .slot{ fill: #30363d; }
        .pb  { fill: #0c1d33; stroke: #4a78b8; }
        .pg  { fill: #10241a; stroke: #4f8f6f; }
        .pw  { fill: #2a1e0c; stroke: #b9701f; }
        .term{ fill: #0d1117; stroke: #30363d; stroke-width: 4; }
        .tbar{ fill: #21262d; }
      }
    </style>
  </defs>
  <rect class="bg" width="2752" height="1536"/>

  <!-- top left: strategies and terminal -->
  <g class="mono" font-size="28" font-weight="700" text-anchor="middle">
    <rect class="pb" x="131" y="198" width="200" height="66" rx="33"/><text class="ink" x="231" y="241">CLUSTER</text>
    <rect class="pg" x="351" y="198" width="240" height="66" rx="33"/><text class="ink" x="471" y="241">PARTITION</text>
    <rect class="pw" x="611" y="198" width="190" height="66" rx="33"/><text class="ink" x="706" y="241">SPREAD</text>
  </g>
  <text class="n mono" x="466" y="318" text-anchor="middle" font-size="30">speed · racks · isolation</text>
  <rect class="term" x="131" y="400" width="610" height="190" rx="20"/>
  <rect class="tbar" x="131" y="400" width="610" height="50" rx="20"/>
  <rect class="tbar" x="131" y="430" width="610" height="20"/>
  <circle cx="171" cy="425" r="11" fill="#ff5f57"/><circle cx="211" cy="425" r="11" fill="#febc2e"/><circle cx="251" cy="425" r="11" fill="#28c840"/>
  <text class="tx mono" x="163" y="505" font-size="28">$ aws ec2 create-placement-group</text>
  <text class="tx mono" x="163" y="558" font-size="28">$ aws ec2 run-instances<tspan class="a">█</tspan></text>

  <!-- center: four racks, two of them packed -->
  <g transform="translate(1110,0)">
    <rect class="rk" x="20" y="200" width="110" height="380" rx="10"/>
    <rect class="rk" x="160" y="200" width="110" height="380" rx="10"/>
    <rect class="rk" x="300" y="200" width="110" height="380" rx="10"/>
    <rect class="rk" x="440" y="200" width="110" height="380" rx="10"/>
    <g class="a">
      <rect x="40" y="225" width="70" height="34" rx="5"/><rect x="40" y="275" width="70" height="34" rx="5"/><rect x="40" y="325" width="70" height="34" rx="5"/><rect x="40" y="375" width="70" height="34" rx="5"/><rect x="40" y="425" width="70" height="34" rx="5"/><rect x="40" y="475" width="70" height="34" rx="5"/>
      <rect x="180" y="225" width="70" height="34" rx="5"/><rect x="180" y="275" width="70" height="34" rx="5"/><rect x="180" y="325" width="70" height="34" rx="5"/><rect x="180" y="375" width="70" height="34" rx="5"/><rect x="180" y="425" width="70" height="34" rx="5"/><rect x="180" y="475" width="70" height="34" rx="5"/>
    </g>
    <g class="slot">
      <rect x="320" y="225" width="70" height="34" rx="5"/><rect x="320" y="275" width="70" height="34" rx="5"/><rect x="320" y="325" width="70" height="34" rx="5"/><rect x="320" y="375" width="70" height="34" rx="5"/><rect x="320" y="425" width="70" height="34" rx="5"/><rect x="320" y="475" width="70" height="34" rx="5"/>
      <rect x="460" y="225" width="70" height="34" rx="5"/><rect x="460" y="275" width="70" height="34" rx="5"/><rect x="460" y="325" width="70" height="34" rx="5"/><rect x="460" y="375" width="70" height="34" rx="5"/><rect x="460" y="425" width="70" height="34" rx="5"/><rect x="460" y="475" width="70" height="34" rx="5"/>
    </g>
    <path class="al" stroke-width="8" stroke-dasharray="20 14" d="M8,190 H282 V600 H8 Z"/>
    <text class="n mono" x="285" y="660" text-anchor="middle" font-size="32">one AZ, one segment</text>
  </g>

  <!-- top right: three feature icons -->
  <g transform="translate(1855,190) scale(1.15)">
    <path class="a" d="M112,22 L52,112 H96 L84,178 L148,82 H104 Z"/>
  </g>
  <text class="n" x="1970" y="470" text-anchor="middle" font-size="32">low latency</text>
  <g transform="translate(2105,190) scale(1.15)">
    <rect class="al" stroke-width="12" x="30" y="30" width="60" height="140" rx="8"/>
    <rect class="al" stroke-width="12" x="110" y="30" width="60" height="140" rx="8"/>
    <path class="al" stroke-width="10" d="M100,20 V180" stroke-dasharray="14 12"/>
  </g>
  <text class="n" x="2220" y="470" text-anchor="middle" font-size="32">rack isolation</text>
  <g transform="translate(2355,190) scale(1.15)">
    <circle class="al" stroke-width="14" cx="100" cy="100" r="72"/>
    <text class="a mono" x="100" y="128" text-anchor="middle" font-size="84" font-weight="700">7</text>
  </g>
  <text class="n" x="2470" y="470" text-anchor="middle" font-size="32">7 per AZ</text>

  <text class="h" x="1376" y="880" text-anchor="middle" font-size="140">EC2 Placement Groups</text>
  <text class="s" x="1376" y="1030" text-anchor="middle" font-size="88">Cluster, partition, spread and precision time</text>
  <line class="r" x1="776" y1="1105" x2="1976" y2="1105"/>
  <text class="n" x="1376" y="1210" text-anchor="middle" font-size="47">capacity · EFA · rack awareness · Terraform · CLI 2.39.3</text>

  <!-- bottom row: small icons -->
  <g transform="translate(546,1290) scale(0.5)"><rect class="a" x="40" y="50" width="50" height="40" rx="6"/><rect class="a" x="110" y="50" width="50" height="40" rx="6"/><rect class="a" x="40" y="110" width="50" height="40" rx="6"/><rect class="a" x="110" y="110" width="50" height="40" rx="6"/></g>
  <text class="n" x="596" y="1450" text-anchor="middle" font-size="34">cluster</text>
  <g transform="translate(806,1290) scale(0.5)"><rect class="al" stroke-width="12" x="20" y="40" width="45" height="120" rx="6"/><rect class="al" stroke-width="12" x="78" y="40" width="45" height="120" rx="6"/><rect class="a" x="136" y="40" width="45" height="120" rx="6"/></g>
  <text class="n" x="856" y="1450" text-anchor="middle" font-size="34">partition</text>
  <g transform="translate(1066,1290) scale(0.5)"><circle class="a" cx="40" cy="100" r="18"/><circle class="a" cx="100" cy="100" r="18"/><circle class="a" cx="160" cy="100" r="18"/><path class="al" stroke-width="8" d="M70,50 V150 M130,50 V150" stroke-dasharray="10 10"/></g>
  <text class="n" x="1116" y="1450" text-anchor="middle" font-size="34">spread</text>
  <g transform="translate(1326,1290) scale(0.5)"><circle class="al" stroke-width="14" cx="100" cy="100" r="70"/><path class="al" stroke-width="12" d="M100,100 V56 M100,100 L130,118"/></g>
  <text class="n" x="1376" y="1450" text-anchor="middle" font-size="34">precision time</text>
  <g transform="translate(1586,1290) scale(0.5)"><rect class="al" stroke-width="14" x="30" y="40" width="140" height="120" rx="12"/><path class="al" stroke-width="12" d="M60,100 L90,128 L142,72"/></g>
  <text class="n" x="1636" y="1450" text-anchor="middle" font-size="34">capacity</text>
  <g transform="translate(1846,1290) scale(0.5)"><path class="al" stroke-width="14" d="M20,100 H180 M60,60 L20,100 L60,140 M140,60 L180,100 L140,140"/></g>
  <text class="n" x="1896" y="1450" text-anchor="middle" font-size="34">EFA</text>
  <g transform="translate(2106,1290) scale(0.5)"><path class="al" stroke-width="18" d="M40,60 L90,100 L40,140 M110,150 H170"/></g>
  <text class="n" x="2156" y="1450" text-anchor="middle" font-size="34">CLI</text>
</svg>
