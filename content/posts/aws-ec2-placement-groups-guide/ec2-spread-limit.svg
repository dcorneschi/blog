<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The spread group limit</title>
  <desc id="d">A rack-level spread placement group across three Availability Zones. Each zone holds at most seven running instances, one per rack, so 21 in total. An eighth instance started in a zone that already has seven does not launch. For more instances use a second spread group: it spreads its own instances over racks, but does not guarantee they avoid the racks of the first group.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .ms  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #495057; }
      .d   { font-size: 11px; fill: #495057; }
      .lne { stroke: #495057; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .az  { fill: #f8f9fa; stroke: #dee2e6; }
      .rk  { fill: #ffffff; stroke: #adb5bd; }
      .seg { fill: none; stroke: #6ea8fe; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .i1  { fill: #6ea8fe; }
      .i2  { fill: #75b798; }
      .i3  { fill: #fd9843; }
      .i4  { fill: #a98eda; }
      .bad { fill: #fdecee; stroke: #dc3545; }
      .ok  { fill: #e8f5ee; stroke: #75b798; }
      .blu { fill: #e7f1ff; stroke: #6ea8fe; }
      .q   { fill: #f8f9fa; stroke: #adb5bd; }
      .x   { stroke: #dc3545; stroke-width: 2.4; }
    </style>
  </defs>
  <rect width="840" height="350" fill="#ffffff"/>

  <text class="h" x="20" y="28">The spread group limit</text>
  <text class="sub" x="20" y="48">Rack-level spread: one instance per rack, at most 7 running instances in each AZ</text>

  <rect class="az" x="20" y="64" width="250" height="170" rx="8"/><text class="lb" x="32" y="84">EU-WEST-1A: 7 OF 7</text>
  <rect class="rk" x="33" y="96" width="26" height="110" rx="3"/><rect class="i2" x="37" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="66" y="96" width="26" height="110" rx="3"/><rect class="i2" x="70" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="99" y="96" width="26" height="110" rx="3"/><rect class="i2" x="103" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="132" y="96" width="26" height="110" rx="3"/><rect class="i2" x="136" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="165" y="96" width="26" height="110" rx="3"/><rect class="i2" x="169" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="198" y="96" width="26" height="110" rx="3"/><rect class="i2" x="202" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="231" y="96" width="26" height="110" rx="3"/><rect class="i2" x="235" y="104" width="18" height="14" rx="2"/>
  <text class="d" x="32" y="226">7 racks, 7 instances</text>
  <rect class="az" x="295" y="64" width="250" height="170" rx="8"/><text class="lb" x="307" y="84">EU-WEST-1B: 7 OF 7</text>
  <rect class="rk" x="308" y="96" width="26" height="110" rx="3"/><rect class="i2" x="312" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="341" y="96" width="26" height="110" rx="3"/><rect class="i2" x="345" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="374" y="96" width="26" height="110" rx="3"/><rect class="i2" x="378" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="407" y="96" width="26" height="110" rx="3"/><rect class="i2" x="411" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="440" y="96" width="26" height="110" rx="3"/><rect class="i2" x="444" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="473" y="96" width="26" height="110" rx="3"/><rect class="i2" x="477" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="506" y="96" width="26" height="110" rx="3"/><rect class="i2" x="510" y="104" width="18" height="14" rx="2"/>
  <text class="d" x="307" y="226">7 racks, 7 instances</text>
  <rect class="az" x="570" y="64" width="250" height="170" rx="8"/><text class="lb" x="582" y="84">EU-WEST-1C: 7 OF 7</text>
  <rect class="rk" x="583" y="96" width="26" height="110" rx="3"/><rect class="i2" x="587" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="616" y="96" width="26" height="110" rx="3"/><rect class="i2" x="620" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="649" y="96" width="26" height="110" rx="3"/><rect class="i2" x="653" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="682" y="96" width="26" height="110" rx="3"/><rect class="i2" x="686" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="715" y="96" width="26" height="110" rx="3"/><rect class="i2" x="719" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="748" y="96" width="26" height="110" rx="3"/><rect class="i2" x="752" y="104" width="18" height="14" rx="2"/>
  <rect class="rk" x="781" y="96" width="26" height="110" rx="3"/><rect class="i2" x="785" y="104" width="18" height="14" rx="2"/>
  <text class="d" x="582" y="226">7 racks, 7 instances</text>
  <rect class="bad" x="20" y="250" width="250" height="40" rx="6"/><text class="tb" x="32" y="268">8th instance in eu-west-1a</text><text class="d" x="32" y="283">does not launch</text>
  <path class="lne" d="M145,250 L145,236"/>
  <rect class="blu" x="295" y="250" width="525" height="40" rx="6"/><text class="tb" x="307" y="268">Need more? A second spread group</text><text class="d" x="307" y="283">spread inside itself, but it may share racks with the first group</text>
  <text class="d" x="20" y="316">3 AZs × 7 = 21 instances per group. The limit counts running instances: starting an 8th in a full AZ fails too.</text>
  <text class="d" x="20" y="334">Rack-level spread works in Regions and on Outposts; host-level spread only on Outposts.</text>
</svg>
