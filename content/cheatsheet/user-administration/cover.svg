  <title id="t">Linux User Administration</title>
  <desc id="d">Linux User Administration: Users, groups and passwords on RHEL and Ubuntu. useradd, usermod, passwd, chage, login.defs, faillock, sudoers, UID ranges. Small drawings: useradd, usermod, userdel; a terminal running groupadd -r &lt;group&gt; and usermod -u 1006 jsmith; users, passwords, sudo; icons for useradd, groups, passwd, chage, login.defs, faillock, sudoers.</desc>
