<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Helm Cheatsheet</title>
  <desc id="d">Helm Cheatsheet: The Kubernetes package manager. install, upgrade, rollback, values, repositories, OCI registries, plugins, hooks. Small drawings: install, upgrade, rollback; a terminal running helm version and helm list -A; chart, values.yaml, rollback; icons for charts, values, upgrade, rollback, repositories, OCI, hooks.</desc>
  <defs>
    <style>
      .bg  { fill: #f8f9fa; }
