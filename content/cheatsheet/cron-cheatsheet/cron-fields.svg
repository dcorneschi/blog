  <text class="c" x="20" y="196">Day of month (1-7) and day of week (1 = Monday) are both restricted, so cron runs when EITHER matches.</text>
  <text class="lb" x="20" y="230">0 8 1-7 * 1 — NOVEMBER 2026</text>
