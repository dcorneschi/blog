<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 514" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The five fields and the OR rule</title>
  <desc id="d">A cron line has five fields: minute, hour, day of month, month and day of week, then the command. When both day of month and day of week are restricted, cron runs if either matches: 0 8 1-7 * 1 runs on November 1 to 7 and on every Monday (9, 16, 23, 30). Restricting only the days 1-7 and testing date +%u in the command runs only on the first Monday, November 2.</desc>
