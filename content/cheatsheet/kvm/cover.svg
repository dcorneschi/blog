<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">KVM / virsh Cheatsheet</title>
  <desc id="d">KVM / virsh Cheatsheet: Virtual machines with libvirt. virsh, virt-install, snapshots, cloning, networks, storage pools, migration, libguestfs. Small drawings: shut off, running, paused; a terminal running virt-host-validate qemu and ls -l /dev/kvm; host, networks, storage pools; icons for virsh, virt-install, snapshots, cloning, networks, storage pools, migration.</desc>
