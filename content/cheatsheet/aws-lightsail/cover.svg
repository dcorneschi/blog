<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AWS Lightsail Cheatsheet</title>
  <desc id="d">AWS Lightsail Cheatsheet: Simple cloud servers from the AWS CLI. instances, static IPs, firewall, snapshots, databases, load balancers, containers, buckets. Small drawings: pending, running, stopped; a terminal running aws lightsail get-instances and chmod 600 lightsail-key.pem; instance, static IP, firewall; icons for instances, static IPs, firewall, snapshots, databases, load balancers, buckets.</desc>
