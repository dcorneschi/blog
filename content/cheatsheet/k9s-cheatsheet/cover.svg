  <title id="t">k9s Cheatsheet</title>
  <desc id="d">k9s Cheatsheet: The Kubernetes terminal UI, key by key. pods, logs, filters, namespaces, xray, pulse, port-forward, skins, hotkeys, aliases. Small drawings: :pod, l, logs; a terminal running k9s -c pod and k9s --readonly; pods, logs, xray; icons for :pod, logs, filters, xray, pulse, port-forward, skins.</desc>
