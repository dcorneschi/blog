<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Docker Cheatsheet</title>
  <desc id="d">Docker Cheatsheet: containers, images, volumes and networks. Small drawings of the container lifecycle, a terminal running docker run, image layers, a volume and a network, and icons for containers, images, volumes, networks, cleanup, security and debugging.</desc>
