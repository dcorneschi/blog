<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 476" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">docker stop vs docker kill</title>
  <desc id="d">docker stop sends the image's stop signal (SIGTERM unless the image sets STOPSIGNAL, nginx uses SIGQUIT), waits 10 seconds or the -t value, then sends SIGKILL. nginx and a process that handles SIGTERM exit with 0 right away; sleep behind --init exits with 143; a PID 1 sleep ignores SIGTERM and is killed after 10 s (or 3 s with -t 3) with exit code 137; docker kill sends SIGKILL at once, exit code 137.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc3545"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .m   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; }
      .mb  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; font-weight: 700; fill: #212529; }
      .ms  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #495057; }
      .d   { font-size: 11px; fill: #495057; }
      .c   { font-size: 11px; fill: #212529; }
      .ax  { font-size: 10.5px; fill: #495057; text-anchor: middle; }
      .lne { stroke: #495057; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .lnx { stroke: #dc3545; stroke-width: 1.6; fill: none; stroke-dasharray: 5 3; marker-end: url(#ax); }
      .dash{ stroke: #868e96; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .tick{ stroke: #dee2e6; stroke-width: 1; }
      .r   { fill: #e7f1ff; stroke: #6ea8fe; }
      .w   { fill: #ffe5cc; stroke: #fd9843; }
      .rw  { fill: #f3effc; stroke: #a98eda; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .x   { fill: #f8d7da; stroke: #e35d6a; }
      .n   { fill: #f8f9fa; stroke: #dee2e6; }
      .s   { fill: #ffffff; stroke: #adb5bd; }
      .sd  { fill: #ffffff; stroke: #adb5bd; stroke-dasharray: 4 3; }
      .bar { fill: #cfe2ff; }
      .kil { fill: #dc3545; }
      .sig { fill: #495057; }
    </style>
  </defs>
  <rect width="840" height="476" fill="#ffffff"/>
  <text class="h" x="20" y="28">docker stop vs docker kill</text>
  <text class="sub" x="20" y="48">Signal sent and time until the container exits (Docker 29.9.2)</text>
  <text class="lb" x="734" y="80">RESULT</text>
  <line class="tick" x1="330.0" y1="80" x2="330.0" y2="386"/>
  <text class="ax" x="330.0" y="400">0 s</text>
  <line class="tick" x1="367.0" y1="80" x2="367.0" y2="386"/>
  <text class="ax" x="367.0" y="400">1 s</text>
  <line class="tick" x1="404.0" y1="80" x2="404.0" y2="386"/>
  <text class="ax" x="404.0" y="400">2 s</text>
  <line class="tick" x1="441.0" y1="80" x2="441.0" y2="386"/>
  <text class="ax" x="441.0" y="400">3 s</text>
  <line class="tick" x1="478.0" y1="80" x2="478.0" y2="386"/>
  <text class="ax" x="478.0" y="400">4 s</text>
  <line class="tick" x1="515.0" y1="80" x2="515.0" y2="386"/>
  <text class="ax" x="515.0" y="400">5 s</text>
  <line class="tick" x1="552.0" y1="80" x2="552.0" y2="386"/>
  <text class="ax" x="552.0" y="400">6 s</text>
  <line class="tick" x1="589.0" y1="80" x2="589.0" y2="386"/>
  <text class="ax" x="589.0" y="400">7 s</text>
  <line class="tick" x1="626.0" y1="80" x2="626.0" y2="386"/>
  <text class="ax" x="626.0" y="400">8 s</text>
  <line class="tick" x1="663.0" y1="80" x2="663.0" y2="386"/>
  <text class="ax" x="663.0" y="400">9 s</text>
  <line class="tick" x1="700.0" y1="80" x2="700.0" y2="386"/>
  <text class="ax" x="700.0" y="400">10 s</text>
  <text class="mb" x="20" y="108">docker stop web</text>
  <text class="d" x="20" y="123">nginx: the image sets STOPSIGNAL SIGQUIT</text>
  <rect class="bar" x="330" y="104" width="3.0" height="12" rx="2"/>
  <path class="sig" d="M325.0,94 L335.0,94 L330.0,103 z"/>
  <text class="ms" x="338.0" y="101">SIGQUIT</text>
  <rect class="g" x="734.0" y="101" width="72" height="18" rx="9"/>
  <text class="m" x="770.0" y="114" text-anchor="middle">exit 0</text>
  <text class="mb" x="20" y="158">docker stop app</text>
  <text class="d" x="20" y="173">handles SIGTERM, exits after its cleanup</text>
  <rect class="bar" x="330" y="154" width="37.0" height="12" rx="2"/>
  <path class="sig" d="M325.0,144 L335.0,144 L330.0,153 z"/>
  <text class="ms" x="338.0" y="151">SIGTERM</text>
  <rect class="g" x="734.0" y="151" width="72" height="18" rx="9"/>
  <text class="m" x="770.0" y="164" text-anchor="middle">exit 0</text>
  <text class="mb" x="20" y="208">docker stop app  (--init)</text>
  <text class="d" x="20" y="223">sleep behind tini, which forwards SIGTERM</text>
  <rect class="bar" x="330" y="204" width="3.0" height="12" rx="2"/>
  <path class="sig" d="M325.0,194 L335.0,194 L330.0,203 z"/>
  <text class="ms" x="338.0" y="201">SIGTERM</text>
  <rect class="w" x="734.0" y="201" width="72" height="18" rx="9"/>
  <text class="m" x="770.0" y="214" text-anchor="middle">exit 143</text>
  <text class="mb" x="20" y="258">docker stop app</text>
  <text class="d" x="20" y="273">PID 1 sleep: no handler, SIGTERM is ignored</text>
  <rect class="bar" x="330" y="254" width="370.0" height="12" rx="2"/>
  <path class="sig" d="M325.0,244 L335.0,244 L330.0,253 z"/>
  <text class="ms" x="338.0" y="251">SIGTERM</text>
  <path class="kil" d="M695.0,244 L705.0,244 L700.0,253 z"/>
  <text class="ms" x="692.0" y="251" text-anchor="end">SIGKILL</text>
  <rect class="x" x="734.0" y="251" width="72" height="18" rx="9"/>
  <text class="m" x="770.0" y="264" text-anchor="middle">exit 137</text>
  <text class="mb" x="20" y="308">docker stop -t 3 app</text>
  <text class="d" x="20" y="323">same, shorter grace period</text>
  <rect class="bar" x="330" y="304" width="111.0" height="12" rx="2"/>
  <path class="sig" d="M325.0,294 L335.0,294 L330.0,303 z"/>
  <text class="ms" x="338.0" y="301">SIGTERM</text>
  <path class="kil" d="M436.0,294 L446.0,294 L441.0,303 z"/>
  <text class="ms" x="449.0" y="301">SIGKILL</text>
  <rect class="x" x="734.0" y="301" width="72" height="18" rx="9"/>
  <text class="m" x="770.0" y="314" text-anchor="middle">exit 137</text>
  <text class="mb" x="20" y="358">docker kill app</text>
  <text class="d" x="20" y="373">no grace period</text>
  <rect class="bar" x="330" y="354" width="3.0" height="12" rx="2"/>
  <path class="kil" d="M325.0,344 L335.0,344 L330.0,353 z"/>
  <text class="ms" x="338.0" y="351">SIGKILL</text>
  <rect class="x" x="734.0" y="351" width="72" height="18" rx="9"/>
  <text class="m" x="770.0" y="364" text-anchor="middle">exit 137</text>
  <rect class="n" x="20" y="416" width="800" height="48" rx="4"/>
  <text class="c" x="32" y="435">PID 1 in a container gets no default signal handlers, so a plain sleep never reacts to SIGTERM and docker stop waits the full 10 s.</text>
  <text class="c" x="32" y="452">Exit codes: 137 = 128 + 9 (SIGKILL), 143 = 128 + 15 (SIGTERM). The light bar is the time the container keeps running.</text>
</svg>
