<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AWS EBS Cheatsheet</title>
  <desc id="d">AWS EBS Cheatsheet: Block storage for EC2 from the AWS CLI. gp3, io2, resize, snapshots, DLM, snapshot lock, encryption, Multi-Attach. Small drawings: modifying, optimizing, completed; a terminal running aws ec2 create-volume and create-snapshot; a stack of volumes with a snapshot badge; icons for volumes, resize, snapshots, DLM, lock, encryption and Multi-Attach.</desc>
  <defs>
    <style>
      .bg  { fill: #f8f9fa; }
      .a   { fill: #f59f00; }
      .a2  { fill: #232f3e; }
      .al  { stroke: #f59f00; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ink { fill: #343a40; }
      .wt  { fill: #ffffff; }
      .h   { font-weight: 700; fill: #212529; letter-spacing: -2px; }
      .s   { fill: #495057; }
      .n   { fill: #868e96; }
      .r   { stroke: #dee2e6; stroke-width: 2; }
      .pn  { fill: #ffffff; stroke: #adb5bd; stroke-width: 5; }
      .pv  { fill: #f3effc; stroke: #a98eda; stroke-width: 5; }
      .pg  { fill: #e8f5ee; stroke: #75b798; stroke-width: 5; }
      .term{ fill: #212529; }
      .tbar{ fill: #343a40; }
      .tx  { fill: #e9ecef; }
      .mono{ font-family: Menlo, Consolas, 'Liberation Mono', monospace; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #161b22; }
        .a2  { fill: #8b949e; }
        .ink { fill: #c9d1d9; }
        .h   { fill: #f0f6fc; }
        .s   { fill: #c9d1d9; }
        .n   { fill: #8b949e; }
        .r   { stroke: #30363d; }
        .pn  { fill: #0d1117; stroke: #484f58; }
        .pv  { fill: #1f1830; stroke: #7d63b0; }
        .pg  { fill: #0f2a1d; stroke: #3d8b63; }
        .term{ fill: #0d1117; stroke: #30363d; stroke-width: 4; }
        .tbar{ fill: #21262d; }
      }
    </style>
  </defs>
  <rect class="bg" width="2752" height="1536"/>

  <!-- top left: modification states and terminal -->
  <g class="mono" font-size="34" font-weight="700" text-anchor="middle">
    <rect class="pv" x="131" y="194" width="230" height="74" rx="37"/><text class="ink" x="246" y="243">modifying</text>
    <path class="al" stroke-width="7" d="M369,231 H405 M389,217 L405,231 L389,245"/>
    <rect class="pn" x="413" y="194" width="240" height="74" rx="37"/><text class="ink" x="533" y="243">optimizing</text>
    <path class="al" stroke-width="7" d="M661,231 H697 M681,217 L697,231 L681,245"/>
    <rect class="pg" x="705" y="194" width="230" height="74" rx="37"/><text class="ink" x="820" y="243">completed</text>
  </g>
  <text class="n mono" x="533" y="322" text-anchor="middle" font-size="30">4 changes per 24 h</text>
  <rect class="term" x="131" y="400" width="864" height="190" rx="20"/>
  <rect class="tbar" x="131" y="400" width="864" height="50" rx="20"/>
  <rect class="tbar" x="131" y="430" width="864" height="20"/>
  <circle cx="171" cy="425" r="11" fill="#ff5f57"/><circle cx="211" cy="425" r="11" fill="#febc2e"/><circle cx="251" cy="425" r="11" fill="#28c840"/>
  <text class="tx mono" x="163" y="505" font-size="30">$ aws ec2 create-volume --volume-type gp3</text>
  <text class="tx mono" x="163" y="558" font-size="30">$ aws ec2 create-snapshot --volume-id vol-…<tspan class="a">█</tspan></text>

  <!-- center: stacked volume with snapshot badge -->
  <g transform="translate(1376,0)">
    <path class="a" d="M-150,330 V560 A150,44 0 0 0 150,560 V330 Z" opacity=".85"/>
    <ellipse class="a" cx="0" cy="330" rx="150" ry="44"/>
    <ellipse cx="0" cy="330" rx="150" ry="44" fill="#fff" opacity=".35"/>
    <path d="M-150,407 A150,44 0 0 0 150,407 M-150,484 A150,44 0 0 0 150,484" stroke="#fff" stroke-width="8" fill="none" opacity=".8"/>
    <text x="0" y="512" text-anchor="middle" font-size="58" font-weight="700" fill="#fff" class="mono">gp3</text>
    <circle class="a2" cx="150" cy="300" r="70"/>
    <rect x="112" y="276" width="76" height="52" rx="10" fill="#fff"/>
    <rect x="134" y="264" width="32" height="16" rx="4" fill="#fff"/>
    <circle class="a2" cx="150" cy="302" r="15"/>
  </g>

  <!-- top right: three feature icons -->
  <g transform="translate(1795,190) scale(1.15)">
    <path class="a" d="M30,50 V150 A70,22 0 0 0 170,150 V50 Z" opacity=".85"/>
    <ellipse class="a" cx="100" cy="50" rx="70" ry="22"/>
    <path d="M30,100 A70,22 0 0 0 170,100" stroke="#fff" stroke-width="7" fill="none"/>
  </g>
  <text class="n" x="1910" y="470" text-anchor="middle" font-size="36">volumes</text>
  <g transform="translate(2065,190) scale(1.15)">
    <rect class="a" x="20" y="56" width="160" height="112" rx="18"/>
    <rect class="a" x="70" y="34" width="60" height="30" rx="8"/>
    <circle cx="100" cy="112" r="34" fill="#fff"/><circle class="a" cx="100" cy="112" r="18"/>
  </g>
  <text class="n" x="2180" y="470" text-anchor="middle" font-size="36">snapshots</text>
  <g transform="translate(2335,190) scale(1.15)">
    <path class="al" d="M60,92 V64 A40,40 0 0 1 140,64 V92" stroke-width="18"/>
    <rect class="a" x="36" y="88" width="128" height="100" rx="16"/>
    <circle cx="100" cy="128" r="14" fill="#fff"/><rect x="93" y="134" width="14" height="32" rx="5" fill="#fff"/>
  </g>
  <text class="n" x="2450" y="470" text-anchor="middle" font-size="36">snapshot lock</text>

  <text class="h" x="1376" y="880" text-anchor="middle" font-size="150">AWS EBS Cheatsheet</text>
  <text class="s" x="1376" y="1030" text-anchor="middle" font-size="94">Block storage for EC2 from the AWS CLI</text>
  <line class="r" x1="776" y1="1105" x2="1976" y2="1105"/>
  <text class="n" x="1376" y="1210" text-anchor="middle" font-size="47">gp3 · io2 · resize · snapshots · DLM · snapshot lock · encryption · Multi-Attach</text>

  <!-- bottom row: small icons -->
  <g transform="translate(546,1290) scale(0.5)"><path class="a" d="M30,50 V150 A70,22 0 0 0 170,150 V50 Z" opacity=".85"/><ellipse class="a" cx="100" cy="50" rx="70" ry="22"/></g>
  <text class="n" x="596" y="1450" text-anchor="middle" font-size="34">volumes</text>
  <g transform="translate(806,1290) scale(0.5)"><rect class="al" x="24" y="64" width="96" height="112" rx="10" stroke-width="14"/><path class="al" stroke-width="16" d="M90,40 H176 V126 M176,40 L118,98"/></g>
  <text class="n" x="856" y="1450" text-anchor="middle" font-size="34">resize</text>
  <g transform="translate(1066,1290) scale(0.5)"><rect class="a" x="20" y="56" width="160" height="112" rx="18"/><rect class="a" x="70" y="34" width="60" height="30" rx="8"/><circle cx="100" cy="112" r="30" fill="#fff"/></g>
  <text class="n" x="1116" y="1450" text-anchor="middle" font-size="34">snapshots</text>
  <g transform="translate(1326,1290) scale(0.5)"><circle class="al" cx="100" cy="104" r="76" stroke-width="16"/><path class="al" stroke-width="16" d="M100,58 V104 L134,126"/></g>
  <text class="n" x="1376" y="1450" text-anchor="middle" font-size="34">DLM</text>
  <g transform="translate(1586,1290) scale(0.5)"><path class="al" d="M60,92 V64 A40,40 0 0 1 140,64 V92" stroke-width="18"/><rect class="a" x="36" y="88" width="128" height="100" rx="16"/></g>
  <text class="n" x="1636" y="1450" text-anchor="middle" font-size="34">lock</text>
  <g transform="translate(1846,1290) scale(0.5)"><circle class="al" cx="66" cy="100" r="40" stroke-width="18"/><path class="al" stroke-width="18" d="M106,100 H180 M150,100 V136 M176,100 V128"/></g>
  <text class="n" x="1896" y="1450" text-anchor="middle" font-size="34">encryption</text>
  <g transform="translate(2106,1290) scale(0.5)"><path class="a" d="M60,70 V130 A40,14 0 0 0 140,130 V70 Z"/><ellipse class="a" cx="100" cy="70" rx="40" ry="14"/><path class="al" stroke-width="12" d="M60,100 H18 M140,100 H182 M100,145 V184"/><circle class="a" cx="14" cy="100" r="14"/><circle class="a" cx="186" cy="100" r="14"/><circle class="a" cx="100" cy="188" r="14"/></g>
  <text class="n" x="2156" y="1450" text-anchor="middle" font-size="34">Multi-Attach</text>
</svg>
