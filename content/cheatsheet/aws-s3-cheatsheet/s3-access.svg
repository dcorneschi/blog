<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How S3 decides whether a request is allowed</title>
  <desc id="d">A request first meets explicit denies: a Deny in any policy, such as the bucket policy, the caller's IAM policy or an SCP, rejects it. Then Block Public Access rejects requests that would rely on a public bucket policy or a public ACL. Then an Allow is needed: within the same account an Allow in either the caller's IAM policy or the bucket policy is enough; across accounts both must allow. Without an Allow the request is implicitly denied. ACLs are disabled on new buckets, so they grant nothing and uploads with an ACL other than bucket-owner-full-control fail with AccessControlListNotSupported. The deny-everyone-else bucket policy is an explicit Deny for every principal except the named user.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .sub { font-size: 12px; fill: #495057; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .lb  { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
      .mc  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #212529; }
      .d   { font-size: 11px; fill: #495057; }
      .yn  { font-size: 11px; font-weight: 700; fill: #495057; }
      .lne { stroke: #495057; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .n   { fill: #f8f9fa; stroke: #dee2e6; }
      .s   { fill: #ffffff; stroke: #adb5bd; }
      .g   { fill: #e8f5ee; stroke: #75b798; }
      .x   { fill: #f8d7da; stroke: #e35d6a; }
      .rw  { fill: #f3effc; stroke: #a98eda; }
    </style>
  </defs>
  <rect width="840" height="400" fill="#ffffff"/>
  <text class="h" x="20" y="28">How S3 decides whether a request is allowed</text>
  <text class="sub" x="20" y="48">An explicit Deny always wins; otherwise something has to Allow</text>

  <!-- request -->
  <rect class="s" x="20" y="96" width="110" height="56" rx="6"/>
  <text class="tb" x="75" y="120" text-anchor="middle">request</text>
  <text class="d" x="75" y="138" text-anchor="middle">e.g. GetObject</text>
  <path class="lne" d="M130,124 L158,124"/>

  <!-- step 1 -->
  <rect class="n" x="160" y="88" width="190" height="72" rx="6"/>
  <text class="tb" x="255" y="110" text-anchor="middle">1 · explicit Deny?</text>
  <text class="d" x="255" y="128" text-anchor="middle">bucket policy, IAM policy,</text>
  <text class="d" x="255" y="143" text-anchor="middle">SCP… any of them</text>
  <path class="lne" d="M350,124 L378,124"/><text class="yn" x="356" y="117">no</text>
  <path class="lne" d="M255,160 L255,218"/><text class="yn" x="261" y="194">yes</text>

  <!-- step 2 -->
  <rect class="n" x="380" y="88" width="190" height="72" rx="6"/>
  <text class="tb" x="475" y="110" text-anchor="middle">2 · Block Public Access?</text>
  <text class="d" x="475" y="128" text-anchor="middle">access only via a public</text>
  <text class="d" x="475" y="143" text-anchor="middle">policy or public ACL</text>
  <path class="lne" d="M570,124 L598,124"/><text class="yn" x="576" y="117">no</text>
  <path class="lne" d="M475,160 L475,218"/><text class="yn" x="481" y="194">yes</text>

  <!-- step 3 -->
  <rect class="n" x="600" y="88" width="220" height="72" rx="6"/>
  <text class="tb" x="710" y="110" text-anchor="middle">3 · an Allow?</text>
  <text class="d" x="710" y="128" text-anchor="middle">same account: IAM policy or bucket</text>
  <text class="d" x="710" y="143" text-anchor="middle">policy; cross-account: both</text>
  <path class="lne" d="M660,160 L660,218"/><text class="yn" x="666" y="194">yes</text>
  <path class="lne" d="M770,160 L770,218"/><text class="yn" x="776" y="194">no</text>

  <!-- outcomes -->
  <rect class="x" x="160" y="220" width="190" height="44" rx="6"/>
  <text class="tb" x="255" y="247" text-anchor="middle">denied</text>
  <rect class="x" x="380" y="220" width="190" height="44" rx="6"/>
  <text class="tb" x="475" y="247" text-anchor="middle">denied</text>
  <rect class="g" x="600" y="220" width="110" height="44" rx="6"/>
  <text class="tb" x="655" y="247" text-anchor="middle">allowed</text>
  <rect class="x" x="718" y="220" width="102" height="44" rx="6"/>
  <text class="tb" x="769" y="240" text-anchor="middle">denied</text>
  <text class="d" x="769" y="255" text-anchor="middle">(implicit)</text>

  <!-- notes -->
  <rect class="rw" x="20" y="290" width="390" height="94" rx="6"/>
  <text class="tb" x="32" y="310">ACLs are off on new buckets</text>
  <text class="d" x="32" y="330">Object Ownership "bucket owner enforced": ACLs grant</text>
  <text class="d" x="32" y="346">nothing, and --acl other than bucket-owner-full-control</text>
  <text class="d" x="32" y="362">fails with:</text>
  <text class="mc" x="32" y="377">AccessControlListNotSupported</text>
  <rect class="rw" x="430" y="290" width="390" height="94" rx="6"/>
  <text class="tb" x="442" y="310">The deny-everyone-else policy</text>
  <text class="d" x="442" y="330">is step 1 for every principal except the named user:</text>
  <text class="d" x="442" y="346">Deny + StringNotEquals aws:PrincipalArn. Admins and</text>
  <text class="d" x="442" y="362">tool roles are locked out too unless listed; only the</text>
  <text class="d" x="442" y="377">account root user can still delete the policy.</text>
</svg>
