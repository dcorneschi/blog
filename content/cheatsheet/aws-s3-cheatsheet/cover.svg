<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AWS S3 Cheatsheet</title>
  <desc id="d">AWS S3 Cheatsheet: Buckets, objects and permissions from the AWS CLI. cp, sync, presign, versioning, encryption, lifecycle, storage classes. Small drawings: STANDARD, STANDARD_IA and GLACIER lifecycle transitions; a terminal running aws s3 cp with its upload line; a bucket with objects; icons for versioning, bucket policy and lifecycle; small icons for buckets, upload, presigned URLs, versions, encryption, lifecycle and website hosting.</desc>
  <defs>
    <style>
      .bg  { fill: #f8f9fa; }
      .a   { fill: #f59f00; }
      .a2  { fill: #232f3e; }
      .al  { stroke: #f59f00; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ink { fill: #343a40; }
      .h   { font-weight: 700; fill: #212529; letter-spacing: -2px; }
      .s   { fill: #495057; }
      .n   { fill: #868e96; }
      .r   { stroke: #dee2e6; stroke-width: 2; }
      .pn  { fill: #ffffff; stroke: #adb5bd; stroke-width: 5; }
      .pb  { fill: #e7f1ff; stroke: #6ea8fe; stroke-width: 5; }
      .pv  { fill: #f3effc; stroke: #a98eda; stroke-width: 5; }
      .term{ fill: #212529; }
      .tbar{ fill: #343a40; }
      .tx  { fill: #e9ecef; }
      .tg  { fill: #8ce99a; }
      .mono{ font-family: Menlo, Consolas, 'Liberation Mono', monospace; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #161b22; }
        .a2  { fill: #8b949e; }
        .ink { fill: #c9d1d9; }
        .h   { fill: #f0f6fc; }
        .s   { fill: #c9d1d9; }
        .n   { fill: #8b949e; }
        .r   { stroke: #30363d; }
        .pn  { fill: #0d1117; stroke: #484f58; }
        .pb  { fill: #0c2340; stroke: #3d6fb8; }
        .pv  { fill: #1f1830; stroke: #7d63b0; }
        .term{ fill: #0d1117; stroke: #30363d; stroke-width: 4; }
        .tbar{ fill: #21262d; }
      }
    </style>
  </defs>
  <rect class="bg" width="2752" height="1536"/>

  <!-- top left: storage class transitions and terminal -->
  <g class="mono" font-size="30" font-weight="700" text-anchor="middle">
    <rect class="pn" x="131" y="194" width="220" height="70" rx="35"/><text class="ink" x="241" y="240">STANDARD</text>
    <path class="al" stroke-width="7" d="M359,229 H395 M379,215 L395,229 L379,243"/>
    <rect class="pb" x="403" y="194" width="260" height="70" rx="35"/><text class="ink" x="533" y="240">STANDARD_IA</text>
    <path class="al" stroke-width="7" d="M671,229 H707 M691,215 L707,229 L691,243"/>
    <rect class="pv" x="715" y="194" width="200" height="70" rx="35"/><text class="ink" x="815" y="240">GLACIER</text>
  </g>
  <text class="n mono" x="523" y="318" text-anchor="middle" font-size="30">30 days → 90 days</text>
  <rect class="term" x="131" y="400" width="840" height="190" rx="20"/>
  <rect class="tbar" x="131" y="400" width="840" height="50" rx="20"/>
  <rect class="tbar" x="131" y="430" width="840" height="20"/>
  <circle cx="171" cy="425" r="11" fill="#ff5f57"/><circle cx="211" cy="425" r="11" fill="#febc2e"/><circle cx="251" cy="425" r="11" fill="#28c840"/>
  <text class="tx mono" x="163" y="505" font-size="28">$ aws s3 cp file.txt s3://my-bucket/</text>
  <text class="tg mono" x="163" y="558" font-size="28">upload: ./file.txt to s3://my-bucket/file.txt<tspan class="a">█</tspan></text>

  <!-- center: bucket with objects -->
  <g transform="translate(1376,0)">
    <path class="a" d="M-170,300 H170 L140,560 H-140 Z"/>
    <ellipse class="a" cx="0" cy="300" rx="170" ry="40"/>
    <ellipse cx="0" cy="300" rx="170" ry="40" fill="#fff" opacity=".35"/>
    <ellipse cx="0" cy="560" rx="140" ry="28" class="a"/>
    <text x="0" y="450" text-anchor="middle" font-size="72" font-weight="700" fill="#fff" class="mono">S3</text>
    <g transform="translate(186,150)">
      <path class="pn" d="M0,0 H60 L84,24 V110 H0 Z"/>
      <path d="M14,46 H70 M14,66 H70 M14,86 H52" stroke="#adb5bd" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="translate(-270,170)">
      <path class="pn" d="M0,0 H60 L84,24 V110 H0 Z"/>
      <path d="M14,46 H70 M14,66 H70 M14,86 H52" stroke="#adb5bd" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- top right: three feature icons -->
  <g transform="translate(1795,190) scale(1.15)">
    <rect class="a" x="70" y="20" width="100" height="130" rx="12" opacity=".45"/>
    <rect class="a" x="50" y="40" width="100" height="130" rx="12" opacity=".7"/>
    <rect class="a" x="30" y="60" width="100" height="130" rx="12"/>
  </g>
  <text class="n" x="1910" y="470" text-anchor="middle" font-size="36">versioning</text>
  <g transform="translate(2065,190) scale(1.15)">
    <path class="al" d="M60,92 V64 A40,40 0 0 1 140,64 V92" stroke-width="18"/>
    <rect class="a" x="36" y="88" width="128" height="100" rx="16"/>
    <circle cx="100" cy="128" r="14" fill="#fff"/><rect x="93" y="134" width="14" height="32" rx="5" fill="#fff"/>
  </g>
  <text class="n" x="2180" y="470" text-anchor="middle" font-size="36">bucket policy</text>
  <g transform="translate(2335,190) scale(1.15)">
    <circle class="al" cx="100" cy="104" r="76" stroke-width="18"/>
    <path class="al" stroke-width="18" d="M100,58 V104 L136,126"/>
  </g>
  <text class="n" x="2450" y="470" text-anchor="middle" font-size="36">lifecycle</text>

  <text class="h" x="1376" y="880" text-anchor="middle" font-size="150">AWS S3 Cheatsheet</text>
  <text class="s" x="1376" y="1030" text-anchor="middle" font-size="94">Buckets, objects and permissions from the AWS CLI</text>
  <line class="r" x1="776" y1="1105" x2="1976" y2="1105"/>
  <text class="n" x="1376" y="1210" text-anchor="middle" font-size="47">cp · sync · presign · versioning · encryption · lifecycle · storage classes · CLI 2.39.3</text>

  <!-- bottom row: small icons -->
  <g transform="translate(546,1290) scale(0.5)"><path class="a" d="M30,60 H170 L150,180 H50 Z"/><ellipse class="a" cx="100" cy="60" rx="70" ry="18"/></g>
  <text class="n" x="596" y="1450" text-anchor="middle" font-size="34">buckets</text>
  <g transform="translate(806,1290) scale(0.5)"><path class="al" stroke-width="18" d="M100,170 V40 M50,90 L100,40 L150,90"/><path class="al" stroke-width="18" d="M30,180 H170"/></g>
  <text class="n" x="856" y="1450" text-anchor="middle" font-size="34">cp / sync</text>
  <g transform="translate(1066,1290) scale(0.5)"><path class="al" stroke-width="18" d="M86,114 L114,86 M70,96 L48,118 A28,28 0 0 0 88,158 L110,136 M130,104 L152,82 A28,28 0 0 0 112,42 L90,64"/></g>
  <text class="n" x="1116" y="1450" text-anchor="middle" font-size="34">presign</text>
  <g transform="translate(1326,1290) scale(0.5)"><rect class="a" x="70" y="20" width="100" height="130" rx="12" opacity=".45"/><rect class="a" x="50" y="40" width="100" height="130" rx="12" opacity=".7"/><rect class="a" x="30" y="60" width="100" height="130" rx="12"/></g>
  <text class="n" x="1376" y="1450" text-anchor="middle" font-size="34">versions</text>
  <g transform="translate(1586,1290) scale(0.5)"><circle class="al" cx="66" cy="100" r="40" stroke-width="18"/><path class="al" stroke-width="18" d="M106,100 H180 M150,100 V136 M176,100 V128"/></g>
  <text class="n" x="1636" y="1450" text-anchor="middle" font-size="34">encryption</text>
  <g transform="translate(1846,1290) scale(0.5)"><circle class="al" cx="100" cy="104" r="76" stroke-width="16"/><path class="al" stroke-width="16" d="M100,58 V104 L134,126"/></g>
  <text class="n" x="1896" y="1450" text-anchor="middle" font-size="34">lifecycle</text>
  <g transform="translate(2106,1290) scale(0.5)"><circle class="al" cx="100" cy="100" r="80" stroke-width="14"/><path class="al" stroke-width="12" d="M20,100 H180 M100,20 C60,60 60,140 100,180 M100,20 C140,60 140,140 100,180"/></g>
  <text class="n" x="2156" y="1450" text-anchor="middle" font-size="34">website</text>
</svg>
