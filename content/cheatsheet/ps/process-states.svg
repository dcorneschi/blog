<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Linux process states</title>
  <desc id="d">fork or clone creates a process in state R (running on a CPU or waiting in the run queue). Waiting for an event moves it to S (interruptible sleep); the event or a signal brings it back to R. Disk or NFS I/O moves it to D (uninterruptible sleep) until the I/O is done; signals, usually even SIGKILL, wait until then. SIGSTOP or Ctrl-z (SIGTSTP) moves it to T (stopped; t when traced by a debugger), SIGCONT back to R. exit or a fatal signal makes it Z (zombie) until the parent calls wait, then it is removed. Load average counts R and D tasks.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .box  { stroke-width: 1.5; }
      .st   { font-size: 22px; font-weight: 700; fill: #212529; }
      .tb   { font-size: 14px; font-weight: 700; fill: #212529; }
      .tc   { font-size: 14px; font-weight: 700; fill: #212529; text-anchor: middle; }
      .d    { font-size: 11px; fill: #495057; }
      .dc   { font-size: 11px; fill: #495057; text-anchor: middle; }
      .de   { font-size: 11px; fill: #495057; text-anchor: end; }
      .m    { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #212529; }
      .lne  { stroke: #495057; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    </style>
  </defs>

  <rect width="900" height="590" fill="#ffffff"/>

  <!-- start -->
  <rect class="box" x="360" y="20" width="180" height="34" rx="17" fill="#f8f9fa" stroke="#adb5bd"/>
  <text class="tc" x="450" y="42">fork() / clone()</text>
  <path class="lne" d="M450,54 V128"/>
  <text class="d" x="460" y="96">new process</text>

  <!-- S -->
  <rect class="box" x="30" y="130" width="200" height="100" rx="8" fill="#e7f1ff" stroke="#6ea8fe"/>
  <text class="st" x="46" y="160">S</text>
  <text class="tb" x="70" y="158">Interruptible sleep</text>
  <text class="d" x="46" y="184">waits for an event: socket,</text>
  <text class="d" x="46" y="200">pipe, timer, child, input</text>
  <text class="d" x="46" y="218">most processes, most of the time</text>

  <!-- R -->
  <rect class="box" x="350" y="130" width="200" height="100" rx="8" fill="#d1e7dd" stroke="#75b798"/>
  <text class="st" x="366" y="160">R</text>
  <text class="tb" x="390" y="158">Running / runnable</text>
  <text class="d" x="366" y="184">on a CPU, or waiting in</text>
  <text class="d" x="366" y="200">the run queue for one</text>
  <text class="d" x="366" y="218">counts in the load average</text>

  <!-- T -->
  <rect class="box" x="670" y="130" width="200" height="100" rx="8" fill="#fff3cd" stroke="#e0c46c"/>
  <text class="st" x="686" y="160">T</text>
  <text class="tb" x="710" y="158">Stopped</text>
  <text class="d" x="686" y="184">suspended, keeps its memory</text>
  <text class="d" x="686" y="200">t = stopped by a debugger</text>
  <text class="d" x="686" y="218">(ptrace)</text>

  <!-- R <-> S -->
  <path class="lne" d="M350,165 H232"/>
  <text class="dc" x="291" y="157">waits for an event</text>
  <path class="lne" d="M230,195 H348"/>
  <text class="dc" x="291" y="212">event or signal</text>

  <!-- R <-> T -->
  <path class="lne" d="M550,165 H668"/>
  <text class="dc" x="610" y="140">SIGSTOP,</text>
  <text class="dc" x="610" y="155">Ctrl-z (SIGTSTP)</text>
  <path class="lne" d="M670,195 H552"/>
  <text class="dc" x="610" y="212">SIGCONT (fg, bg)</text>

  <!-- D -->
  <rect class="box" x="350" y="330" width="200" height="100" rx="8" fill="#f8d7da" stroke="#e48b93"/>
  <text class="st" x="366" y="360">D</text>
  <text class="tb" x="390" y="358">Uninterruptible sleep</text>
  <text class="d" x="366" y="384">waits for disk or NFS I/O</text>
  <text class="d" x="366" y="400">signals wait, usually even SIGKILL</text>
  <text class="d" x="366" y="418">counts in the load average</text>

  <path class="lne" d="M400,230 V328"/>
  <text class="de" x="390" y="276">disk or</text>
  <text class="de" x="390" y="290">NFS I/O</text>
  <path class="lne" d="M450,330 V232"/>
  <text class="d" x="460" y="300">I/O done</text>

  <!-- Z -->
  <path class="lne" d="M530,230 V280 H770 V328"/>
  <text class="d" x="580" y="272">exit(), or a fatal signal</text>
  <rect class="box" x="670" y="330" width="200" height="100" rx="8" fill="#ece6f5" stroke="#a993c9"/>
  <text class="st" x="686" y="360">Z</text>
  <text class="tb" x="710" y="358">Zombie</text>
  <text class="d" x="686" y="384">already exited: no memory,</text>
  <text class="d" x="686" y="400">no CPU, only a PID and</text>
  <text class="d" x="686" y="418">its exit status</text>

  <path class="lne" d="M770,430 V478"/>
  <text class="d" x="780" y="458">parent calls wait()</text>
  <rect class="box" x="680" y="480" width="180" height="34" rx="17" fill="#f8f9fa" stroke="#adb5bd"/>
  <text class="tc" x="770" y="502">removed, PID freed</text>

  <!-- notes -->
  <rect class="box" x="30" y="460" width="600" height="110" rx="8" fill="#f8f9fa" stroke="#adb5bd"/>
  <text class="d" x="46" y="484" style="fill:#212529;font-weight:700">Good to know</text>
  <text class="d" x="46" y="504">• kill -9 on a D process only acts when its I/O returns: look at the disk or NFS server instead.</text>
  <text class="d" x="46" y="522">• A zombie can't be killed, it already exited: fix or restart its parent.</text>
  <text class="d" x="46" y="540">• S and T processes get signals at once: SIGKILL also ends a stopped (T) process.</text>
  <text class="d" x="46" y="558">• See the state: </text>
  <text class="m" x="128" y="558">ps -eo state,pid,cmd</text>
  <text class="d" x="270" y="558">· count by state:</text>
  <text class="m" x="358" y="558">ps -e h -o stat | sort | uniq -c</text>
</svg>
