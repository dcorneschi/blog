  <title id="t">Linux Processes and Signals</title>
  <desc id="d">Linux Processes and Signals: ps, pgrep, pkill, pstree and top. process states, signals, threads, sorting, format specifiers, kill, pgrep, pstree. Small drawings: fork, running, zombie; a terminal running pgrep -af '&lt;pattern&gt;' and pkill -u username; pstree, signals, top; icons for ps, pgrep, kill, pstree, top, threads, format.</desc>
