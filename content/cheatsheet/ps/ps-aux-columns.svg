<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Reading a ps aux line</title>
  <desc id="d">A real line from ps aux on Ubuntu 24.04: root, PID 294, 0.0 percent CPU, 0.0 percent memory, VSZ 10440 KiB, RSS 1608 KiB, TTY question mark, STAT Ss, START 13:15, TIME 0:00, COMMAND nginx: master process nginx. USER is the effective user; %CPU is CPU time divided by run time; %MEM is RSS divided by total RAM; VSZ is virtual memory and RSS the part in RAM, both in KiB; TTY question mark means no terminal; STAT is the state plus flags; START is the start time, or the date for older processes; TIME is CPU time used; COMMAND is the command line. State letters: R running, S sleeping, D waiting for I/O, T stopped, Z zombie, I idle kernel thread. Flags: s session leader, l multi-threaded, + foreground process group, &lt; high priority, N low priority. Ss means a sleeping session leader.</desc>
  <style>
    .box { stroke-width: 1.5; }
    .th  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; font-weight: 700; fill: #adb5bd; }
    .tl  { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; fill: #f8f9fa; }
    .ln  { font-size: 13px; font-weight: 700; fill: #212529; }
    .ld  { font-size: 11px; fill: #495057; }
    .ldr { stroke: #6ea8fe; stroke-width: 1.3; fill: none; }
    .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
    .k   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; font-weight: 700; fill: #212529; }
    .d   { font-size: 11px; fill: #495057; }
  </style>

  <rect width="900" height="520" fill="#ffffff"/>
  <text class="tb" x="20" y="26">ps aux, one line explained (nginx master process, Ubuntu 24.04)</text>

  <rect class="box" x="16" y="176" width="868" height="62" rx="6" fill="#212529" stroke="#212529"/>
  <text class="th" x="34.0" y="200">USER</text>
  <text class="th" x="143.2" y="200">PID</text>
  <text class="th" x="176.8" y="200">%CPU</text>
  <text class="th" x="218.8" y="200">%MEM</text>
  <text class="th" x="286.0" y="200">VSZ</text>
  <text class="th" x="336.4" y="200">RSS</text>
  <text class="th" x="370.0" y="200">TTY</text>
  <text class="th" x="445.6" y="200">STAT</text>
  <text class="th" x="487.6" y="200">START</text>
  <text class="th" x="554.8" y="200">TIME</text>
  <text class="th" x="596.8" y="200">COMMAND</text>
  <text class="tl" x="34.0" y="224">root</text>
  <text class="tl" x="143.2" y="224">294</text>
  <text class="tl" x="185.2" y="224">0.0</text>
  <text class="tl" x="227.2" y="224">0.0</text>
  <text class="tl" x="269.2" y="224">10440</text>
  <text class="tl" x="328.0" y="224">1608</text>
  <text class="tl" x="370.0" y="224">?</text>
  <text class="tl" x="445.6" y="224">Ss</text>
  <text class="tl" x="487.6" y="224">13:15</text>
  <text class="tl" x="554.8" y="224">0:00</text>
  <text class="tl" x="596.8" y="224">nginx:</text>
  <text class="tl" x="655.6" y="224">master</text>
  <text class="tl" x="714.4" y="224">process</text>
  <text class="tl" x="781.6" y="224">nginx</text>

  <text class="ln" x="34.0" y="60" style="text-anchor:start">USER</text>
  <text class="ld" x="34.0" y="76" style="text-anchor:start">owner (effective user)</text>
  <path class="ldr" d="M50.8,84 V176"/>
  <text class="ln" x="155.8" y="268" style="text-anchor:middle">PID</text>
  <text class="ld" x="155.8" y="284" style="text-anchor:middle">process ID</text>
  <path class="ldr" d="M155.8,238 V252"/>
  <text class="ln" x="193.6" y="118" style="text-anchor:middle">%CPU</text>
  <text class="ld" x="193.6" y="134" style="text-anchor:middle">CPU time ÷ run time</text>
  <path class="ldr" d="M193.6,142 V176"/>
  <text class="ln" x="235.6" y="326" style="text-anchor:middle">%MEM</text>
  <text class="ld" x="235.6" y="342" style="text-anchor:middle">RSS ÷ total RAM</text>
  <path class="ldr" d="M235.6,238 V310"/>
  <text class="ln" x="290.2" y="60" style="text-anchor:middle">VSZ</text>
  <text class="ld" x="290.2" y="76" style="text-anchor:middle">virtual memory, KiB</text>
  <path class="ldr" d="M290.2,84 V176"/>
  <text class="ln" x="344.8" y="268" style="text-anchor:middle">RSS</text>
  <text class="ld" x="344.8" y="284" style="text-anchor:middle">in RAM now, KiB</text>
  <path class="ldr" d="M344.8,238 V252"/>
  <text class="ln" x="382.6" y="118" style="text-anchor:middle">TTY</text>
  <text class="ld" x="382.6" y="134" style="text-anchor:middle">terminal · ? = none</text>
  <path class="ldr" d="M382.6,142 V176"/>
  <text class="ln" x="462.4" y="326" style="text-anchor:middle">STAT</text>
  <text class="ld" x="462.4" y="342" style="text-anchor:middle">state + flags (see below)</text>
  <path class="ldr" d="M462.4,238 V310"/>
  <text class="ln" x="508.6" y="60" style="text-anchor:middle">START</text>
  <text class="ld" x="508.6" y="76" style="text-anchor:middle">start time, or date if older</text>
  <path class="ldr" d="M508.6,84 V176"/>
  <text class="ln" x="571.6" y="268" style="text-anchor:middle">TIME</text>
  <text class="ld" x="571.6" y="284" style="text-anchor:middle">CPU time used</text>
  <path class="ldr" d="M571.6,238 V252"/>
  <text class="ln" x="622.0" y="118" style="text-anchor:middle">COMMAND</text>
  <text class="ld" x="622.0" y="134" style="text-anchor:middle">command line (args)</text>
  <path class="ldr" d="M622.0,142 V176"/>

  <!-- STAT legend -->
  <rect class="box" x="16" y="370" width="868" height="134" rx="8" fill="#f8f9fa" stroke="#adb5bd"/>
  <text class="tb" x="32" y="394">STAT = state letter + flags · Ss = sleeping (S) session leader (s)</text>
  <text class="d" x="32" y="418" style="font-weight:700;fill:#212529">State</text>
  <text class="k" x="32" y="440">R</text><text class="d" x="48" y="440">running or runnable</text>
  <text class="k" x="32" y="460">S</text><text class="d" x="48" y="460">sleeping, waits for an event</text>
  <text class="k" x="32" y="480">D</text><text class="d" x="48" y="480">waits for I/O, uninterruptible</text>
  <text class="k" x="250" y="440">T</text><text class="d" x="266" y="440">stopped (t = traced)</text>
  <text class="k" x="250" y="460">Z</text><text class="d" x="266" y="460">zombie, exited</text>
  <text class="k" x="250" y="480">I</text><text class="d" x="266" y="480">idle kernel thread</text>
  <text class="d" x="470" y="418" style="font-weight:700;fill:#212529">Flags</text>
  <text class="k" x="470" y="440">s</text><text class="d" x="488" y="440">session leader</text>
  <text class="k" x="470" y="460">l</text><text class="d" x="488" y="460">multi-threaded</text>
  <text class="k" x="470" y="480">+</text><text class="d" x="488" y="480">foreground process group</text>
  <text class="k" x="670" y="440">&lt;</text><text class="d" x="688" y="440">high priority (nice &lt; 0)</text>
  <text class="k" x="670" y="460">N</text><text class="d" x="688" y="460">low priority (nice &gt; 0)</text>
  <text class="k" x="670" y="480">L</text><text class="d" x="688" y="480">pages locked in memory</text>
</svg>
