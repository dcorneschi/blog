<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Docker Compose Cheatsheet</title>
  <desc id="d">Docker Compose Cheatsheet: Multi-container apps with Compose v2. up, down, logs, exec, run, build, config, profiles, watch, environment variables. Small drawings: up, running, down; a terminal running docker compose version and docker compose up -d; services, volumes, compose.yaml; icons for up, down, logs, exec, config, profiles, watch.</desc>
  <defs>
    <style>
