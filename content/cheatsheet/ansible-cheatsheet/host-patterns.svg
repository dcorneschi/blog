  <rect class="n" x="20" y="410" width="800" height="30" rx="4"/>
  <text class="c" x="32" y="429">Slices include both ends: [0:1] is two hosts. Quote patterns in the shell (! and &amp; are shell characters). A comma works like a colon.</text>
