  <title id="t">Ansible Cheatsheet</title>
  <desc id="d">Ansible Cheatsheet: Ad-hoc commands, playbooks, roles, vault and templates. inventory, host patterns, variables, loops, handlers, galaxy, ansible.cfg, debugger. Small drawings: inventory, playbook and hosts pills, a terminal with ansible all -m ping and ansible-playbook site.yml --check, and icons for ad-hoc commands, vault and roles.</desc>
