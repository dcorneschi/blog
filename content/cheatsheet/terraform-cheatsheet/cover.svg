  <title id="t">Terraform Cheatsheet</title>
  <desc id="d">Terraform Cheatsheet: Mastering Infrastructure as Code. init, plan, apply, state, workspaces, variables, modules, S3 backend, CI/CD. Small drawings: init, plan, apply; a terminal running terraform init and terraform plan; .tf files, state, providers; icons for init, plan, apply, state, workspaces, modules, S3 backend.</desc>
