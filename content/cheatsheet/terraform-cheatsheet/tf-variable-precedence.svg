<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Terraform variable precedence</title>
  <desc id="d">One variable v set in every place, adding one source at a time on Terraform 1.16, and the value Terraform used each time. Default in the variable block: default. Plus TF_VAR_v environment variable: env. Plus terraform.tfvars: tfvars. Plus terraform.tfvars.json: tfvars.json. Plus a.auto.tfvars and b.auto.tfvars: b.auto, the last file in alphabetical order. Plus -var and -var-file on the command line: whichever comes last on the command line; -var-file=f.tfvars -var v=cli gives cli, -var v=cli -var-file=f.tfvars gives file.</desc>
  <defs>
    <style>
      .h   { font-size: 15px; font-weight: 700; fill: #212529; }
      .tb  { font-size: 13px; font-weight: 700; fill: #212529; }
      .d   { font-size: 11px; fill: #495057; }
      .m   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11.5px; fill: #212529; }
      .v   { font-family: Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; font-weight: 700; fill: #146c43; }
      .n   { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <rect width="900" height="420" fill="#ffffff"/>
  <text class="h" x="20" y="28">Variable precedence: each step up overrides everything below it</text>
  <text class="d" x="560" y="56">value of var.v after adding this source</text>

  <!-- steps: bottom (lowest) to top; x grows with priority -->
  <rect x="20"  y="330" width="520" height="40" rx="6" fill="#f1f3f5" stroke="#ced4da"/>
  <circle cx="40" cy="350" r="11" fill="#868e96"/><text class="n" x="40" y="355">6</text>
  <text class="tb" x="60" y="347">default in the variable block</text><text class="m" x="60" y="362">variable "v" { default = "default" }</text>
  <text class="v" x="560" y="355">"default"</text>

  <rect x="40"  y="284" width="500" height="40" rx="6" fill="#e7f1ff" stroke="#a5c8ff"/>
  <circle cx="60" cy="304" r="11" fill="#6ea8fe"/><text class="n" x="60" y="309">5</text>
  <text class="tb" x="80" y="301">environment variable</text><text class="m" x="80" y="316">export TF_VAR_v=env</text>
  <text class="v" x="560" y="309">"env"</text>

  <rect x="60"  y="238" width="480" height="40" rx="6" fill="#d0e3ff" stroke="#6ea8fe"/>
  <circle cx="80" cy="258" r="11" fill="#3d7fe0"/><text class="n" x="80" y="263">4</text>
  <text class="tb" x="100" y="255">terraform.tfvars</text><text class="m" x="100" y="270">v = "tfvars"</text>
  <text class="v" x="560" y="263">"tfvars"</text>

  <rect x="80"  y="192" width="460" height="40" rx="6" fill="#b6d4fe" stroke="#3d7fe0"/>
  <circle cx="100" cy="212" r="11" fill="#2b65c4"/><text class="n" x="100" y="217">3</text>
  <text class="tb" x="120" y="209">terraform.tfvars.json</text><text class="m" x="120" y="224">{"v": "tfvars.json"}</text>
  <text class="v" x="560" y="217">"tfvars.json"</text>

  <rect x="100" y="146" width="440" height="40" rx="6" fill="#9ec5fe" stroke="#2b65c4"/>
  <circle cx="120" cy="166" r="11" fill="#1d4f9e"/><text class="n" x="120" y="171">2</text>
  <text class="tb" x="140" y="163">*.auto.tfvars, *.auto.tfvars.json</text><text class="m" x="140" y="178">a.auto.tfvars, b.auto.tfvars</text>
  <text class="v" x="560" y="171">"b.auto"</text><text class="d" x="640" y="171">the last file alphabetically wins</text>

  <rect x="120" y="100" width="420" height="40" rx="6" fill="#3d7fe0" stroke="#1d4f9e"/>
  <circle cx="140" cy="120" r="11" fill="#ffffff"/><text class="n" x="140" y="125" style="fill:#1d4f9e">1</text>
  <text class="tb" x="160" y="117" style="fill:#ffffff">-var and -var-file on the command line</text><text class="m" x="160" y="132" style="fill:#ffffff">same level: the last one given wins</text>
  <text class="m" x="560" y="114">-var-file=f.tfvars -var v=cli  →</text><text class="v" x="808" y="114">"cli"</text>
  <text class="m" x="560" y="132">-var v=cli -var-file=f.tfvars  →</text><text class="v" x="808" y="132">"file"</text>

  <text class="d" x="20" y="88">highest</text>
  <text class="d" x="20" y="392">lowest. No value anywhere and no default: Terraform prompts, or fails with -input=false.</text>
  <text class="d" x="20" y="410">Each row is one more source added to the same directory, on Terraform 1.16; the green value is what var.v resolved to.</text>
</svg>
