  <title id="t">fzf Cheatsheet</title>
  <desc id="d">fzf Cheatsheet: The command-line fuzzy finder, with ready-made functions. CTRL-R, CTRL-T, ALT-C, search syntax, --preview, --multi, fd, bat, git, kubectl, docker. Small drawings: list, query, pick; a terminal running eval "$(fzf --bash)" and vim "$(fzf)"; fuzzy match, CTRL-R, ALT-C; icons for CTRL-R, CTRL-T, ALT-C, --preview, git, AWS, docker.</desc>
