  <title id="t">Argo CD Cheatsheet</title>
  <desc id="d">Argo CD Cheatsheet: GitOps with kubectl and the argocd CLI. apps, sync, refresh, ApplicationSets, waves, hooks, prune, projects, admin, errors. Small drawings: sync, diff, wave; a terminal running argocd app sync guestbook and argocd app diff guestbook; apps, sync, hooks; icons for appset, waves, projects, prune, rbac, ignoreDiff, admin.</desc>
